<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="net-config.js"></script>
<style>
:root{
  --bg:#0b0c10; --s1:#13151b; --s2:#191c24; --s3:#20242e;
  --line:#272b36; --line2:#1d2029;
  --tx:#eceef4; --mu:#8c93a6; --fa:#5d6479;
  --ac:#6482ff; --ac2:#8da2ff; --acd:rgba(100,130,255,.14);
  --up:#3ddc97; --upd:rgba(61,220,151,.13);
  --dn:#ff5c70; --dnd:rgba(255,92,112,.13);
  --am:#ffb547; --amd:rgba(255,181,71,.13);
  --r:14px;
  --ui:'Geist',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 var(--ui);-webkit-font-smoothing:antialiased}
body{min-height:100vh;padding:0 0 80px}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--tx)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.up{color:var(--up)}.dn{color:var(--dn)}.am{color:var(--am)}.mu{color:var(--mu)}

/* layout */
.wrap{max-width:1180px;margin:0 auto;padding:18px 16px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.eyebrow{font:500 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ac2)}
h1{margin:2px 0 0;font-size:26px;letter-spacing:-.02em;font-weight:650}
.sub{color:var(--mu);font-size:13px;margin-top:2px}
.btn{border:1px solid var(--line);background:var(--s2);border-radius:10px;padding:9px 14px;font-weight:550;font-size:13px;transition:.15s}
.btn:hover{border-color:var(--fa);background:var(--s3)}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff}
.btn.pri:hover{background:#7b95ff}
.btn.ghost{background:transparent}
.btn.dng{color:var(--dn);border-color:rgba(255,92,112,.35)}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:8px}
.tabs{display:flex;gap:4px;background:var(--s1);border:1px solid var(--line2);border-radius:12px;padding:4px;width:max-content;max-width:100%;overflow:auto;margin-bottom:16px}
.tabs button{border:0;background:transparent;padding:8px 16px;border-radius:9px;color:var(--mu);font-weight:550;font-size:13px}
.tabs button.on{background:var(--s3);color:var(--tx);box-shadow:inset 0 0 0 1px var(--line)}
.card{background:var(--s1);border:1px solid var(--line2);border-radius:var(--r);padding:16px}
.card h3{margin:0 0 12px;font-size:13px;font-weight:600;letter-spacing:.02em}
.card h3 small{color:var(--mu);font-weight:400;margin-left:6px}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
@media(max-width:900px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr}.g2{grid-template-columns:1fr}}
.kpi{background:var(--s1);border:1px solid var(--line2);border-radius:var(--r);padding:14px}
.kpi small{display:block;color:var(--mu);font-size:11.5px;margin-bottom:4px}
.kpi b{font:600 22px var(--mono);letter-spacing:-.02em}
.kpi i{display:block;font-style:normal;color:var(--fa);font-size:11px;margin-top:2px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--s2);border-radius:99px;padding:3px 10px;font-size:11.5px;color:var(--mu);white-space:nowrap}
.chip.up{color:var(--up);background:var(--upd);border-color:transparent}
.chip.dn{color:var(--dn);background:var(--dnd);border-color:transparent}
.chip.am{color:var(--am);background:var(--amd);border-color:transparent}
.chip.ac{color:var(--ac2);background:var(--acd);border-color:transparent}
.note{color:var(--mu);font-size:12.5px}
.empty{padding:36px 16px;text-align:center;color:var(--mu)}
.empty b{display:block;color:var(--tx);font-size:16px;margin-bottom:4px}

/* trade list */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.fchip{border:1px solid var(--line);background:transparent;border-radius:99px;padding:5px 12px;font-size:12.5px;color:var(--mu)}
.fchip.on{background:var(--acd);border-color:var(--ac);color:var(--tx)}
.tlist{display:grid;gap:10px}
.trow{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;background:var(--s1);border:1px solid var(--line2);border-radius:var(--r);padding:12px 14px;cursor:pointer;transition:.15s}
.trow:hover{border-color:var(--line);background:var(--s2)}
.av{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font:600 12px var(--mono);background:var(--s3);border:1px solid var(--line)}
.trow .m1{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.trow .m1 b{font-size:15px}
.trow .m2{color:var(--mu);font-size:12px;margin-top:3px;display:flex;gap:10px;flex-wrap:wrap}
.trow .rt{text-align:right}
.trow .rt b{font:600 17px var(--mono)}
.trow .rt small{display:block;color:var(--mu);font-size:11px}
.side-l{color:var(--up)}.side-s{color:var(--dn)}

/* sheet */
.ov{position:fixed;inset:0;background:rgba(5,6,9,.72);z-index:50;display:none;backdrop-filter:blur(3px)}
.ov.open{display:block}
.sheet{position:absolute;inset:0 0 0 0;background:var(--bg);overflow:auto;animation:up .22s ease}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@media(min-width:1100px){.sheet{inset:20px 40px;border:1px solid var(--line);border-radius:18px}}
.sh-head{position:sticky;top:0;z-index:5;background:rgba(11,12,16,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line2);padding:12px 16px;display:flex;align-items:center;gap:10px}
.sh-head h2{margin:0;font-size:16px;flex:1}
.sh-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:16px;padding:16px}
@media(max-width:1000px){.sh-body{grid-template-columns:1fr}}
.col{display:grid;gap:12px;align-content:start}
.sticky{position:sticky;top:64px}
@media(max-width:1000px){.sticky{position:static}}
/* Phones / narrow screens: show the chart right after the coin picker, above Long/Short.
   The wrappers are flattened with display:contents so the cards can be re-ordered; desktop is untouched. */
@media(max-width:1000px){
  .sh-body > .col, .sh-body > .col > .sticky, #instCard{display:contents !important} /* !important: .sticky carries an inline display:grid */
  .inst-a,.inst-b{background:var(--s1);border:1px solid var(--line2);border-radius:var(--r);padding:16px}
  .inst-b > .row:first-child{margin-top:0 !important}
  .inst-a{order:-3}
  .chartbox{order:-2}
  .inst-b{order:-1}
}
.fld{display:grid;gap:5px;margin-bottom:10px}
.fld>label,.lbl{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mu)}
.in{width:100%;background:var(--s2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;outline:none;font-family:var(--mono);font-size:14px}
.in:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--acd)}
select.in{font-family:var(--ui)}
.row{display:flex;gap:8px;align-items:center}
.row>*{min-width:0}
.row .in{flex:1}
input[type=datetime-local].in{min-width:0;width:100%;max-width:100%;font-size:13px}
.row.wrapm{flex-wrap:wrap}
.seg{display:inline-flex;background:var(--s2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:7px;color:var(--mu);font-size:13px;font-weight:550}
.seg button.on{background:var(--s3);color:var(--tx);box-shadow:inset 0 0 0 1px var(--line)}
.seg.long button.on{background:var(--upd);color:var(--up);box-shadow:inset 0 0 0 1px rgba(61,220,151,.4)}
.seg.short button.on{background:var(--dnd);color:var(--dn);box-shadow:inset 0 0 0 1px rgba(255,92,112,.4)}
@media(max-width:480px){.seg-row .seg{min-width:0;padding:2px;gap:0}.seg-row .seg button{padding:6px 8px;font-size:12px}}
.coinbtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.coinbtn:hover{border-color:var(--ac)}
.coinbtn .ph{color:var(--mu)}
.atr{border:1px dashed var(--line);border-radius:12px;padding:10px;margin-top:8px;background:rgba(100,130,255,.04)}
.atr .row{margin-top:8px}
.atr label.sm{font-size:11px;color:var(--mu);display:block;margin-bottom:3px}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;user-select:none}
.chk input{accent-color:var(--ac);width:16px;height:16px}
.sumgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media(max-width:600px){.sumgrid{grid-template-columns:repeat(2,1fr)}}
.sumgrid div{background:var(--s2);border:1px solid var(--line2);border-radius:10px;padding:8px 10px}
.sumgrid small{display:block;color:var(--mu);font-size:10.5px}
.sumgrid b{font:600 14px var(--mono)}
.q{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line2)}
.q:first-of-type{border-top:0}
.q .qt{font-size:13px}
.q .qt small{display:block;color:var(--fa);font-size:11px}
.q.dis{opacity:.45}
.yn{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--s2)}
.yn button{border:0;background:transparent;padding:6px 11px;font-size:12px;font-weight:600;color:var(--mu);border-right:1px solid var(--line)}
.yn button:last-child{border-right:0}
.yn button.good{background:var(--upd);color:var(--up)}
.yn button.bad{background:var(--dnd);color:var(--dn)}
.yn button.neu{background:var(--s3);color:var(--tx)}
.pill-row{display:flex;gap:6px;flex-wrap:wrap}
.pill{border:1px solid var(--line);background:var(--s2);border-radius:99px;padding:5px 11px;font-size:12.5px;color:var(--mu)}
.pill.on{background:var(--acd);border-color:var(--ac);color:var(--tx)}
.pill.neg.on{background:var(--dnd);border-color:rgba(255,92,112,.5);color:var(--dn)}
.pill.pos.on{background:var(--upd);border-color:rgba(61,220,151,.5);color:var(--up)}
.stars{display:inline-flex;gap:2px}
.stars button{border:0;background:transparent;font-size:20px;color:var(--fa);padding:0 2px}
.stars button.on{color:var(--am)}
.lev-slider{width:100%;-webkit-appearance:none;appearance:none;height:6px;border-radius:99px;background:var(--s3);border:1px solid var(--line);outline:none;margin:8px 0 2px}
.lev-slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:20px;height:20px;border-radius:50%;background:var(--ac);border:3px solid var(--bg);box-shadow:0 0 0 1px var(--ac);cursor:pointer}
.lev-slider::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--ac);border:3px solid var(--bg);box-shadow:0 0 0 1px var(--ac);cursor:pointer}
.lev-marks{display:flex;justify-content:space-between;font:11px var(--mono);color:var(--fa)}
.levbadge{font:700 13px var(--mono);padding:2px 10px;border-radius:99px;background:var(--s3)}
.levbadge.up{background:var(--upd);color:var(--up)}.levbadge.am{background:var(--amd);color:var(--am)}.levbadge.dn{background:var(--dnd);color:var(--dn)}
.phase{font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ac2);margin:14px 0 4px}
.phase:first-child{margin-top:0}

/* chart */
.chartbox{position:relative}
.chart-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.chart-host{background:#0a0b0f;border:1px solid var(--line2);border-radius:12px;overflow:hidden;min-height:300px}
.chart-host svg{display:block;width:100%}
.chart-empty{padding:90px 16px;text-align:center;color:var(--mu)}
.chart-meta{display:flex;justify-content:space-between;color:var(--mu);font-size:12px;margin:0 2px 8px;gap:8px;flex-wrap:wrap}
.opts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.opt{border:1px solid var(--line);background:transparent;border-radius:8px;padding:4px 9px;font-size:11.5px;color:var(--mu)}
.opt.on{color:var(--tx);border-color:var(--ac);background:var(--acd)}

/* review */
.rev{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.ring{width:84px;height:84px}
.verdict{font-size:16px;font-weight:650}
.cmt{background:var(--s2);border:1px solid var(--line2);border-radius:12px;padding:12px 14px;margin-top:12px;font-size:13.5px;line-height:1.6}
.cmt ul{margin:6px 0 0;padding-left:18px;color:var(--mu)}
.cmt li{margin:2px 0}
.cmt .ok{color:var(--up)}.cmt .no{color:var(--dn)}

/* coin picker */
.pick{position:absolute;inset:0;background:var(--bg);display:none;flex-direction:column;z-index:10}
.pick.open{display:flex}
.pick-h{padding:14px 16px;border-bottom:1px solid var(--line2);display:flex;gap:10px;align-items:center}
.pick-h h3{margin:0;font-size:16px;flex:1}
.pick-b{padding:12px 16px;overflow:auto;flex:1}
.crow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 6px;border-bottom:1px solid var(--line2);cursor:pointer;border-radius:10px}
.crow:hover{background:var(--s2)}
.crow b{font-size:14px}
.crow .vv{color:var(--fa);font-size:11.5px}
.crow .pp{text-align:right}
.crow .pp .pc{display:inline-block;margin-top:2px;padding:1px 7px;border-radius:7px;font:500 12px var(--mono)}
.pc.up{background:var(--upd);color:var(--up)}.pc.dn{background:var(--dnd);color:var(--dn)}

/* analytics */
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:130px 1fr 74px;gap:10px;align-items:center;font-size:12.5px}
@media(max-width:600px){.bar{grid-template-columns:96px 1fr 62px}}
.bar .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .tr{height:10px;background:var(--s2);border-radius:99px;position:relative;overflow:hidden}
.bar .tr i{position:absolute;top:0;bottom:0;border-radius:99px}
.bar .vl{text-align:right;font:500 12px var(--mono)}
.ins{display:grid;gap:8px}
.ins div{background:var(--s2);border:1px solid var(--line2);border-left:3px solid var(--ac);border-radius:10px;padding:10px 12px;font-size:13px}
.ins div.w{border-left-color:var(--am)}.ins div.g{border-left-color:var(--up)}.ins div.b{border-left-color:var(--dn)}
.mx{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mx div{border-radius:12px;padding:12px;border:1px solid var(--line2);background:var(--s2)}
.mx b{display:block;font:600 22px var(--mono)}
.mx small{color:var(--mu)}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,14px);gap:3px;overflow:auto;padding-bottom:4px}
.heat i{width:14px;height:14px;border-radius:4px;background:var(--s2)}
.per{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.per .lab{font:600 15px var(--ui);min-width:200px;text-align:center}
.warnbox{background:var(--amd);border:1px solid rgba(255,181,71,.35);color:var(--am);border-radius:10px;padding:8px 12px;font-size:12.5px;margin-bottom:12px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--s3);border:1px solid var(--line);padding:10px 16px;border-radius:10px;font-size:13px;z-index:99;opacity:0;pointer-events:none;transition:.2s}
.toast.on{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <div class="eyebrow">Trade Journal</div>
      <h1>Journal</h1>
      <div class="sub">Log the plan, answer a few taps, get an honest review. Stored on this device.</div>
    </div>
    <div class="row">
      <button class="btn ghost sm" id="btnExport" type="button">Export</button>
      <button class="btn ghost sm" id="btnImport" type="button">Import</button>
      <input type="file" id="fileImport" accept="application/json" hidden>
      <button class="btn pri" id="btnAdd" type="button">+ Add trade</button>
    </div>
  </div>
  <div class="tabs" id="tabs">
    <button data-tab="trades" class="on">Trades</button>
    <button data-tab="analytics">Analytics</button>
    <button data-tab="reviews">Weekly / Monthly</button>
  </div>
  <div id="view"></div>
</div>

<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
'use strict';
/* =====================================================================
   Constants & catalogues
   ===================================================================== */
const LS_KEY = 'tradesphere-journal-v1';
const PORTFOLIO_KEY = 'crypto-screener-portfolio-usdt';
const TZ_KEY = 'crypto-screener-display-timezone';
const TF_MS = { '15m':900e3, '1h':3600e3, '4h':14400e3, '1d':86400e3 };
const TF_LABEL = { '15m':'15m', '1h':'1H', '4h':'4H', '1d':'1D' };
const FAPI = ['https://fapi.binance.com','https://fapi1.binance.com','https://fapi2.binance.com','https://fapi3.binance.com','https://fapi4.binance.com'];

const SCREENERS = [
  { id:'ichimoku',  label:'Ichimoku Cloud Breakout' },
  { id:'custom',    label:'Custom Screen (RSI / MACD / EMA)' },
  { id:'ict',       label:'ICT / Smart Money setup' },
  { id:'watchlist', label:'Watchlist signal' },
  { id:'backtest',  label:'Backtest-derived rule' },
  { id:'none',      label:'None — not from a screener' }
];
const OTHER_SOURCES = [
  { group:'Social / people', items:[
    ['x','X (Twitter) post'],['telegram','Telegram group / channel'],['youtube','YouTube video'],
    ['friend','Friend / group call'],['signal','Influencer / signal provider'] ]},
  { group:'Market scans', items:[
    ['trending','Top trending list'],['movers','Top gainers / losers'],['volspike','Volume spike / unusual activity'],['listing','New listing'] ]},
  { group:'Catalyst / news', items:[
    ['news','News headline'],['exlisting','Exchange listing announcement'],['unlock','Token unlock / emission'],
    ['mainnet','Mainnet / upgrade / AMA'],['macro','Macro event (CPI, FOMC...)'],['political','Political statement'] ]},
  { group:'On-chain / derivatives', items:[
    ['whale','Whale alert'],['exflow','Exchange inflow / outflow'],['deriv','Funding / OI / liquidation signal'] ]},
  { group:'Own analysis', items:[
    ['chart','Own chart analysis'],['tvidea','TradingView idea / indicator alert'],['level','Key level / range retest'] ]},
  { group:'Other', items:[ ['gut','Gut feel / no clear source'],['other','Other'] ]}
];
const SOURCE_LABEL = {};
SCREENERS.forEach(s => SOURCE_LABEL[s.id] = s.label);
OTHER_SOURCES.forEach(g => g.items.forEach(i => SOURCE_LABEL[i[0]] = i[1]));

// phase: plan | exec | review (review questions apply only once the trade is closed)
const QUESTIONS = [
  { id:'thesis', phase:'plan',   w:2, good:'y', t:'I wrote down why I am taking this trade before entering' },
  { id:'setup',  phase:'plan',   w:3, good:'y', t:'The setup matches my strategy / playbook' },
  { id:'level',  phase:'plan',   w:2, good:'y', t:'Entry is at the planned level, not chasing a move' },
  { id:'htf',    phase:'plan',   w:1, good:'y', t:'Higher-timeframe trend agrees with the trade' },
  { id:'sl',     phase:'plan',   w:3, good:'y', t:'Stop-loss was decided before entry' },
  { id:'rr',     phase:'plan',   w:2, good:'y', t:'Reward-to-risk meets my minimum (1.5R or better)' },
  { id:'risk',   phase:'plan',   w:3, good:'y', t:'Risk is within my per-trade limit' },
  { id:'slip',   phase:'exec',   w:1, good:'n', t:'Entry had noticeable slippage' },
  { id:'slx',    phase:'exec',   w:2, good:'y', t:'Stop-loss is placed on the exchange' },
  { id:'moved',  phase:'exec',   w:3, good:'n', t:'I moved or removed the stop against my rules' },
  { id:'exit',   phase:'review', w:2, good:'y', t:'Exit was as planned (target, stop or a rule)' },
  { id:'plan100',phase:'review', w:3, good:'y', t:'I followed the plan 100%' }
];
const PHASE_LABEL = { plan:'Before entry — plan', exec:'During — execution', review:'After — review (closed trades)' };
const EMOTIONS = [
  ['calm','Calm','pos'],['confident','Confident','pos'],['fomo','FOMO','neg'],['fear','Fear','neg'],
  ['greed','Greed','neg'],['bored','Bored','neg'],['revenge','Revenge','neg'],['hesitant','Hesitant','neg']
];
const EMO_NEG = ['fomo','fear','greed','bored','revenge','hesitant'];

async function fapi(path, ms){

}

async function klines(symbol, tf, opt){

function atrOf(cs, period){
  const x = cs.slice(); if(x.length && x[x.length - 1].t + 1 > Date.now() - 1) { /* keep forming bar out of the average */ x.pop(); }
  if(x.length < period + 1) return null;
  const tr = [];
  for(let i = 1; i < x.length; i++) tr.push(Math.max(x[i].h - x[i].l, Math.abs(x[i].h - x[i-1].c), Math.abs(x[i].l - x[i-1].c)));
  let a = tr.slice(0, period).reduce((s, v) => s + v, 0) / period;
  for(let i = period; i < tr.length; i++) a = (a * (period - 1) + tr[i]) / period;
  return a;
}
function emaSeries(cs, n){
  const k = 2 / (n + 1); const out = []; let e = null;
  cs.forEach((c, i) => { e = e == null ? c.c : c.c * k + e * (1 - k); out.push(i >= n - 1 ? e : null); });
  return out;
}

/* =====================================================================
   Trade math, scoring, auto review
   ===================================================================== */
function riskDist(t){ return fin(t.entry) && fin(t.stop) ? (t.side === 'long' ? t.entry - t.stop : t.stop - t.entry) : null; }
function validLevels(t){
  const d = riskDist(t); if(!fin(d) || d <= 0) return false;
  if(fin(t.target)) return t.side === 'long' ? t.target > t.entry : t.target < t.entry;
  return true;
}
function rMultiple(t){
  if(t.status !== 'closed' || !fin(t.exit)) return null;
  const d = riskDist(t); if(!fin(d) || d <= 0) return null;
  return (t.side === 'long' ? t.exit - t.entry : t.entry - t.exit) / d;
}
function plannedRR(t){
  const d = riskDist(t); if(!fin(d) || d <= 0 || !fin(t.target)) return null;
  return Math.abs(t.target - t.entry) / d;
}
function pnlUsd(t){
  if(t.status !== 'closed' || !fin(t.exit) || !fin(t.qty)) return null;
  return (t.side === 'long' ? t.exit - t.entry : t.entry - t.exit) * t.qty - (t.fee || 0);
}
function activeQuestions(t){ return QUESTIONS.filter(q => q.phase !== 'review' || t.status === 'closed'); }
function processScore(t){
  let got = 0, tot = 0, ans = 0; const app = activeQuestions(t);
  app.forEach(q => {
    const a = t.answers[q.id];
    if(a === 'y' || a === 'n'){ ans++; tot += q.w; if(a === q.good) got += q.w; }
  });
  let score = tot ? got / tot * 100 : null;
  if(score != null){
    // behaviour you tagged counts too: each mistake -6 (max 3), each negative emotion at entry/exit -4
    const mistakes = Math.min(3, (t.mistakes || []).length) * 6;
    const emo = (EMO_NEG.includes(t.emotion) ? 4 : 0) + (t.status === 'closed' && EMO_NEG.includes(t.emotionAfter) ? 4 : 0);
    score = Math.max(0, Math.round(score - mistakes - emo));
  }
  return { score, answered: ans, applicable: app.length, completeness: Math.round(ans / app.length * 100) };
}
function usable(t){
  const d = riskDist(t);
  if(!fin(d) || d <= 0) return false;
  if(fin(t.target) && !(t.side === 'long' ? t.target > t.entry : t.target < t.entry)) t.target = null;
  return t.status !== 'closed' || fin(t.exit);
}
function bad(t, id){ const q = QUESTIONS.find(x => x.id === id); return t.answers[id] && t.answers[id] !== 'na' && t.answers[id] !== q.good; }
function goodA(t, id){ const q = QUESTIONS.find(x => x.id === id); return t.answers[id] === q.good; }

function buildReview(t){
  const ps = processScore(t);
  const R = rMultiple(t);
  const rr = plannedRR(t);
  const closed = t.status === 'closed' && fin(R);
  const out = { score:ps.score, completeness:ps.completeness, answered:ps.answered, applicable:ps.applicable, verdict:'', tone:'ac', headline:'', strengths:[], flags:[], next:'' };
  if(ps.score == null){
    out.verdict = 'Not enough answers'; out.headline = 'Answer a few questions and I will review how this trade was planned and executed.';
    out.comment = out.headline; return out;
  }
  const s = ps.score;
  if(closed){
    const win = R > 0.1, loss = R < -0.1;
    if(!win && !loss){ out.verdict = 'Scratch trade'; out.tone = 'am'; }
    else if(s >= 75){ out.verdict = win ? 'Textbook trade' : 'Good loss'; out.tone = win ? 'up' : 'ac'; }
    else if(s < 55){ out.verdict = win ? 'Lucky win' : 'Deserved loss'; out.tone = 'dn'; }
    else { out.verdict = win ? 'Decent win' : 'Acceptable loss'; out.tone = win ? 'up' : 'am'; }
    const lead = { 'Textbook trade':'Clean process and a good result.', 'Good loss':'The loss is variance, not a mistake: the process was sound.',
      'Lucky win':'The profit came despite the process. Do not count on it repeating.', 'Deserved loss':'The process broke down and the result followed.',
      'Decent win':'A profitable trade with room to tighten the process.', 'Acceptable loss':'A loss within a mostly sound plan, with a few things to fix.',
      'Scratch trade':'Roughly break-even, so the lesson is in the process.' }[out.verdict];
    out.headline = `${out.verdict} (process ${s}/100, ${fmtR(R)}). ${lead}`;
  }else{
    out.verdict = s >= 75 ? 'Strong plan' : s >= 55 ? 'Plan needs tightening' : 'Weak plan';
    out.tone = s >= 75 ? 'up' : s >= 55 ? 'am' : 'dn';
    out.headline = `${out.verdict} (process ${s}/100)` + (rr ? `, planned ${rr.toFixed(1)}R.` : '.');
  }
  if(ps.completeness < 70) out.headline += ` Based on ${ps.answered} of ${ps.applicable} answers, so treat it as partial.`;
  QUESTIONS.forEach(q => {
    if(q.phase === 'review' && t.status !== 'closed') return;
    const a = t.answers[q.id]; if(a !== 'y' && a !== 'n') return;
    const ok = a === q.good;
    const pos = { thesis:'planned before entering', setup:'matched the playbook', level:'entered at the planned level', htf:'aligned with the higher timeframe',
      sl:'stop decided up front', rr:'reward-to-risk was adequate', risk:'risk stayed within the limit', slip:'no meaningful slippage',
      slx:'stop sits on the exchange', moved:'stop was left alone', exit:'exit was as planned', plan100:'plan followed fully' }[q.id];
    const neg = { thesis:'no written thesis before entry', setup:'setup did not match the playbook', level:'chased the entry', htf:'against the higher-timeframe trend',
      sl:'stop was not decided before entry', rr:'reward-to-risk below minimum', risk:'risk above the per-trade limit', slip:'entry slippage',
      slx:'stop not placed on the exchange', moved:'stop moved against the rules', exit:'exit deviated from the plan', plan100:'plan was not followed fully' }[q.id];
    if(ok && q.w >= 2) out.strengths.push(pos); else if(!ok) out.flags.push(neg);
  });
  if(t.emotion && EMO_NEG.includes(t.emotion)) out.flags.push(`entered feeling ${LBL[t.emotion].toLowerCase()}`);
  if(t.status === 'closed' && t.emotionAfter && EMO_NEG.includes(t.emotionAfter)) out.flags.push(`exited feeling ${LBL[t.emotionAfter].toLowerCase()}`);
  (t.mistakes || []).forEach(m => out.flags.push(`${LBL[m].toLowerCase()} mistake tagged`));
  if(rr != null && rr < 1.5 && !t.answers.rr) out.flags.push(`planned reward-to-risk only ${rr.toFixed(1)}R`);
  if(t.src.screener === 'none' || (!t.src.screener && t.src.other)){
    if(['gut','x','telegram','signal','friend'].includes(t.src.other)) out.flags.push(`idea source (${SOURCE_LABEL[t.src.other]}) is unverified: confirm with your own setup`);
  }
  let na = t.nextAction;
  if(!na){
    if(bad(t, 'moved')) na = 'trust_stop'; else if(bad(t, 'level')) na = 'no_chase'; else if(bad(t, 'slip')) na = 'limit';
    else if(bad(t, 'risk')) na = 'smaller'; else if(EMO_NEG.includes(t.emotion)) na = 'wait_close';
  }
  out.next = na ? LBL[na] : '';
  const parts = [out.headline];
  if(out.strengths.length) parts.push('What went right: ' + out.strengths.slice(0, 4).join(', ') + '.');
  if(out.flags.length) parts.push('Flags: ' + out.flags.slice(0, 5).join('; ') + '.');
  if(out.next) parts.push('Next time: ' + out.next.toLowerCase() + '.');
  out.comment = parts.join(' ');
  return out;
}
function recompute(t){
  const r = buildReview(t);
  t.review = { score:r.score, verdict:r.verdict, comment:r.comment, at:Date.now() };
  return r;
}

/* =====================================================================
   Chart (SVG): candles, EMAs, entry/stop/target zones, exit marker, extras
   ===================================================================== */
function drawChart(host, o){
  const cs = o.candles;
  if(!cs || cs.length < 3){ host.innerHTML = '<div class="chart-empty">' + esc(o.msg || 'Choose a coin to load its chart') + '</div>'; return; }
  const p = o.plan || {};
  const W = Math.max(300, host.clientWidth || 640), H = o.h || (W < 520 ? 420 : 380);
  const pl = 8, pr = 78, pt = 16, pb = 26;
  const idxOf = ts => { let lo = 0, hi = cs.length - 1, r = -1; while(lo <= hi){ const m = (lo + hi) >> 1; if(cs[m].t <= ts){ r = m; lo = m + 1; } else hi = m - 1; } return r; };
  const eI = p.entryTs ? idxOf(p.entryTs) : -1, xI = p.exitTs ? idxOf(p.exitTs) : -1;
  const win = o.win || 90;
  let end = cs.length;
  if(xI >= 0) end = Math.min(cs.length, xI + 1 + Math.max(6, Math.round(win * 0.2)));
  let start = Math.max(0, end - win);
  if(eI >= 0 && eI - 5 < start) start = Math.max(0, Math.min(start, eI - 5), end - 400);
  const view = cs.slice(start, end), n = view.length, pad = 7;
  const plotW = W - pl - pr, plotH = H - pt - pb, step = plotW / (n + pad);
  const X = i => pl + (i - start + 0.5) * step;
  // Scale fits the visible candles (plus entry / exit / live price). Stop, target and liquidation only
  // stretch the scale when they sit within ~1.2x the candle span of price; farther ones are pinned to the
  // chart edge with an arrow and their distance, so the candles always fill the plot.
  let lo = Math.min.apply(null, view.map(c => c.l)), hi = Math.max.apply(null, view.map(c => c.h));
  [p.entry, p.exit, o.ltp].forEach(v => { if(fin(v)){ lo = Math.min(lo, v); hi = Math.max(hi, v); } });
  const span0 = (hi - lo) || hi * 0.01, reach = Math.max(span0 * 1.2, hi * 0.004);
  let lo2 = lo, hi2 = hi;
  [p.stop, p.target].concat(o.show.liq ? [p.liq] : []).forEach(v => {
    if(!fin(v)) return;
    if(v > hi){ if(v - hi <= reach) hi2 = Math.max(hi2, v); }

  }

    [[20, '#4f8cff'], [50, '#ffb547']].forEach(([per, col]) => {

      for(let i = start; i < end; i++){ if(e[i] == null) continue; d += (d ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(e[i]).toFixed(1); }

         `<rect x="${xr + 1}" y="${y - 9}" width="${pr - 3}" height="18" rx="4" fill="#6482ff"/>` +

  }
  s += '</svg>';
  host.innerHTML = s;
}

/* mfe / mae (in price) between entry and exit/now */
function excursion(t, cs){
  if(!cs || !cs.length || !fin(t.entry) || !t.openedAt || t.status === 'planned') return {};
  const end = t.closedAt || Date.now();
  const seg = cs.filter(c => c.t + 1 >= t.openedAt - 1 && c.t <= end);
  if(!seg.length) return {};
  const d = riskDist(t); if(!fin(d) || d <= 0) return {};
  const hi = Math.max.apply(null, seg.map(c => c.h)), lo = Math.min.apply(null, seg.map(c => c.l));
  if(t.side === 'long') return { mfePx:hi, maePx:lo, mfe:Math.max(0, (hi - t.entry) / d), mae:Math.max(0, (t.entry - lo) / d) };
  return { mfePx:lo, maePx:hi, mfe:Math.max(0, (t.entry - lo) / d), mae:Math.max(0, (hi - t.entry) / d) };
}
function liqApprox(t){
  if(!fin(t.entry) || !fin(t.lev) || t.lev <= 1) return null;
  return t.side === 'long' ? t.entry * (1 - 1 / t.lev + 0.005) : t.entry * (1 + 1 / t.lev - 0.005);
}

/* ---------- analytics ---------- */
function stats(ts){
  const R = ts.map(rMultiple), n = R.length;
  if(!n) return null;
  const mean = R.reduce((a, b) => a + b, 0) / n;
  const sd = Math.sqrt(R.reduce((a, b) => a + (b - mean) * (b - mean), 0) / Math.max(1, n - 1));
  const gw = R.filter(r => r > 0).reduce((a, b) => a + b, 0), gl = -R.filter(r => r < 0).reduce((a, b) => a + b, 0);
  const sorted = ts.slice().sort((a, b) => a.closedAt - b.closedAt);
  let cum = 0, peak = 0, dd = 0; const curve = [];
  sorted.forEach(t => { cum += rMultiple(t); curve.push({ t:t.closedAt, v:cum }); peak = Math.max(peak, cum); dd = Math.max(dd, peak - cum); });
  const sc = ts.map(t => t.review && t.review.score).filter(fin);
  const adh = ts.filter(t => t.answers.plan100 && t.answers.plan100 !== 'na');
  return { n, mean, sd, wins:R.filter(r => r > 0).length, net:cum, pf: gl > 0 ? gw / gl : (gw > 0 ? Infinity : null),
    sqn: sd > 0 ? mean / sd * Math.sqrt(Math.min(n, 100)) : null, dd, curve,
    proc: sc.length ? sc.reduce((a, b) => a + b, 0) / sc.length : null,
    adh: adh.length ? adh.filter(t => t.answers.plan100 === 'y').length / adh.length : null,
    best: sorted.reduce((b, t) => !b || rMultiple(t) > rMultiple(b) ? t : b, null),
    worst: sorted.reduce((b, t) => !b || rMultiple(t) < rMultiple(b) ? t : b, null) };
}
function groupBy(ts, fn){
  const m = {}; ts.forEach(t => { const k = fn(t); if(k == null || k === '') return; (m[k] = m[k] || []).push(t); });
  return Object.keys(m).map(k => ({ k, ts:m[k], n:m[k].length, avg:m[k].reduce((s, t) => s + rMultiple(t), 0) / m[k].length,
    win:m[k].filter(t => rMultiple(t) > 0).length / m[k].length })).sort((a, b) => b.n - a.n);
}

function curveSvg(curve){

function histSvg(ts){

function heatHtml(ts){

function insights(ts){
  const out = [], S = stats(ts); if(!S) return out;
  if(S.n < 30) out.push({ c:'w', t:`Only ${S.n} closed trade${S.n === 1 ? '' : 's'}. Treat every number here as directional until you reach about 30.` });
  if(S.mean > 0) out.push({ c:'g', t:`Positive expectancy: ${fmtR(S.mean)} per trade over ${S.n} trades${S.pf && isFinite(S.pf) ? ', profit factor ' + S.pf.toFixed(2) : ''}.` });
  else out.push({ c:'b', t:`Negative expectancy: ${fmtR(S.mean)} per trade. Look at which sources and mistakes below are dragging it down.` });
  if(S.adh != null){
    const a = Math.round(S.adh * 100);
    out.push({ c: a >= 85 ? 'g' : a >= 65 ? 'w' : 'b', t:`You followed the plan 100% on ${a}% of trades${a < 70 ? ': improvising is likely costing you' : ''}.` });
    const f = ts.filter(t => t.answers.plan100 === 'y'), nf = ts.filter(t => t.answers.plan100 === 'n');
    if(f.length >= 3 && nf.length >= 3){
      const a1 = f.reduce((s, t) => s + rMultiple(t), 0) / f.length, a2 = nf.reduce((s, t) => s + rMultiple(t), 0) / nf.length;
      out.push({ c: a1 > a2 ? 'w' : 'g', t:`Plan-followed trades average ${fmtR(a1)} vs ${fmtR(a2)} when the plan was broken.` });
    }
  }
  const src = groupBy(ts, srcGroup).filter(g => g.n >= 3).sort((a, b) => b.avg - a.avg);
  if(src.length >= 2){
    const b = src[0], w = src[src.length - 1];
    out.push({ c:'g', t:`Best source: ${b.k} (${b.n} trades, ${fmtR(b.avg)} avg, ${Math.round(b.win * 100)}% wins).` });
    if(w.avg < 0) out.push({ c:'b', t:`Weakest source: ${w.k} (${w.n} trades, ${fmtR(w.avg)} avg). Restrict or drop it.` });
  }
  const neg = ts.filter(t => EMO_NEG.includes(t.emotion)), calm = ts.filter(t => t.emotion === 'calm' || t.emotion === 'confident');
  if(neg.length >= 3 && calm.length >= 3){
    const a = neg.reduce((s, t) => s + rMultiple(t), 0) / neg.length, c = calm.reduce((s, t) => s + rMultiple(t), 0) / calm.length;
    out.push({ c: a < c ? 'w' : 'g', t:`Trades entered with FOMO/fear/greed-type emotions average ${fmtR(a)}; calm or confident entries average ${fmtR(c)}.` });
  }
  const gaps = [];
  QUESTIONS.forEach(q => {
    const g = ts.filter(t => t.answers[q.id] === q.good), b = ts.filter(t => t.answers[q.id] && t.answers[q.id] !== 'na' && t.answers[q.id] !== q.good);
    if(g.length >= 3 && b.length >= 3){
      const ag = g.reduce((s, t) => s + rMultiple(t), 0) / g.length, ab = b.reduce((s, t) => s + rMultiple(t), 0) / b.length;
      gaps.push({ q, ag, ab, d:ag - ab });
    }
  });
  gaps.sort((a, b) => b.d - a.d);
  if(gaps.length && gaps[0].d > 0.3) out.push({ c:'w', t:`Biggest rule gap: “${gaps[0].q.t}”. Following it averages ${fmtR(gaps[0].ag)} vs ${fmtR(gaps[0].ab)} when not.` });
  const comp = DB.trades.map(t => processScore(t).completeness);
  if(comp.length){ const c = Math.round(comp.reduce((a, b) => a + b, 0) / comp.length); if(c < 80) out.push({ c:'w', t:`Your journal is ${c}% complete on average. Skipped questions weaken these insights.` }); }
  return out;
}

function periodRange(type, off){
  const todayKey = dayKey(Date.now()), t0 = keyToUTC(todayKey);
  if(type === 'week'){
    const dow = (new Date(t0).getUTCDay() + 6) % 7;
    const s = t0 - dow * 86400000 + off * 7 * 86400000, e = s + 7 * 86400000;
    const a = new Date(s), b = new Date(e - 86400000);
    return { s, e, key:'W' + utcToKey(s), label: a.toLocaleDateString('en-GB', { day:'2-digit', month:'short', timeZone:'UTC' }) + ' – ' + b.toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric', timeZone:'UTC' }) };
  }
  const d = new Date(t0); const s = Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + off, 1), e = Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + off + 1, 1);
  return { s, e, key:utcToKey(s).slice(0, 7), label:new Date(s).toLocaleDateString('en-GB', { month:'long', year:'numeric', timeZone:'UTC' }) };
}
function inRange(ts, r){ return ts.filter(t => { const k = keyToUTC(dayKey(t.closedAt)); return k >= r.s && k < r.e; }); }

    <div class="note" style="margin-top:8px">Pick one behaviour to focus on. It will be shown here next ${period.type} so you can check if you kept it.</div></div>`;
  view.innerHTML = h;

function draftToTrade(d){

  const dist = riskDist(t), pv = portfolioValue();

  // fees: entry (+ exit once closed) at the chosen maker/taker rate, unless a manual figure was typed
  const rate = FEE_RATES[t.feeType];

  else if(fin(qty) && fin(t.entry)) t.fee = qty * t.entry * rate + ((t.status === 'closed' && fin(t.exit)) ? qty * t.exit * rate : 0);

/* apply ATR-driven stop/target into the draft */
function applyAtr(){
  const entry = num(D.entry), atr = fin(D.atrVal) ? D.atrVal : D.atrAuto;
  if(!fin(entry) || !fin(atr)) return;
  const sgn = D.side === 'long' ? 1 : -1;
  if(D.atrOn){
    const sl = entry - sgn * atr * D.slMult;
    D.stop = String(+sl.toFixed(pxDec(entry)));
  }
  if(D.tpOn){
    const stop = num(D.stop);
    let tp = null;
    if(D.tpMode === 'ATR') tp = entry + sgn * atr * D.tpMult;
    else if(fin(stop)) tp = entry + sgn * Math.abs(entry - stop) * D.tpR;
    if(tp != null) D.target = String(+tp.toFixed(pxDec(entry)));
  }
}

/* partial refresh: keeps input focus */
function update(){
  if(!D) return;
  const t = curTrade();
  // reflect ATR-driven fields without stealing focus
  const active = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.f : null;
  const setv = (f, v) => { if(active === f) return; const el = $(`[data-f="${f}"]`, $('#sheet')); if(el && el.value !== String(v)) el.value = v; };
  setv('stop', D.stop); setv('target', D.target);
  if(!fin(D.atrVal) && fin(D.atrAuto)) setv('atrVal', +D.atrAuto.toPrecision(5));
  const atr = fin(D.atrVal) ? D.atrVal : D.atrAuto;
  const an = $('#atrNote');
  if(an){
    an.innerHTML = fin(atr) ? `ATR(${D.atrPeriod}) ${TF_LABEL[D.atrTf]} = <span class="mono">${fmtPx(atr)}</span> · ${fin(num(D.entry)) ? ((atr * D.slMult / num(D.entry)) * 100).toFixed(2) + '% stop distance' : 'set entry'}${D.atrEdited ? ' · <a href="#" data-sh="atrauto" style="color:var(--ac2)">reset to auto</a>' : ''}`
      : '<span class="mu">ATR loads after you choose a coin</span>';
  }
  // levels summary
  const dist = riskDist(t), rr = plannedRR(t), pv = portfolioValue();
  const entry = t.entry;
  const tile = (l, v, c) => `<div><small>${l}</small><b class="${c || ''}">${v}</b></div>`;
  let sg = '';
  if(fin(dist) && dist > 0 && fin(entry)){
    sg += tile('Risk to stop', (dist / entry * 100).toFixed(2) + '%', 'dn');
    if(fin(t.target)) sg += tile('Reward to target', (Math.abs(t.target - entry) / entry * 100).toFixed(2) + '%', 'up');
    sg += tile('Reward : risk', rr ? rr.toFixed(2) + 'R' : '—', rr && rr >= 1.5 ? 'up' : rr ? 'am' : '');
  }else if(fin(entry) && fin(t.stop)){
    sg = '<div style="grid-column:1/-1;color:var(--am);background:var(--amd);border-color:transparent">Stop-loss must be ' + (D.side === 'long' ? 'below' : 'above') + ' entry for a ' + D.side + '.</div>';
  }
  $('#sumGrid').innerHTML = sg;
  // position size summary (same maths as Meridian: margin = notional / leverage, fees on notional)
  const symb = esc((D.symbol || '').replace(/USDT$/, '') || 'coin');
  let zg = '', riskPctActual = null;
  const lev = t.lev || 1;
  const lb = $('#levBadge');
  if(lb){ lb.textContent = lev + 'x'; lb.className = 'levbadge ' + (lev <= 5 ? 'up' : lev <= 15 ? 'am' : 'dn'); }
  if(fin(t.qty) && fin(entry) && entry > 0){
    const notional = t.qty * entry, margin = notional / lev;
    const riskUsd = (fin(dist) && dist > 0) ? t.qty * dist : null;
    riskPctActual = (riskUsd != null && pv > 0) ? riskUsd / pv * 100 : null;
    const entryFee = notional * FEE_RATES[t.feeType];
    zg += tile('Quantity', fmtPx(t.qty) + ' ' + symb);
    zg += tile('Position size', bigNum(notional) + ' USDT');
    zg += tile('Margin @' + lev + 'x', bigNum(margin) + ' USDT');
    if(riskUsd != null) zg += tile('Risk to stop', riskUsd.toFixed(2) + ' USDT' + (riskPctActual != null ? ' · ' + riskPctActual.toFixed(2) + '%' : ''), 'dn');
    if(fin(t.target) && fin(dist)) zg += tile('Reward to target', (t.qty * Math.abs(t.target - entry)).toFixed(2) + ' USDT', 'up');
    zg += tile('Entry fee', entryFee.toFixed(4) + ' USDT');
    if(t.status === 'closed' && fin(t.exit)) zg += tile('Total fees', (t.fee || 0).toFixed(4) + ' USDT');
    const warns = [];
    if(pv > 0 && margin > pv + 1e-9) warns.push(`Margin ${margin.toFixed(2)} USDT is more than your portfolio value (${pv.toFixed(2)} USDT).`);
    if(riskPctActual != null && D.sizeMode !== 'risk' && riskPctActual > (DB.settings.riskPct || 1) * 2) warns.push(`This sizes the trade at ${riskPctActual.toFixed(1)}% risk, well above your usual ${DB.settings.riskPct}%.`);
    warns.forEach(w => { zg += `<div style="grid-column:1/-1;color:var(--am);background:var(--amd);border-color:transparent">${esc(w)}</div>`; });
  }else if(D.sizeMode === 'risk' && !(pv > 0)){
    zg = '<div style="grid-column:1/-1" class="note">Enter your portfolio value above to size by risk %, or switch to quantity / USDT amount.</div>';
  }else{
    zg = '<div style="grid-column:1/-1" class="note">Enter entry and ' + (D.sizeMode === 'qty' ? 'a quantity' : D.sizeMode === 'amount' ? 'an amount' : 'a stop-loss') + ' to see size, margin and fees.</div>';
  }
  const sgEl = $('#sizeGrid'); if(sgEl) sgEl.innerHTML = zg;
  const rkh = $('#riskHint'); if(rkh) rkh.textContent = riskPctActual != null ? `Actual risk ${riskPctActual.toFixed(2)}% of portfolio` : '';
  const fe = $('[data-f="fee"]', $('#sheet')); if(fe) fe.placeholder = (fin(t.qty) && fin(entry) && !t.feeManual) ? 'auto ' + (t.fee || 0).toFixed(4) : 'auto';
  const rh = $('#rrHint'); if(rh) rh.textContent = rr ? `Planned ${rr.toFixed(2)}R` : '';
  // ltp line
  const ll = $('#ltpLine');
  if(ll) ll.innerHTML = fin(D.ltp) ? `<span>${fmtPx(D.ltp)}</span> <span class="${cls(D.chg)}">${fmtPct(D.chg)}</span> <span class="mu">LTP · 24h</span>` : '';
  // review
  const rv = buildReview(t);
  const col = { up:'var(--up)', dn:'var(--dn)', am:'var(--am)', ac:'var(--ac2)' }[rv.tone] || 'var(--ac2)';
  const sc = rv.score == null ? 0 : rv.score, C = 2 * Math.PI * 34;
  $('#revCard').innerHTML = `<h3>Auto review <small>updates as you answer · saved inside this trade</small></h3>
    <div class="rev"><svg class="ring" viewBox="0 0 84 84"><circle cx="42" cy="42" r="34" fill="none" stroke="var(--s3)" stroke-width="8"/>
      <circle cx="42" cy="42" r="34" fill="none" stroke="${col}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${C * sc / 100} ${C}" transform="rotate(-90 42 42)"/>
      <text x="42" y="47" text-anchor="middle" font-family="Geist Mono, monospace" font-size="20" font-weight="600" fill="var(--tx)">${rv.score == null ? '—' : rv.score}</text></svg>
      <div><div class="verdict" style="color:${col}">${esc(rv.verdict)}</div>
      <div class="note">Process score · ${rv.answered}/${rv.applicable} answered (${rv.completeness}%)</div>
      ${t.status === 'closed' && fin(rMultiple(t)) ? `<div class="mono ${cls(rMultiple(t))}" style="font-size:18px;margin-top:2px">${fmtR(rMultiple(t))}${fin(pnlUsd(t)) ? ` <span class="mu" style="font-size:12.5px">${pnlUsd(t) >= 0 ? '+' : ''}${pnlUsd(t).toFixed(2)} USDT</span>` : ''}</div>` : ''}</div></div>
    <div class="cmt">${esc(rv.headline)}
      ${rv.strengths.length ? `<ul>${rv.strengths.slice(0, 4).map(s => `<li><span class="ok">✓</span> ${esc(s)}</li>`).join('')}</ul>` : ''}
      ${rv.flags.length ? `<ul>${rv.flags.slice(0, 5).map(s => `<li><span class="no">✕</span> ${esc(s)}</li>`).join('')}</ul>` : ''}
      ${rv.next ? `<div style="margin-top:8px">Next time: <b>${esc(rv.next)}</b></div>` : ''}</div>`;
  drawPlanChart();
}
function drawPlanChart(){
  const host = $('#chartHost'); if(!host) return;
  if(!D.symbol){ drawChart(host, { candles:null, msg:'Choose a coin to load its chart' }); return; }
  if(!chartCandles){ drawChart(host, { candles:null, msg:'Loading ' + D.symbol + '…' }); return; }
  const t = curTrade(), ex = excursion(t, chartCandles);
  const rr = rMultiple(t);
  const atr = fin(D.atrVal) ? D.atrVal : D.atrAuto;
  const cm = $('#chartSrc');
  if(cm) cm.innerHTML = 'Binance USDT-M' + (DB.settings.show.mfe && ex.mfe != null ? ` · <span class="up">MFE ${fmtR(ex.mfe)}</span> · <span class="dn">MAE ${fmtR(-ex.mae)}</span>` : '');
  drawChart(host, { candles:chartCandles, tf:D.chartTf, win:DB.settings.chartWin, ltp:D.ltp, atr, show:DB.settings.show,
    plan:{ side:t.side, entry:t.entry, stop:t.stop, target:t.target, exit:t.status === 'closed' ? t.exit : null,
           entryTs: t.status === 'planned' ? null : t.openedAt, exitTs: t.status === 'closed' ? (t.closedAt || Date.now()) : null,
           rr:fin(rr) ? rr : null, liq:liqApprox(t), mfe:ex.mfe, mae:ex.mae, mfePx:ex.mfePx, maePx:ex.maePx } });
}
async function loadSymbolData(first){
  if(!D || !D.symbol) return;
  const sym = D.symbol, myD = D;
  try{
    const old = D.status === 'closed' && D.closedAt && Date.now() - D.openedAt > TF_MS[D.chartTf] * 150;
    const opt = old ? { start:D.openedAt - TF_MS[D.chartTf] * 60, end:(D.closedAt || Date.now()) + TF_MS[D.chartTf] * 40, limit:1000 } : {};
    const [cs, ac] = await Promise.all([ klines(sym, D.chartTf, opt), klines(sym, D.atrTf, {}) ]);
    if(D !== myD || D.symbol !== sym) return;
    chartCandles = cs;
    const a = atrOf(ac, Math.max(2, Math.round(D.atrPeriod) || 14));
    if(fin(a)){
      D.atrAuto = a;
      if(!D.atrEdited) D.atrVal = null;
      if(first && D.isNew && !num(D.entry) && fin(D.ltp)) D.entry = String(D.ltp);
      applyAtr();
    }
    update();
  }catch(e){
    if(D === myD){ const h = $('#chartHost'); if(h) drawChart(h, { candles:null, msg:'Could not load candles: ' + (e.message || 'network error') }); }
  }
}
function startLtp(){
  clearInterval(ltpTimer);
  const tick = async () => {
    if(!D || !D.symbol) return;
    try{
      const r = await fapi('/fapi/v1/ticker/24hr?symbol=' + D.symbol, 8000);
      if(!D || r.symbol !== D.symbol) return;
      D.ltp = +r.lastPrice; D.chg = +r.priceChangePercent;
      if(D.isNew && !num(D.entry) && D.ltp){ D.entry = String(D.ltp); applyAtr(); const el = $('[data-f="entry"]', $('#sheet')); if(el) el.value = D.entry; }
      update();
    }catch(e){}
  };
  tick(); ltpTimer = setInterval(tick, 5000);
}

/* ---------- coin picker ---------- */
let pickState = { q:'', sort:'vol' };
async function openPicker(){
  const p = $('#pick'); p.classList.add('open');
  p.innerHTML = `<div class="pick-h"><h3>All coins <span class="mu mono" id="pickCnt"></span></h3><button class="btn sm ghost" data-sh="pickclose" type="button">✕</button></div>
    <div class="pick-b"><input class="in" id="pickQ" placeholder="Search coin or symbol" style="font-family:var(--ui);margin-bottom:10px" autocomplete="off">
    <div class="filters" id="pickSort"></div><div id="pickList"><div class="empty">Loading futures list…</div></div></div>`;
  $('#pickQ').addEventListener('input', e => { pickState.q = e.target.value; drawPick(); });
  $('#pickSort').addEventListener('click', e => { const b = e.target.closest('[data-ps]'); if(b){ pickState.sort = b.dataset.ps; drawPick(); } });
  $('#pickQ').focus();
  try{ await allTickers(); drawPick(); }catch(e){ $('#pickList').innerHTML = '<div class="empty"><b>Could not load coins</b>' + esc(e.message || '') + '</div>'; }
}
function drawPick(){
  const list = $('#pickList'); if(!list) return;
  const q = pickState.q.trim().toUpperCase();
  let rows = tickCache.list.filter(x => !q || x.base.includes(q));
  const s = pickState.sort;
  rows = rows.slice().sort((a, b) => s === 'chg' ? b.chg - a.chg : s === 'chgd' ? a.chg - b.chg : s === 'az' ? a.base.localeCompare(b.base) : b.vol - a.vol);
  $('#pickCnt').textContent = '· ' + rows.length;
  $('#pickSort').innerHTML = [['vol', 'Volume'], ['chg', '24h % ↑'], ['chgd', '24h % ↓'], ['az', 'A–Z']].map(([k, l]) => `<button class="fchip ${s === k ? 'on' : ''}" data-ps="${k}">${l}</button>`).join('');
  list.innerHTML = rows.slice(0, 250).map(x => `<div class="crow" data-coin="${esc(x.symbol)}"><span class="av">${esc(x.base.slice(0, 4))}</span>
    <div><b>${esc(x.base)}</b> <span class="mu">/USDT</span><div class="vv mono">Vol ${bigNum(x.vol)}</div></div>
    <div class="pp mono"><div>${fmtPx(x.last)}</div><span class="pc ${x.chg >= 0 ? 'up' : 'dn'}">${fmtPct(x.chg)}</span></div></div>`).join('') || '<div class="empty">No match.</div>';
}
function chooseCoin(sym){
  const hit = tickCache.list.find(x => x.symbol === sym);
  D.symbol = sym; D.ltp = hit ? hit.last : null; D.chg = hit ? hit.chg : null;
  D.entry = hit && D.isNew ? String(hit.last) : D.entry;
  D.atrAuto = null; D.atrVal = null; D.atrEdited = false; chartCandles = null;
  buildSheet(); loadSymbolData(true); startLtp();
}

/* ---------- save ---------- */
function validateDraft(){
  if(!D.symbol) return 'Choose a coin first.';
  const t = curTrade();
  if(!fin(t.entry)) return 'Enter the entry price.';
  if(!fin(t.stop)) return 'Enter a stop-loss (needed for R and risk).';
  if(!validLevels(t)) return `For a ${t.side}, stop must be ${t.side === 'long' ? 'below' : 'above'} entry and target ${t.side === 'long' ? 'above' : 'below'} it.`;
  if(t.status === 'closed' && !fin(t.exit)) return 'Enter the exit price for a closed trade.';
  return '';
}
function saveDraft(){
  const err = validateDraft(); if(err){ toast(err); return; }
  const t = cleanTrade(Object.assign(draftToTrade(D), { qty:undefined }));
  const raw = draftToTrade(D); t.qty = raw.qty;
  // keep fields cleanTrade does not carry through
  t.src = { screener:D.screener, other:(D.screener === 'none' || !D.screener) ? D.other : '' };
  if(!t.src.screener) t.src.screener = '';
  recompute(t);
  const i = DB.trades.findIndex(x => x.id === t.id);
  if(i >= 0) DB.trades[i] = t; else DB.trades.push(t);
  DB.settings.tf = D.atrTf; DB.settings.period = D.atrPeriod; DB.settings.slMult = D.slMult; DB.settings.tpMode = D.tpMode;
  DB.settings.tpR = D.tpR; DB.settings.tpMult = D.tpMult; DB.settings.riskPct = D.riskPct;
  DB.settings.lev = Math.max(1, Math.min(MAX_LEV, D.lev || 1)); DB.settings.feeType = D.feeType; DB.settings.sizeMode = D.sizeMode;
  saveDB(); closeSheet(); render(); toast('Saved · ' + (t.review.verdict || 'review updated'));
}

/* =====================================================================
   Events
   ===================================================================== */
$('#btnAdd').addEventListener('click', () => openSheet(newDraft()));
$('#tabs').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if(b){ tab = b.dataset.tab; render(); } });
view.addEventListener('click', e => {
  const f = e.target.closest('[data-filter]'); if(f){ filter = f.dataset.filter; renderTrades(); return; }
  if(e.target.closest('[data-act="add"]')){ openSheet(newDraft()); return; }
  const o = e.target.closest('[data-open]'); if(o){ const t = DB.trades.find(x => x.id === o.dataset.open); if(t) openSheet(draftFromTrade(t)); return; }
  const pt = e.target.closest('[data-pt]'); if(pt){ period.type = pt.dataset.pt; period.off = 0; renderReviews(); return; }
  const po = e.target.closest('[data-po]');
  if(po && !po.disabled){ const v = +po.dataset.po; period.off = v === 0 ? 0 : Math.min(0, period.off + v); renderReviews(); return; }
  const ru = e.target.closest('[data-rule]'); if(ru){ const k = ru.dataset.rk; DB.rules[k] = Object.assign(DB.rules[k] || {}, { action:ru.dataset.rule }); saveDB(); renderReviews(); return; }
  const kp = e.target.closest('[data-kept]'); if(kp){ const k = kp.dataset.pk; DB.rules[k] = Object.assign(DB.rules[k] || {}, { kept:kp.dataset.kept }); saveDB(); renderReviews(); }
});

const sheet = $('#sheet');
sheet.addEventListener('click', e => {
  if(!D) return;
  const sh = e.target.closest('[data-sh]');
  if(sh){
    e.preventDefault();
    const a = sh.dataset.sh;
    if(a === 'close'){ closeSheet(); }
    else if(a === 'save'){ saveDraft(); }
    else if(a === 'delete'){ if(confirm('Delete this trade from the journal?')){ DB.trades = DB.trades.filter(t => t.id !== D.id); saveDB(); closeSheet(); render(); } }
    else if(a === 'pick'){ openPicker(); }
    else if(a === 'pickclose'){ $('#pick').classList.remove('open'); }
    else if(a === 'useltp'){ if(fin(D.ltp)){ D.entry = String(D.ltp); applyAtr(); const el = $('[data-f="entry"]', sheet); if(el) el.value = D.entry; update(); } else toast('Choose a coin first'); }
    else if(a === 'atrauto'){ D.atrEdited = false; D.atrVal = null; const el = $('#atrValIn'); if(el) el.value = fin(D.atrAuto) ? +D.atrAuto.toPrecision(5) : ''; applyAtr(); update(); }
    return;
  }
  const coin = e.target.closest('[data-coin]'); if(coin){ chooseCoin(coin.dataset.coin); return; }
  const ps = e.target.closest('[data-ps]'); if(ps) return;
  const seg = e.target.closest('[data-seg] button');
  if(seg){
    const key = seg.parentElement.dataset.seg, v = seg.dataset.v;
    if(key === 'side'){ D.side = v; applyAtr(); buildSheet(); }
    else if(key === 'status'){ D.status = v; if(v === 'closed'){ if(!D.closedAt) D.closedAt = Date.now(); if(!D.exit && fin(D.ltp)) D.exit = String(D.ltp); } buildSheet(); loadSymbolData(false); }
    else if(key === 'tpMode'){ D.tpMode = v; applyAtr(); buildSheet(); }
    else if(key === 'sizeMode'){
      const cur = curTrade();
      if(fin(cur.qty)){ if(v === 'qty') D.qtyIn = String(+cur.qty.toPrecision(8)); if(v === 'amount' && fin(cur.entry)) D.amountIn = String(+(cur.qty * cur.entry).toFixed(2)); }
      D.sizeMode = v; buildSheet();
    }
    else if(key === 'feeType'){ D.feeType = v; seg.parentElement.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === seg)); update(); }
    else if(key === 'chartTf'){ D.chartTf = v; chartCandles = null; buildSheet(); loadSymbolData(false); }
    else if(key === 'chartWin'){ DB.settings.chartWin = +v; saveDB(); seg.parentElement.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === seg)); drawPlanChart(); }
    return;
  }
  const yn = e.target.closest('[data-q]');
  if(yn){ const q = yn.dataset.q, v = yn.dataset.v; if(D.answers[q] === v) delete D.answers[q]; else D.answers[q] = v;
    yn.parentElement.parentElement.querySelectorAll('button').forEach(b => { const qq = QUESTIONS.find(x => x.id === q); const on = D.answers[q] === b.dataset.v;
      b.className = on ? (b.dataset.v === 'na' ? 'neu' : (b.dataset.v === qq.good ? 'good' : 'bad')) : ''; });
    update(); return; }
  const pill = e.target.closest('[data-pill]');
  if(pill){
    const k = pill.dataset.pill, v = pill.dataset.v;
    if(k === 'mistakes'){ const i = D.mistakes.indexOf(v); if(i >= 0) D.mistakes.splice(i, 1); else D.mistakes.push(v); }
    else D[k] = D[k] === v ? '' : v;
    pill.parentElement.querySelectorAll('.pill').forEach(b => {
      const on = k === 'mistakes' ? D.mistakes.includes(b.dataset.v) : D[k] === b.dataset.v; b.classList.toggle('on', on); });
    update(); return;
  }
  const st = e.target.closest('[data-star]');
  if(st){ const k = st.dataset.star, v = +st.dataset.v; D[k] = D[k] === v ? v - 1 : v;
    st.parentElement.querySelectorAll('button').forEach(b => b.classList.toggle('on', +b.dataset.v <= D[k])); update(); return; }
  const tpr = e.target.closest('[data-tpr]');
  if(tpr){ D.tpR = +tpr.dataset.tpr; applyAtr(); const inp = $('[data-f="tpR"]', sheet); if(inp) inp.value = D.tpR; sheet.querySelectorAll('[data-tpr]').forEach(b => b.classList.toggle('on', +b.dataset.tpr === D.tpR)); update(); return; }
  const so = e.target.closest('[data-show]');
  if(so){ const k = so.dataset.show; DB.settings.show[k] = !DB.settings.show[k]; saveDB(); so.classList.toggle('on', DB.settings.show[k]); drawPlanChart(); }
});
sheet.addEventListener('change', e => {
  if(!D) return;
  const c = e.target.closest('[data-c]');
  if(c){
    D[c.dataset.c] = c.checked;
    if(c.dataset.c === 'atrOn'){ if(D.atrOn) applyAtr(); }
    if(c.dataset.c === 'tpOn' && D.tpOn) applyAtr();
    const ab = $('#atrBox'); if(ab) ab.style.display = (D.atrOn || (D.tpOn && D.tpMode === 'ATR')) ? '' : 'none';
    const tb = $('#tpBox'); if(tb) tb.style.display = D.tpOn ? '' : 'none';
    update(); return;
  }
  const f = e.target.dataset.f; if(!f) return;
  if(f === 'screener'){ D.screener = e.target.value; const ob = $('#otherBox'); if(ob) ob.style.display = D.screener === 'none' ? '' : 'none'; if(D.screener !== 'none') D.other = ''; update(); }
  else if(f === 'other'){ D.other = e.target.value; update(); }
  else if(f === 'atrTf'){ D.atrTf = e.target.value; D.atrEdited = false; D.atrVal = null; D.atrAuto = null; loadSymbolData(false); }
});
sheet.addEventListener('input', e => {
  if(!D) return;
  const f = e.target.dataset.f; if(!f) return;
  const v = e.target.value;
  if(['entry', 'exit', 'fee', 'note', 'qtyIn', 'amountIn'].includes(f)){ D[f] = v; if(f === 'entry') applyAtr(); }
  else if(f === 'lev'){ const n = Math.round(num(v) || 1); D.lev = Math.max(1, Math.min(MAX_LEV, n)); }
  else if(f === 'riskPct'){ const n = num(v); if(n != null && n > 0 && n <= 100) D.riskPct = n; }
  else if(f === 'portfolio'){ const n = num(v); DB.settings.portfolio = (n != null && n > 0) ? n : 0; saveDB(); }
  else if(f === 'stop'){ D.stop = v; if(D.atrOn){ D.atrOn = false; const cb = $('[data-c="atrOn"]', sheet); if(cb) cb.checked = false; } if(D.tpOn) applyAtr(); }
  else if(f === 'target'){ D.target = v; if(D.tpOn){ D.tpOn = false; const cb = $('[data-c="tpOn"]', sheet); if(cb) cb.checked = false; const tb = $('#tpBox'); if(tb) tb.style.display = 'none'; } }
  else if(f === 'atrVal'){ const n = num(v); D.atrVal = n; D.atrEdited = n != null; applyAtr(); }
  else if(f === 'atrPeriod'){ const n = Math.round(num(v) || 0); if(n >= 2 && n <= 100){ D.atrPeriod = n; D.atrEdited = false; D.atrVal = null; clearTimeout(input_t); input_t = setTimeout(() => loadSymbolData(false), 400); } }
  else if(f === 'slMult'){ const n = num(v); if(n != null && n > 0){ D.slMult = n; applyAtr(); } }
  else if(f === 'tpR'){ const n = num(v); if(n != null && n > 0){ D.tpR = n; applyAtr(); sheet.querySelectorAll('[data-tpr]').forEach(b => b.classList.toggle('on', +b.dataset.tpr === D.tpR)); } }
  else if(f === 'tpMult'){ const n = num(v); if(n != null && n > 0){ D.tpMult = n; applyAtr(); } }
  else if(f === 'openedAt'){ const ts = new Date(v).getTime(); if(isFinite(ts)) D.openedAt = ts; }
  else if(f === 'closedAt'){ const ts = new Date(v).getTime(); if(isFinite(ts)) D.closedAt = ts; }
  update();
});
let input_t = null;
document.addEventListener('keydown', e => { if(e.key === 'Escape' && D){ const p = $('#pick'); if(p && p.classList.contains('open')) p.classList.remove('open'); else closeSheet(); } });
window.addEventListener('resize', () => { if(D) drawPlanChart(); });

/* export / import */
$('#btnExport').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(DB, null, 2)], { type:'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'tradesphere-journal-' + new Date().toISOString().slice(0, 10) + '.json';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast('Journal exported');
});
$('#btnImport').addEventListener('click', () => $('#fileImport').click());
$('#fileImport').addEventListener('change', e => {
  const file = e.target.files[0]; if(!file) return;
  const rd = new FileReader();
  rd.onload = () => {
    try{
      const raw = JSON.parse(rd.result);
      const incoming = (Array.isArray(raw.trades) ? raw.trades : []).map(cleanTrade).filter(t => t && usable(t));
      if(!incoming.length) throw new Error('no trades');
      const have = new Set(DB.trades.map(t => t.id)); let added = 0;
      incoming.forEach(t => { if(!have.has(t.id)){ if(!t.review) recompute(t); DB.trades.push(t); added++; } });
      saveDB(); render(); toast(added ? `Imported ${added} trade${added === 1 ? '' : 's'}` : 'Nothing new in that file');
    }catch(err){ toast('That file is not a journal export'); }
  };
  rd.readAsText(file); e.target.value = '';
});

/* open trades: live unrealized R on the list */
async function refreshLive(){
  if(!DB.trades.some(t => t.status === 'open')) return;
  try{ livePx = await priceMap(); if(tab === 'trades' && !D) renderTrades(); }catch(e){}
}
render();
refreshLive(); setInterval(refreshLive, 20000);
</script>
