<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>Alerts dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme:dark;
    --bg:#090b0f; --surface:#12151b; --surface2:#171b23; --raise:#1c212b;
    --line:rgba(255,255,255,.075); --line2:rgba(255,255,255,.12);
    --text:#eef0f4; --sec:#b4bac6; --mute:#7e8696; --faint:#566072;
    --up:#35e0c0; --down:#ff5470; --amber:#f5a623; --info:#5b8cff;
    --ui:'Space Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
    --r:20px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--ui);}
  body{min-height:100vh;background:
    radial-gradient(900px 420px at 8% -8%,rgba(57,135,229,.16),transparent 60%),
    radial-gradient(700px 380px at 100% 0%,rgba(53,224,192,.09),transparent 60%),var(--bg);}
  button,select,input{font-family:inherit;color:inherit;}
  button{cursor:pointer;background:none;border:none;padding:0;}
  .page{max-width:940px;margin:0 auto;padding:0 14px 96px;}

  /* ---------- sticky bar ---------- */
  .bar{position:sticky;top:0;z-index:30;margin:0 -14px;padding:10px 14px 9px;background:rgba(9,11,15,.82);backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);border-bottom:1px solid var(--line);}
  .brow{display:flex;align-items:center;gap:10px;}
  .ib{width:36px;height:36px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--sec);transition:.15s;}
  .ib:hover{border-color:var(--line2);color:var(--text);} .ib svg{width:16px;height:16px;}
  .ttl{flex:1;min-width:0;}
  .ttl h1{margin:0;font:700 17px var(--ui);letter-spacing:-.01em;line-height:1.15;}
  .live{display:flex;align-items:center;gap:6px;font:500 10.5px var(--mono);color:var(--mute);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .pulse{width:6px;height:6px;border-radius:50%;background:var(--up);box-shadow:0 0 0 0 rgba(53,224,192,.6);animation:ping 2.2s infinite;flex-shrink:0;}
  .pulse.off{background:var(--down);animation:none;}
  @keyframes ping{70%{box-shadow:0 0 0 7px rgba(53,224,192,0)}100%{box-shadow:0 0 0 0 rgba(53,224,192,0)}}
  .frow{display:flex;gap:8px;margin-top:9px;align-items:center;}
  .seg{display:inline-flex;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px;flex-shrink:0;}
  .seg button{height:28px;min-width:34px;padding:0 10px;border-radius:9px;font:600 11.5px var(--mono);color:var(--mute);transition:.15s;}
  .seg button.on{background:var(--raise);color:var(--text);box-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 4px 12px rgba(0,0,0,.35);}
  .sel{position:relative;flex:1;min-width:0;}
  .sel select{width:100%;height:36px;appearance:none;-webkit-appearance:none;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:0 28px 0 11px;font:600 11.5px var(--mono);color:var(--sec);text-overflow:ellipsis;}
  .sel select:focus{outline:none;border-color:rgba(57,135,229,.7);}
  .sel:after{content:"";position:absolute;right:11px;top:50%;width:6px;height:6px;border-right:1.6px solid var(--mute);border-bottom:1.6px solid var(--mute);transform:translateY(-70%) rotate(45deg);pointer-events:none;}
  .sel option{background:#171b23;}

  /* ---------- bottom nav ---------- */
  .nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:linear-gradient(0deg,rgba(9,11,15,.96) 55%,rgba(9,11,15,0));pointer-events:none;}
  .nav-in{pointer-events:auto;display:flex;gap:2px;width:100%;max-width:520px;background:rgba(23,27,35,.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line2);border-radius:20px;padding:5px;box-shadow:0 12px 40px rgba(0,0,0,.55);}
  .nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 6px;border-radius:15px;color:var(--mute);font:600 9.5px var(--mono);letter-spacing:.02em;transition:.15s;}
  .nav button svg{width:18px;height:18px;}
  .nav button.on{background:rgba(57,135,229,.16);color:#8fb8ff;}

  /* ---------- cards ---------- */
  .view{padding-top:14px;transition:opacity .2s;}
  .view.busy{opacity:.55;}
  .card{position:relative;background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.012));border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px;overflow:hidden;}
  .card.hero{padding:18px 16px 16px;background:radial-gradient(520px 220px at 0% 0%,rgba(57,135,229,.22),transparent 65%),radial-gradient(420px 200px at 100% 100%,rgba(53,224,192,.10),transparent 65%),var(--surface);border-color:var(--line2);}
  .ch-h{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px;}
  .ch-h .t{flex:1;min-width:0;} .ch-h h2{margin:0;font:700 15px var(--ui);letter-spacing:-.005em;} .ch-h p{margin:3px 0 0;font:500 11.5px/1.5 var(--ui);color:var(--mute);}
  .eyebrow{font:600 9.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mute);}
  .grid{display:grid;gap:12px;}
  @media(min-width:820px){.cols2{grid-template-columns:1fr 1fr;} .cols2>.card{margin-bottom:0;}}
  .big{font:700 44px/1 var(--ui);letter-spacing:-.03em;}
  .pos{color:var(--up);} .neg{color:var(--down);} .mut{color:var(--mute);} .amb{color:var(--amber);} .inf{color:#8fb8ff;}

  /* KPI tiles */
  .kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
  @media(min-width:560px){.kpis{grid-template-columns:repeat(4,1fr);}}
  .kpi{background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:15px;padding:11px 12px;min-width:0;}
  .kpi .k{font:600 9px var(--mono);letter-spacing:.11em;text-transform:uppercase;color:var(--mute);}
  .kpi .v{font:700 23px/1.1 var(--ui);margin-top:5px;letter-spacing:-.02em;}
  .kpi .d{font:500 10.5px/1.45 var(--mono);color:var(--mute);margin-top:4px;}
  .up{color:var(--up);} .dn{color:var(--down);}

  /* verdict */
  .verdict{display:flex;gap:11px;align-items:flex-start;padding:12px;border-radius:15px;border:1px solid var(--line);background:rgba(255,255,255,.03);margin-top:14px;}
  .verdict .ic{width:30px;height:30px;border-radius:10px;display:flex;align-items:center;justify-content:center;font:700 14px var(--ui);flex-shrink:0;background:rgba(255,255,255,.07);}
  .verdict.good{border-color:rgba(53,224,192,.35);background:rgba(53,224,192,.06);} .verdict.good .ic{background:rgba(53,224,192,.18);color:var(--up);}
  .verdict.warn{border-color:rgba(245,166,35,.38);background:rgba(245,166,35,.06);} .verdict.warn .ic{background:rgba(245,166,35,.18);color:var(--amber);}
  .verdict.bad{border-color:rgba(255,84,112,.38);background:rgba(255,84,112,.06);} .verdict.bad .ic{background:rgba(255,84,112,.18);color:var(--down);}
  .verdict b{display:block;font:700 13.5px var(--ui);} .verdict span{display:block;font:500 11.5px/1.55 var(--ui);color:var(--sec);margin-top:3px;}

  /* svg */
  svg.cv{width:100%;height:auto;display:block;overflow:visible;touch-action:manipulation;}
  .cv text{font-family:'JetBrains Mono',monospace;font-size:9px;fill:#7e8696;}
  .cv .lbl{fill:#b4bac6;font-size:10px;} .cv .lbs{font-size:10px;font-weight:700;fill:#eef0f4;}
  .cv .hit{fill:transparent;cursor:pointer;}
  .cv .hov{transition:opacity .12s;} .cv g:hover .hov{opacity:.85;}
  .legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:11px;font:500 10.5px var(--mono);color:var(--sec);}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;}
  .legend i.ln{height:3px;border-radius:2px;vertical-align:3px;width:14px;}

  /* pills & rows */
  .pill{display:inline-flex;align-items:center;gap:4px;font:700 9.5px var(--mono);letter-spacing:.06em;padding:3px 8px;border-radius:8px;text-transform:uppercase;white-space:nowrap;}
  .pill.l{color:var(--up);background:rgba(53,224,192,.13);} .pill.s{color:var(--down);background:rgba(255,84,112,.13);}
  .pill.n{color:var(--sec);background:rgba(255,255,255,.06);} .pill.a{color:var(--amber);background:rgba(245,166,35,.13);} .pill.b{color:#8fb8ff;background:rgba(57,135,229,.16);}
  .sdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;}
  .list .it{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line);}
  .list .it:first-child{border-top:none;padding-top:0;}
  .nm{font:700 13.5px var(--ui);} .nm small{font:500 10.5px var(--mono);color:var(--mute);margin-left:6px;font-weight:500;}
  .grow{flex:1;min-width:0;}
  .mono{font-family:var(--mono);} .r{text-align:right;}
  .meter{height:6px;border-radius:4px;background:rgba(255,255,255,.07);overflow:hidden;display:flex;gap:2px;}
  .meter i{display:block;height:100%;border-radius:3px;}
  .tip2{font:500 11px/1.55 var(--mono);color:var(--mute);margin-top:10px;}
  .tip2 b{color:var(--text);font-weight:600;}
  .banner{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:15px;background:rgba(245,166,35,.07);border:1px solid rgba(245,166,35,.35);font:500 11.5px/1.55 var(--ui);color:var(--sec);margin-bottom:12px;}
  .banner b{color:var(--amber);}
  .empty{padding:34px 14px;text-align:center;color:var(--mute);font:500 12.5px/1.6 var(--ui);}
  .skel{height:120px;border-radius:16px;background:linear-gradient(90deg,rgba(255,255,255,.03),rgba(255,255,255,.07),rgba(255,255,255,.03));background-size:200% 100%;animation:sh 1.4s infinite;margin-bottom:12px;}
  @keyframes sh{to{background-position:-200% 0}}

  /* stat strip inside strategy cards */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px;}
  .stats div{background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:12px;padding:8px 8px;min-width:0;}
  .stats span{display:block;font:600 8px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--mute);}
  .stats b{display:block;font:700 13px var(--ui);margin-top:3px;}
  @media(max-width:380px){.stats b{font-size:12px;} .stats div{padding:7px 6px;}}

  /* tables */
  details.tbl{margin-top:12px;border-top:1px solid var(--line);padding-top:10px;}
  details.tbl summary{cursor:pointer;font:600 10.5px var(--mono);color:var(--mute);list-style:none;display:flex;align-items:center;gap:6px;}
  details.tbl summary::-webkit-details-marker{display:none;} details.tbl summary:before{content:"▸";transition:.15s;} details.tbl[open] summary:before{transform:rotate(90deg);}
  .tw{overflow-x:auto;margin-top:8px;} table.t{border-collapse:collapse;width:100%;font:500 11px var(--mono);font-variant-numeric:tabular-nums;}
  table.t th{font:600 9px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mute);text-align:right;padding:6px 8px;border-bottom:1px solid var(--line2);white-space:nowrap;}
  table.t td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap;color:var(--sec);}
  table.t th:first-child,table.t td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);}

  /* coins */
  .search{display:flex;gap:8px;margin-bottom:12px;}
  .search input{flex:1;min-width:0;height:38px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:0 12px;font:500 12.5px var(--mono);}
  .search input:focus{outline:none;border-color:rgba(57,135,229,.7);} .search .sel{flex:0 0 132px;}
  .coin{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:2px 10px;align-items:center;padding:12px 2px;border-top:1px solid var(--line);cursor:pointer;border-radius:12px;transition:background .12s;}
  .coin:first-child{border-top:none;} .coin:hover{background:rgba(255,255,255,.03);}
  .rk{font:600 10.5px var(--mono);color:var(--faint);text-align:center;}
  .coin .l1{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .coin .l2{font:500 10.5px var(--mono);color:var(--mute);margin-top:4px;display:flex;gap:10px;flex-wrap:wrap;}
  .coin .rt{text-align:right;} .coin .rt b{display:block;font:700 14px var(--ui);} .coin .rt span{font:500 10.5px var(--mono);color:var(--mute);}
  .dots{display:inline-flex;gap:3px;} .dots i{width:9px;height:9px;border-radius:3px;display:block;}
  table.dm{width:100%;border-collapse:separate;border-spacing:4px;font:700 11px var(--mono);}
  table.dm th{font:600 9px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mute);padding:2px;}
  table.dm td{border-radius:10px;text-align:center;padding:9px 2px;background:rgba(255,255,255,.04);cursor:pointer;}
  table.dm td.nm2{text-align:left;background:none;padding-left:2px;font:700 12.5px var(--ui);}
  .more{width:100%;margin-top:10px;height:40px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);font:600 11px var(--mono);color:var(--sec);}

  /* sheet */
  .shade{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .2s;}
  .shade.on{opacity:1;pointer-events:auto;}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;max-height:88vh;overflow:auto;background:var(--surface);border:1px solid var(--line2);border-radius:24px 24px 0 0;padding:10px 16px 28px;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);margin:0 auto;max-width:640px;}
  .sheet.on{transform:none;}
  .grab{width:38px;height:4px;border-radius:2px;background:var(--line2);margin:2px auto 12px;}

  /* retrace */
  .rzc{padding:13px 0;border-top:1px solid var(--line);} .rzc:first-child{border-top:none;padding-top:0;}
  .rzc.grey{opacity:.55;}
  .toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--raise);border:1px solid var(--line2);padding:9px 14px;border-radius:12px;font:600 11.5px var(--mono);z-index:90;opacity:0;pointer-events:none;transition:opacity .2s;}
  .toast.on{opacity:1;}
  #tt{position:fixed;z-index:100;pointer-events:none;background:rgba(28,33,43,.97);border:1px solid var(--line2);border-radius:12px;padding:8px 11px;font:500 11px/1.5 var(--mono);color:var(--sec);max-width:240px;box-shadow:0 10px 30px rgba(0,0,0,.5);opacity:0;transition:opacity .1s;white-space:pre-line;}
  #tt b{display:block;color:var(--text);font:700 12.5px var(--ui);margin-bottom:2px;}
  #tt.on{opacity:1;}
  .foot{font:500 10.5px/1.65 var(--ui);color:var(--faint);padding:6px 4px 0;}
</style>
</head>
<body>
<div class="page">
  <header class="bar">
    <div class="brow">
      <button class="ib" id="bBack" title="Back to alerts" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
      <div class="ttl"><h1>Alerts dashboard</h1><div class="live" id="live"><span class="pulse off"></span><span>loading…</span></div></div>
      <button class="ib" id="bShare" title="Share summary" aria-label="Share summary"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 10.5l6.8-4M8.6 13.5l6.8 4"/></svg></button>
      <button class="ib" id="bCsv" title="Export trades (CSV)" aria-label="Export CSV"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M4 20h16"/></svg></button>
      <button class="ib" id="bRef" title="Refresh" aria-label="Refresh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.5 15A9 9 0 1 1 18.4 5.6L23 10"/></svg></button>
    </div>
    <div class="frow">
      <div class="seg" id="fPeriod"></div>
      <div class="sel"><select id="fStrat" aria-label="Strategy"></select></div>
      <div class="sel"><select id="fTf" aria-label="Timeframe"></select></div>
    </div>
  </header>
  <main class="view" id="view"><div class="skel"></div><div class="skel"></div><div class="skel"></div></main>
  <div class="foot" id="foot"></div>
</div>
<nav class="nav"><div class="nav-in" id="nav"></div></nav>
<div class="shade" id="shade"></div><div class="sheet" id="sheet" role="dialog" aria-label="Coin detail"></div>
<div id="tt"></div><div class="toast" id="toast"></div>

<script>
(function(){
'use strict';
const DAY = 864e5, HOUR = 36e5;
const lsGet = k => { try{ return localStorage.getItem(k); }catch(e){ return null; } };
const lsSet = (k, v) => { try{ localStorage.setItem(k, v); }catch(e){} };
const $ = id => document.getElementById(id);
const esc = v => String(v).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
let PARENT = null; try{ if(window.parent && window.parent !== window && window.parent.AlertsPanel) PARENT = window.parent; }catch(e){}

const DATA_URL = lsGet('ts-alerts-data-url') || 'https://raw.githubusercontent.com/justgame7/TradeSphere/main/data/donchian-alerts.json';
const HIST_URL = lsGet('ts-alerts-history-url') || DATA_URL.replace(/[^/]*$/, 'alerts-history.json');
const SHOW_1H = lsGet('crypto-screener-alerts-1h') === 'true';
// Donchian 55/20 is switched off (see scripts/donchian-alerts.js); Bullish CHoCH exists on 4H and Daily only.
const STRATS = ['20/10', 'Ichimoku', 'CHoCH'];
const SNAME = { '20/10': 'Donchian 20/10', 'Ichimoku': 'Ichimoku', 'CHoCH': 'Bullish CHoCH' };
const SSHORT = { '20/10': 'D 20/10', 'Ichimoku': 'Ichimoku', 'CHoCH': 'Bull CHoCH' };
const SMENU = { '20/10': 'Donchian', 'Ichimoku': 'Ichimoku', 'CHoCH': 'Bull CHoCH' };   // short labels for the filter menus
const SCOL = { '20/10': '#3987e5', 'Ichimoku': '#199e70', 'CHoCH': '#d95926' };   // the validated first three categorical slots
const TFS = SHOW_1H ? ['1H', '4H', '1D', '1W'] : ['4H', '1D', '1W'];
const TFNAME = { '1H': '1H', '4H': '4H', '1D': 'Daily', '1W': 'Weekly' };
const PERIOD_MS = { '1H': HOUR, '4H': 4 * HOUR, '1D': DAY, '1W': 7 * DAY };
const KEEP_MS = { '1H': DAY, '4H': 2 * DAY, '1D': 7 * DAY, '1W': 28 * DAY };
const UP = '#35e0c0', DOWN = '#ff5470', GRID = 'rgba(255,255,255,.07)';

const saved = (() => { try{ return JSON.parse(lsGet('ts-alerts-dash-v2') || '{}') || {}; }catch(e){ return {}; } })();
const S = { tab: 'over', period: ['day', 'week', 'month'].includes(saved.period) ? saved.period : 'week', strat: STRATS.includes(saved.strat) ? saved.strat : 'all', tf: saved.tf || 'all',
  sel: null, coinSort: 'activity', coinAll: false, coinQ: '', scope: 'period', rzTf: TFS.includes('1D') ? '1D' : TFS[0], sheet: null };
// Timeframe filter: 'all', 'ex1h' (everything except 1H, the default when 1H alerts are switched on) or one timeframe.
if(S.tf === 'all' && !saved.tf && SHOW_1H) S.tf = 'ex1h';
if(S.tf !== 'all' && S.tf !== 'ex1h' && !TFS.includes(S.tf)) S.tf = SHOW_1H ? 'ex1h' : 'all';
if(S.tf === 'ex1h' && !SHOW_1H) S.tf = 'all';
const tfSel = () => S.tf === 'all' ? TFS : S.tf === 'ex1h' ? TFS.filter(t => t !== '1H') : [S.tf];
const tfLabel = () => S.tf === 'all' ? 'all timeframes' : S.tf === 'ex1h' ? 'all except 1H' : TFNAME[S.tf];
const persist = () => lsSet('ts-alerts-dash-v2', JSON.stringify({ period: S.period, strat: S.strat, tf: S.tf }));

let MAIN = null, HIST = null, T = [], LIMITED = false, loadErr = '', VIEW = null;
const lastClose = {};
const fmtPct = (v, d = 2) => Number.isFinite(v) ? (v >= 0 ? '+' : '−') + Math.abs(v).toFixed(d) + '%' : '—';
const cls = v => Number.isFinite(v) ? (v >= 0 ? 'pos' : 'neg') : 'mut';
const fmtPx = v => { if(!Number.isFinite(v)) return '—'; const a = Math.abs(v); return a >= 1000 ? v.toLocaleString(undefined, { maximumFractionDigits: 1 }) : a >= 1 ? v.toFixed(2) : a >= 0.01 ? v.toPrecision(4) : v.toPrecision(3); };
const dur = ms => { const d = ms / DAY; return d >= 1 ? d.toFixed(d >= 10 ? 0 : 1) + 'd' : Math.max(1, Math.round(ms / HOUR)) + 'h'; };

const num = (v, d = 0) => Number.isFinite(v) ? v.toFixed(d) : '—';

/* ====================================================== data ====================================================== */
async function getJSON(url){
  const r = await fetch(url + (url.includes('?') ? '&' : '?') + 't=' + Math.floor(Date.now() / 60000), { cache: 'no-store' });
  if(!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}
async function load(manual){
  if(manual) $('view').classList.add('busy');
  try{
    const [m, h] = await Promise.all([getJSON(DATA_URL), getJSON(HIST_URL).catch(() => null)]);
    MAIN = m; HIST = h; loadErr = '';
  }catch(e){ loadErr = 'Could not load the alerts (' + e.message + ').'; }
  build(); render();
  $('view').classList.remove('busy');
}
function livePx(sym){
  let v = NaN;
  try{ if(PARENT) v = PARENT.AlertsPanel.livePx(sym); }catch(e){}
  return Number.isFinite(v) ? v : lastClose[sym];
}
function build(){
  T = []; LIMITED = false;
  Object.keys(lastClose).forEach(k => delete lastClose[k]);
  if(!MAIN) return;
  TFS.forEach(tf => { const d = (MAIN.timeframes || {})[tf]; if(d) (d.trades || []).forEach(t => { if(Number.isFinite(t.lastClose)) lastClose[t.symbol] = t.lastClose; }); });
  if(HIST && HIST.tfs){
    TFS.forEach(tf => {
      const h = HIST.tfs[tf]; if(!h) return;
      h.trades.forEach(a => { const per = h.periodMs; T.push({ tf, per, sys: a[0], sym: a[1], side: a[2], eE: a[3] + per, eX: a[4] ? a[4] + per : 0, pct: a[5], reason: a[6], ep: a[7], open: !a[4] }); });
    });
  }else{
    // The history file is saved by the next alerts job run. Until then use what the alerts file keeps: every open trade and the recent closed ones.
    LIMITED = true;
    TFS.forEach(tf => {
      const d = (MAIN.timeframes || {})[tf]; if(!d) return; const per = PERIOD_MS[tf];
      (d.trades || []).forEach(t => T.push({ tf, per, sys: t.system || '20/10', sym: t.symbol, side: t.side === 'long' ? 1 : -1, eE: t.entryTime + per, eX: t.exitTime ? t.exitTime + per : 0,
        pct: t.status === 'closed' ? t.resultPct : null, reason: t.exitReason === 'stop' ? 2 : 1, ep: t.status === 'open' ? t.entryClose : null, open: t.status === 'open' }));
    });
  }
  T = T.filter(t => STRATS.includes(t.sys));   // data written before 55/20 was switched off may still contain it
  refreshLive();
}
function refreshLive(){
  T.forEach(t => {
    if(!t.open) return;
    const px = livePx(t.sym); t.px = px;
    t.upl = Number.isFinite(px) && t.ep ? t.side * (px - t.ep) / t.ep * 100 : null;
  });
}

/* ================================================== analytics ================================================== */
const filt = () => T.filter(t => (S.strat === 'all' || t.sys === S.strat) && tfSel().includes(t.tf));
const covStart = () => {
  let s = 0;
  tfSel().forEach(tf => {
    if(HIST && HIST.tfs && HIST.tfs[tf]){ const h = HIST.tfs[tf]; s = Math.max(s, Date.now() - h.historyDays * DAY + 80 * h.periodMs); }
    else s = Math.max(s, Date.now() - KEEP_MS[tf]);
  });
  return s;
};
function buckets(){
  const now = new Date(), out = [], n = S.period === 'day' ? 30 : 12;
  for(let i = n - 1; i >= 0; i--){
    let s, e, label;
    if(S.period === 'day'){ s = new Date(now.getFullYear(), now.getMonth(), now.getDate() - i); e = new Date(s.getFullYear(), s.getMonth(), s.getDate() + 1); label = s.toLocaleDateString(undefined, { day: 'numeric', month: 'short' }); }
    else if(S.period === 'week'){ const dow = (now.getDay() + 6) % 7; s = new Date(now.getFullYear(), now.getMonth(), now.getDate() - dow - 7 * i); e = new Date(s.getFullYear(), s.getMonth(), s.getDate() + 7); label = s.toLocaleDateString(undefined, { day: 'numeric', month: 'short' }); }
    else { s = new Date(now.getFullYear(), now.getMonth() - i, 1); e = new Date(s.getFullYear(), s.getMonth() + 1, 1); label = s.toLocaleDateString(undefined, { month: 'short' }) + (s.getMonth() === 0 || i === n - 1 ? " '" + String(s.getFullYear()).slice(2) : ''); }
    out.push({ s: +s, e: +e, label });
  }
  return out;
}
function stats(list){
  const c = list.filter(t => !t.open && Number.isFinite(t.pct));
  const w = c.filter(t => t.pct > 0), l = c.filter(t => t.pct <= 0);
  const sw = w.reduce((a, t) => a + t.pct, 0), sl = l.reduce((a, t) => a + t.pct, 0), net = sw + sl;
  const avgW = w.length ? sw / w.length : NaN, avgL = l.length ? sl / l.length : NaN, wr = c.length ? w.length / c.length * 100 : NaN;
  return { n: c.length, w: w.length, l: l.length, wr, avgW, avgL, exp: c.length ? net / c.length : NaN, net,
    pf: sl < 0 ? sw / Math.abs(sl) : (sw > 0 ? Infinity : NaN), payoff: l.length && w.length ? avgW / Math.abs(avgL) : NaN, need: wr > 0 && wr < 100 ? (100 - wr) / wr : NaN,
    best: c.length ? Math.max(...c.map(t => t.pct)) : NaN, worst: c.length ? Math.min(...c.map(t => t.pct)) : NaN, hold: c.length ? c.reduce((a, t) => a + (t.eX - t.eE), 0) / c.length : NaN };
}
function equity(list, from){
  const ev = list.filter(t => !t.open && t.eX && Number.isFinite(t.pct) && (!from || t.eX >= from)).sort((a, b) => a.eX - b.eX);
  let c = 0, peak = 0, dd = 0; const pts = [[from || (ev[0] ? ev[0].eX : Date.now()), 0]];
  ev.forEach(t => { c += t.pct; if(c > peak) peak = c; dd = Math.min(dd, c - peak); pts.push([t.eX, c]); });
  return { pts, end: c, dd };
}
function bucketStats(F, B){
  return B.map(b => {
    const opened = F.filter(t => t.eE >= b.s && t.eE < b.e), closed = F.filter(t => t.eX && t.eX >= b.s && t.eX < b.e);
    const openEnd = F.filter(t => t.eE < b.e && (!t.eX || t.eX >= b.e)), openStart = F.filter(t => t.eE < b.s && (!t.eX || t.eX >= b.s));
    const newOpen = openEnd.filter(t => t.eE >= b.s);
    return { b, opened, closed, openEnd, openStart, newOpen, carried: openEnd.length - newOpen.length, st: stats(closed), oL: opened.filter(t => t.side > 0).length, oS: opened.filter(t => t.side < 0).length };
  });
}
function zone(r, px){
  if(!Number.isFinite(px) || px <= 0) return null;
  const d50 = Math.abs(px - r.l50) / px * 100, d618 = Math.abs(px - r.l618) / px * 100, a = d50 < 1, b = d618 < 1;
  if(!a && !b) return null;
  return { tag: a && b ? '50% + 61.8%' : b ? '61.8%' : '50%', near: Math.min(a ? d50 : 1e9, b ? d618 : 1e9), signed: (px - (b && (!a || d618 <= d50) ? r.l618 : r.l50)) / px * 100 };
}
function radar(){
  const out = {};
  TFS.forEach(tf => {
    const list = ((((MAIN || {}).timeframes || {})[tf] || {}).retrace) || [], rows = [];
    list.forEach(r => {
      const px = livePx(r.symbol) || r.lastClose, z = zone(r, px); if(!z) return;
      const open = tf === '1H' ? [] : T.filter(t => t.open && t.sym === r.symbol);
      const al = open.filter(t => (t.side > 0 && r.dir === 'bullish') || (t.side < 0 && r.dir === 'bearish')).length;
      rows.push({ r, z, px, open: open.length, aligned: al, against: open.length - al });
    });
    rows.sort((a, b) => (b.aligned - a.aligned) || (a.z.near - b.z.near));
    out[tf] = rows;
  });
  return out;
}
function verdict(st, scope){
  if(st.n < 8) return { tone: 'n', icon: '…', title: 'Too early to judge', text: `Only ${st.n} closed trade${st.n === 1 ? '' : 's'} in ${scope}. Expectancy needs a sample of at least 8 to mean anything.` };
  const good = st.exp > 0 && (st.pf >= 1.2 || st.pf === Infinity), tone = good ? 'good' : st.exp >= 0 ? 'warn' : 'bad';
  const band = st.wr < 30 ? 'below' : st.wr > 45 ? 'above' : 'inside';
  const text = `${st.wr.toFixed(0)}% of trades win, which is ${band} the 30–45% range typical for trend-following. Winners average ${fmtPct(st.avgW, 1)} and losers ${fmtPct(st.avgL, 1)}, a payoff ratio of ${num(st.payoff, 2)} where about ${num(st.need, 2)} is needed to break even at this win rate. ${st.exp >= 0 ? 'The edge is positive' : 'The edge is negative'}: ${fmtPct(st.exp)} per trade.`;
  return { tone, icon: good ? '✓' : st.exp >= 0 ? '!' : '✕', title: good ? 'Edge is working' : st.exp >= 0 ? 'Marginal edge' : 'Losing edge', text };
}

const bucketTitle = x => { const f = d => new Date(d).toLocaleDateString(undefined, { day: 'numeric', month: 'short' }); return S.period === 'day' ? new Date(x.b.s).toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' }) : S.period === 'week' ? f(x.b.s) + ' – ' + f(x.b.e - 1) : new Date(x.b.s).toLocaleDateString(undefined, { month: 'long', year: 'numeric' }); };

  s += `<line x1="${PL}" x2="${W - PR}" y1="${zero}" y2="${zero}" stroke="rgba(255,255,255,.16)"/><text x="${PL}" y="${PT + 6}">opened ▲</text><text x="${PL}" y="${H - PB - 3}">closed ▼</text>`;

function chartEquity(F, from){

function sparkline(pts, w, h, color){

/* Sankey: where the trades active in the selected period came from and where they ended up */
function sankey(F, b){
  const act = F.filter(t => t.eE < b.e && (!t.eX || t.eX >= b.s));
  const M = { carried: { won: 0, lost: 0, open: 0 }, fresh: { won: 0, lost: 0, open: 0 } };
  act.forEach(t => { const src = t.eE < b.s ? 'carried' : 'fresh'; const dst = t.eX && t.eX < b.e ? (t.pct > 0 ? 'won' : 'lost') : 'open'; M[src][dst]++; });
  const total = act.length; if(!total) return '<div class="empty">No trades were active in this period.</div>';
  const LW = 78, H = 210, gap = 12, nodeW = 10, xl = LW, xr = W - LW - nodeW, xm = (xl + nodeW + xr) / 2;
  const L = [['carried', 'Already open', '#4a5879'], ['fresh', 'Opened', '#8fb4ff']], R = [['won', 'Closed, won', '#1f9d86'], ['lost', 'Closed, lost', '#b8485d'], ['open', 'Still open', '#3d6fb8']];
  const sc = (H - gap * 2 - 4) / total;
  const sumL = k => Object.values(M[k]).reduce((a, v) => a + v, 0), sumR = k => M.carried[k] + M.fresh[k];
  const place = (items, sum) => { const used = items.filter(i => sum(i[0]) > 0), out = {}; let y = (H - (used.reduce((a, i) => a + sum(i[0]) * sc, 0) + gap * Math.max(0, used.length - 1))) / 2; used.forEach(i => { out[i[0]] = { y, h: sum(i[0]) * sc, c: i[2], n: i[1] }; y += sum(i[0]) * sc + gap; }); return out; };
  const pl = place(L, sumL), pr = place(R, sumR), cl = {}, cr = {};

function coinsData(C){

  cur.opened.forEach(t => { if(coins[t.sym]) coins[t.sym].opened++; }); cur.closed.forEach(t => { if(coins[t.sym]) coins[t.sym].closedP++; });
  return Object.values(coins).map(c => { const s2 = stats(c.closed), u = c.open.filter(t => Number.isFinite(t.upl)); return { ...c, s2, upl: u.length ? u.reduce((a, t) => a + t.upl, 0) / u.length : NaN, L: c.open.filter(t => t.side > 0).length, Sh: c.open.filter(t => t.side < 0).length, act: c.opened + c.closedP }; });

function headlines(C){
  const { F, cur, prev, openNow, uplAvg, RZ } = C, out = [], unit = S.period, per = C.isLast ? 'this ' + unit : 'in that ' + unit;
  out.push(['🆕', `${cur.opened.length} new trade${cur.opened.length === 1 ? '' : 's'} ${per}`, `${cur.oL} long and ${cur.oS} short${prev ? `, against ${prev.opened.length} in the previous ${unit}` : ''}. ${cur.carried} were already open when the ${unit} began.`]);
  if(cur.closed.length) out.push([cur.st.net >= 0 ? '✅' : '⚠️', `${cur.closed.length} closed, ${cur.st.w} won (${cur.st.wr.toFixed(0)}%)`, `Net ${fmtPct(cur.st.net, 1)}, ${fmtPct(cur.st.exp)} per trade. Best ${fmtPct(cur.st.best, 1)}, worst ${fmtPct(cur.st.worst, 1)}.`]);
  const cnt = {}; cur.opened.forEach(t => { cnt[t.sym] = (cnt[t.sym] || 0) + 1; });

  if(openNow.length){
    const L = openNow.filter(t => t.side > 0).length, pc = Math.round(L / openNow.length * 100);
    out.push(['🧭', `The open book is ${pc >= 60 ? 'long-heavy' : pc <= 40 ? 'short-heavy' : 'balanced'}`, `${pc}% of ${openNow.length} open trades are long. Average live P/L is ${fmtPct(uplAvg)}.`]);
  }
  const rank = STRATS.map(sy => ({ sy, s: stats(T.filter(t => t.sys === sy && tfSel().includes(t.tf))) })).filter(x => x.s.n >= 8).sort((a, b) => b.s.exp - a.s.exp);
  if(rank.length > 1) out.push(['🥇', `${SNAME[rank[0].sy]} has the best expectancy`, `${fmtPct(rank[0].s.exp)} per trade over ${rank[0].s.n} closed trades (${rank[0].s.wr.toFixed(0)}% win rate). ${SNAME[rank[rank.length - 1].sy]} is lowest at ${fmtPct(rank[rank.length - 1].s.exp)}.`]);
  const byTf = tfSel().map(tf => ({ tf, s: stats(F.filter(t => t.tf === tf)) })).filter(x => x.s.n >= 6).sort((a, b) => b.s.exp - a.s.exp);
  if(byTf.length > 1) out.push(['⏱️', `${TFNAME[byTf[0].tf]} works best in this view`, `${fmtPct(byTf[0].s.exp)} per trade, against ${fmtPct(byTf[byTf.length - 1].s.exp)} on ${TFNAME[byTf[byTf.length - 1].tf]}.`]);

}

/* ===================================================== render ===================================================== */
const NAV = [['over', 'Overview', '<path d="M3 12l9-8 9 8M5 10v10h5v-6h4v6h5V10"/>'], ['act', 'Activity', '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>'], ['strat', 'Strategies', '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/>'], ['coins', 'Coins', '<circle cx="9" cy="9" r="6"/><path d="M15.5 6.5a6 6 0 1 1-6 9"/>'], ['rz', 'Retrace', '<path d="M3 17l5-6 4 3 5-8 4 4"/><path d="M3 21h18"/>']];
function renderChrome(){
  $('fPeriod').innerHTML = [['day', 'D'], ['week', 'W'], ['month', 'M']].map(a => `<button class="${S.period === a[0] ? 'on' : ''}" data-p="${a[0]}" aria-label="${a[0]}">${a[1]}</button>`).join('');
  const opts = (list, cur) => list.map(a => `<option value="${a[0]}"${cur === a[0] ? ' selected' : ''}>${a[1]}</option>`).join('');
  $('fStrat').innerHTML = opts([['all', 'All strats']].concat(STRATS.map(sy => [sy, SMENU[sy]])), S.strat);
  $('fTf').innerHTML = opts([['all', SHOW_1H ? 'All TFs' : 'All TFs']].concat(SHOW_1H ? [['ex1h', 'All, no 1H']] : []).concat(TFS.map(t => [t, TFNAME[t]])), S.tf);
  $('nav').innerHTML = NAV.map(n => `<button class="${S.tab === n[0] ? 'on' : ''}" data-tab="${n[0]}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${n[2]}</svg>${n[1]}</button>`).join('');
}
function render(){
  renderChrome();
  const live = $('live');
  if(!MAIN){
    live.innerHTML = `<span class="pulse off"></span><span>${esc(loadErr || 'loading…')}</span>`;
    $('view').innerHTML = loadErr ? `<div class="card"><div class="empty">${esc(loadErr)}<br>Check your connection and tap refresh.</div></div>` : '<div class="skel"></div><div class="skel"></div><div class="skel"></div>';
    return;
  }
  const age = Math.max(0, Math.round((Date.now() - Date.parse(MAIN.updated)) / 60000));
  live.innerHTML = `<span class="pulse"></span><span>signals ${age < 90 ? age + 'm' : Math.round(age / 60) + 'h'} ago · live</span>`;
  const C = ctx(); VIEW = C;
  let h = '';
  if(LIMITED) h += `<div class="banner"><span>⏳</span><div><b>Limited history for now.</b> Showing the open trades and the recently closed ones kept in the alerts file. The full history (about 10 months of daily and 3 years of weekly candles) is saved by the alerts job and appears after its next run; this page then fills in by itself.</div></div>`;
  if(!T.length) h += '<div class="card"><div class="empty">No trades to show yet.</div></div>';
  else h += ({ over: viewOver, act: viewAct, strat: viewStrat, coins: viewCoins, rz: viewRz })[S.tab](C);
  $('view').innerHTML = h;
  const depth = HIST ? tfSel().map(tf => { const x = HIST.tfs && HIST.tfs[tf]; return x ? `${TFNAME[tf]} ${Math.round(x.historyDays)}d` : ''; }).filter(Boolean).join(' · ') : 'recent trades only';
  $('foot').innerHTML = `<b>How to read this.</b> Every trade is rebuilt from candle history by the alerts job (close to close, no fees, no funding), so figures are indicative and not live trading results. "Opened" means the entry candle closed inside the period, "already open" means it was entered earlier. History depth: ${esc(depth)}; the first ~80 candles of each are warm-up. Win rate alone says little for trend systems (30–45% is normal): read it with the payoff ratio and expectancy. Sample sizes under about 8 closed trades are noise. Retracement is a state, not a trade. This dashboard rebuilds itself whenever the alerts change.`;
}

/* ===================================================== share / export ===================================================== */
function summaryText(){
  if(!VIEW) return '';
  const C = VIEW, { cur, openNow, uplAvg } = C, lines = [`TradeSphere alerts: ${pTitle(cur.b, C.isLast)}`, `${S.strat === 'all' ? 'All strategies' : SNAME[S.strat]}, ${tfLabel()}`, '',
    `Opened ${cur.opened.length} (${cur.oL} long, ${cur.oS} short)`, `Closed ${cur.closed.length} (${cur.st.w} won, ${cur.st.l} lost${Number.isFinite(cur.st.wr) ? ', ' + cur.st.wr.toFixed(0) + '% win rate' : ''}), net ${cur.st.n ? fmtPct(cur.st.net, 1) : 'n/a'}`,
    `Open now ${openNow.length} (${cur.newOpen.length} new, ${cur.carried} already open), average live P/L ${fmtPct(uplAvg)}`, ''];
  headlines(C).forEach(i => lines.push(`${i[0]} ${i[1].replace(/&amp;/g, '&')}: ${i[2].replace(/&amp;/g, '&')}`));
  return lines.join('\n');
}
async function share(){
  const text = summaryText(); if(!text) return;
  try{ if(navigator.share){ await navigator.share({ title: 'TradeSphere alerts', text }); return; } }catch(e){ if(e && e.name === 'AbortError') return; }
  try{ await navigator.clipboard.writeText(text); toast('Summary copied'); }catch(e){ toast('Sharing is not available here'); }
}
function csv(){
  const F = filt(); if(!F.length){ toast('Nothing to export'); return; }
  const iso = ms => ms ? new Date(ms).toISOString() : '';
  const rows = [['timeframe', 'strategy', 'coin', 'side', 'entry_time', 'exit_time', 'status', 'result_pct', 'exit_reason', 'open_pl_pct'].join(',')];
  F.slice().sort((a, b) => b.eE - a.eE).forEach(t => rows.push([t.tf, SNAME[t.sys], t.sym, t.side > 0 ? 'long' : 'short', iso(t.eE), iso(t.eX), t.open ? 'open' : 'closed', t.pct == null ? '' : t.pct, t.open ? '' : (t.reason === 2 ? 'stop loss' : 'exit rule'), t.open && Number.isFinite(t.upl) ? t.upl.toFixed(2) : ''].join(',')));
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([rows.join('\n')], { type: 'text/csv' })); a.download = 'tradesphere-alerts-' + new Date().toISOString().slice(0, 10) + '.csv';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 3000); toast('CSV saved');
}

/* ===================================================== events ===================================================== */
const tt = $('tt');
function showTip(el, x, y){
  const lines = (el.getAttribute('data-tip') || '').split('\n'); if(!lines[0]) return;
  tt.innerHTML = '';
  const b = document.createElement('b'); b.textContent = lines[0]; tt.appendChild(b);
  tt.appendChild(document.createTextNode(lines.slice(1).join('\n')));
  tt.classList.add('on'); const r = tt.getBoundingClientRect(), px = Math.max(8, Math.min(innerWidth - r.width - 8, x - r.width / 2)), py = y - r.height - 14 < 8 ? y + 18 : y - r.height - 14;
  tt.style.left = px + 'px'; tt.style.top = py + 'px';
}
function hideTip(){ tt.classList.remove('on'); }
const coarse = () => window.matchMedia('(pointer:coarse)').matches;
document.addEventListener('pointermove', e => { if(e.pointerType === 'touch') return; const el = e.target.closest && e.target.closest('[data-tip]'); if(el) showTip(el, e.clientX, e.clientY); else hideTip(); });
document.addEventListener('scroll', hideTip, true);

document.addEventListener('click', e => {
  const t = e.target; let b;
  if((b = t.closest('[data-p]'))){ S.period = b.dataset.p; S.sel = null; persist(); render(); return; }
  if((b = t.closest('[data-tab]'))){ S.tab = b.dataset.tab; render(); window.scrollTo({ top: 0 }); return; }
  if((b = t.closest('[data-sc]'))){ S.scope = b.dataset.sc; render(); return; }
  if((b = t.closest('[data-rz]'))){ S.rzTf = b.dataset.rz; render(); return; }
  if(t.closest('#coinMore')){ S.coinAll = true; render(); return; }
  if(t.id === 'shade'){ closeSheet(); return; }
  const tipEl = t.closest('[data-tip]');
  if(tipEl && coarse()){ const r = tipEl.getBoundingClientRect(); showTip(tipEl, r.left + r.width / 2, r.top + 20); clearTimeout(showTip.t); showTip.t = setTimeout(hideTip, 2600); }
  const hit = t.closest('.hit[data-i]');
  if(hit){ S.sel = +hit.dataset.i; render(); return; }
  if((b = t.closest('[data-coin]'))){ openCoin(b.dataset.coin); return; }
});
document.addEventListener('change', e => {
  if(e.target.id === 'fStrat'){ S.strat = e.target.value; persist(); render(); }
  else if(e.target.id === 'fTf'){ S.tf = e.target.value; persist(); render(); }
  else if(e.target.id === 'coinSort'){ S.coinSort = e.target.value; render(); }
});
document.addEventListener('input', e => { if(e.target.id === 'coinQ'){ S.coinQ = e.target.value; const pos = e.target.selectionStart; render(); const el = $('coinQ'); if(el){ el.focus(); try{ el.setSelectionRange(pos, pos); }catch(err){} } } });
$('bBack').addEventListener('click', () => { if(S.sheet){ closeSheet(); return; } try{ if(PARENT){ PARENT.AlertsPanel.closeSummary(); return; } }catch(e){} history.back(); });
$('bShare').addEventListener('click', share);
$('bCsv').addEventListener('click', csv);
$('bRef').addEventListener('click', () => { toast('Refreshing…'); load(true); });
document.addEventListener('keydown', e => { if(e.key === 'Escape'){ if(S.sheet){ closeSheet(); return; } try{ if(PARENT) PARENT.AlertsPanel.closeSummary(); }catch(err){} } });

load();
setInterval(() => { if(!document.hidden) load(); }, 2 * 60 * 1000);                                   // new alerts, open and closed trades
setInterval(() => { const a = document.activeElement; if(!document.hidden && VIEW && !S.sheet && !(a && (a.id === 'coinQ' || a.tagName === 'SELECT'))){ refreshLive(); render(); } }, 20 * 1000);   // live prices
})();
</script>
</body>
</html>
