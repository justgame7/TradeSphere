<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alerts report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0C10; --panel:#12151B; --panel2:#171B22; --border:#232833; --soft:#1B1F28;
    --text:#E6E9EF; --muted:#8B93A3; --faint:#565F70;
    --accent:#35E0C0; --red:#ff5470; --amber:#f5a623; --blue:#5b8cff; --violet:#a78bfa;
    --ui:'Space Grotesk',sans-serif; --mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--ui);}
  body{min-height:100vh;background-image:radial-gradient(circle at 12% -4%,rgba(53,224,192,.08),transparent 38%),radial-gradient(circle at 96% 8%,rgba(167,139,250,.08),transparent 34%);}
  button{font-family:inherit;color:inherit;cursor:pointer;}
  .wrap{max-width:980px;margin:0 auto;padding:0 14px 70px;}

  /* header */
  .top{position:sticky;top:0;z-index:20;margin:0 -14px;padding:12px 14px 10px;background:rgba(10,12,16,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--soft);}
  .top-row{display:flex;align-items:center;gap:10px;}
  .ibtn{width:36px;height:36px;border-radius:11px;border:1px solid var(--border);background:var(--panel2);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;}
  .ibtn:hover{border-color:var(--accent);} .ibtn svg{width:16px;height:16px;}
  .ttl{flex:1;min-width:0;}
  .eyebrow{font:600 10px var(--mono);letter-spacing:.16em;color:var(--accent);text-transform:uppercase;}
  h1{margin:1px 0 0;font:700 19px var(--ui);letter-spacing:-.01em;}
  .status{margin:10px 0 0;font:500 10.5px var(--mono);color:var(--faint);display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);animation:pulse 2s infinite;}
  .dot.err{background:var(--red);box-shadow:none;animation:none;}
  @keyframes pulse{50%{opacity:.35}}
  .chips{display:flex;gap:6px;overflow-x:auto;padding:9px 0 2px;scrollbar-width:none;}
  .chips::-webkit-scrollbar{display:none;}
  .chip{flex-shrink:0;border:1px solid var(--border);background:var(--panel);border-radius:999px;padding:6px 12px;font:600 11px var(--mono);color:var(--muted);white-space:nowrap;}
  .chip.on{background:rgba(53,224,192,.14);border-color:rgba(53,224,192,.55);color:var(--accent);}
  .chip.nav{background:transparent;}
  .lbl{font:600 9.5px var(--mono);letter-spacing:.12em;color:var(--faint);text-transform:uppercase;padding:9px 2px 0;}

  /* cards */
  section{margin-top:16px;scroll-margin-top:70px;}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:14px;}
  .card + .card{margin-top:10px;}
  .h{display:flex;align-items:baseline;gap:8px;margin:0 0 3px;}
  .h b{font:700 15px var(--ui);} .h i{font:500 10.5px var(--mono);color:var(--faint);font-style:normal;}
  .sub{font:500 11px var(--mono);color:var(--muted);line-height:1.55;margin:0 0 10px;}
  .grid{display:grid;gap:10px;}
  .g2{grid-template-columns:repeat(2,1fr);} .g3{grid-template-columns:repeat(3,1fr);}
  @media(min-width:760px){.g3d{grid-template-columns:repeat(3,1fr);} .g2d{grid-template-columns:repeat(2,1fr);} .g4d{grid-template-columns:repeat(4,1fr);}}

  /* KPI */
  .kpi{background:var(--panel2);border:1px solid var(--soft);border-radius:14px;padding:11px 12px;min-width:0;}
  .kpi .k{font:600 9.5px var(--mono);letter-spacing:.1em;color:var(--faint);text-transform:uppercase;}
  .kpi .v{font:700 22px var(--mono);margin-top:3px;letter-spacing:-.02em;}
  .kpi .d{font:500 10.5px var(--mono);color:var(--muted);margin-top:3px;line-height:1.4;}
  .pos{color:var(--accent);} .neg{color:var(--red);} .mut{color:var(--muted);} .amb{color:var(--amber);}
  .up{color:var(--accent);} .dn{color:var(--red);}

  /* charts */
  svg.ch{width:100%;height:auto;display:block;overflow:visible;}
  .ch text{font-family:'JetBrains Mono',monospace;font-size:9px;fill:#6f7889;}
  .ch .hit{fill:transparent;cursor:pointer;}
  .legend{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:8px;font:500 10px var(--mono);color:var(--muted);}
  .legend s{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px;text-decoration:none;}
  .tip{font:500 11px var(--mono);color:var(--muted);margin-top:8px;line-height:1.5;}
  .tip b{color:var(--text);}

  /* bars/rows */
  .row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--soft);}
  .row:first-child{border-top:none;}
  .grow{flex:1;min-width:0;}
  .nm{font:700 13px var(--ui);} .nm small{font:500 10.5px var(--mono);color:var(--faint);margin-left:6px;}
  .mono{font-family:var(--mono);} .r{text-align:right;}
  .bar{height:8px;border-radius:5px;background:var(--panel2);overflow:hidden;display:flex;}
  .bar>i{display:block;height:100%;}
  .pill{display:inline-block;font:700 9.5px var(--mono);letter-spacing:.06em;padding:2px 7px;border-radius:7px;text-transform:uppercase;}
  .pill.l{color:var(--accent);background:rgba(53,224,192,.14);} .pill.s{color:var(--red);background:rgba(255,84,112,.14);}
  .pill.n{color:var(--muted);background:var(--panel2);border:1px solid var(--border);}
  .pill.a{color:var(--amber);background:rgba(245,166,35,.14);} .pill.b{color:var(--blue);background:rgba(91,140,255,.16);} .pill.v{color:var(--violet);background:rgba(167,139,250,.16);}
  .stat{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px;}
  .stat div{background:var(--panel2);border-radius:10px;padding:8px 9px;border:1px solid var(--soft);}
  .stat span{display:block;font:600 8.5px var(--mono);color:var(--faint);letter-spacing:.09em;text-transform:uppercase;}
  .stat b{display:block;font:700 13px var(--mono);margin-top:2px;}
  @media(max-width:420px){.stat{gap:6px;}.stat div{padding:7px 6px;}.stat b{font-size:12px;}.stat span{font-size:8px;letter-spacing:.05em;}}

  /* heatmap */
  table.hm{width:100%;border-collapse:separate;border-spacing:4px;font:600 11px var(--mono);}
  table.hm th{font:600 9.5px var(--mono);color:var(--faint);text-transform:uppercase;letter-spacing:.08em;text-align:center;padding:2px;}
  table.hm th:first-child{text-align:left;}
  table.hm td{border-radius:9px;text-align:center;padding:9px 3px;background:var(--panel2);}
  table.hm td small{display:block;font:500 9px var(--mono);opacity:.75;margin-top:2px;}
  table.hm td.lb{text-align:left;background:none;padding-left:0;font:700 12px var(--ui);}

  /* coin table */
  .coin{display:grid;grid-template-columns:minmax(64px,1fr) auto auto auto;gap:6px 10px;align-items:center;padding:10px 0;border-top:1px solid var(--soft);cursor:pointer;}
  .coin:first-of-type{border-top:none;}
  .coin:hover .nm{color:var(--accent);}
  .coin .c2{font:500 10.5px var(--mono);color:var(--muted);}
  .coin .num{font:700 12px var(--mono);text-align:right;min-width:52px;}
  .dots{display:flex;gap:3px;flex-wrap:wrap;margin-top:3px;}
  .dots i{width:9px;height:9px;border-radius:3px;display:block;}
  .search{width:100%;background:var(--panel2);border:1px solid var(--border);border-radius:11px;padding:9px 12px;color:var(--text);font:500 12px var(--mono);margin-bottom:8px;}
  .search:focus{outline:none;border-color:var(--accent);}
  .more{width:100%;margin-top:8px;background:var(--panel2);border:1px solid var(--border);border-radius:11px;padding:9px;font:600 11px var(--mono);color:var(--muted);}

  /* radar */
  .rz{border:1px solid var(--border);border-radius:14px;padding:11px;background:var(--panel2);}
  .rz.grey{opacity:.5;}
  .rz .big{font:700 24px var(--mono);}
  .tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;}
  .tag{font:700 10.5px var(--mono);padding:4px 8px;border-radius:8px;background:var(--panel);border:1px solid var(--border);cursor:pointer;}
  .tag.good{border-color:rgba(53,224,192,.6);color:var(--accent);} .tag.bad{border-color:rgba(245,166,35,.55);color:var(--amber);}
  .tag small{font-weight:500;opacity:.8;margin-left:4px;}

  /* insights */
  .ins{display:flex;gap:11px;padding:11px 0;border-top:1px solid var(--soft);}
  .ins:first-child{border-top:none;}
  .ins .ic{font-size:20px;line-height:1.1;flex-shrink:0;width:26px;text-align:center;}
  .ins b{display:block;font:700 13px var(--ui);} .ins span{display:block;font:500 11.5px var(--mono);color:var(--muted);line-height:1.55;margin-top:2px;}
  .note{font:500 10.5px var(--mono);color:var(--faint);line-height:1.6;margin-top:16px;padding:12px;border:1px dashed var(--border);border-radius:14px;}
  .empty{padding:26px 10px;text-align:center;font:500 12px var(--mono);color:var(--faint);}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--border);padding:9px 14px;border-radius:11px;font:600 11.5px var(--mono);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s;}
  .toast.on{opacity:1;}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="top-row">
      <button class="ibtn" id="bBack" title="Back to alerts" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
      <div class="ttl"><div class="eyebrow">Alerts report</div><h1 id="hTitle">Summary</h1></div>
      <button class="ibtn" id="bShare" title="Share summary" aria-label="Share summary"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 10.5l6.8-4M8.6 13.5l6.8 4"/></svg></button>
      <button class="ibtn" id="bCsv" title="Export trades as CSV" aria-label="Export CSV"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M4 20h16"/></svg></button>
      <button class="ibtn" id="bRef" title="Refresh" aria-label="Refresh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.5 9a9 9 0 0 1 14.9-3.4L23 10M1 14l4.6 4.4A9 9 0 0 0 20.5 15"/></svg></button>
    </div>
  </header>
  <div class="status" id="status"><span class="dot err"></span><span>Loading…</span></div>
  <div class="chips" id="fPeriod"></div>
  <div class="chips" id="fStrat"></div>
  <div class="chips" id="fTf"></div>
  <div class="chips" id="fNav"></div>
  <main id="main"><div class="empty">Loading the report…</div></main>
  <div class="note" id="foot"></div>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';
const DAY = 864e5, HOUR = 36e5;
const lsGet = k => { try{ return localStorage.getItem(k); }catch(e){ return null; } };
const lsSet = (k, v) => { try{ localStorage.setItem(k, v); }catch(e){} };
const $ = id => document.getElementById(id);
const esc = v => String(v).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
let PARENT = null; try{ if(window.parent && window.parent !== window && window.parent.AlertsPanel) PARENT = window.parent; }catch(e){}

const DATA_URL = lsGet('ts-alerts-data-url') || 'https://raw.githubusercontent.com/justgame7/TradeSphere/main/data/donchian-alerts.json';
const HIST_URL = lsGet('ts-alerts-history-url') || DATA_URL.replace(/[^/]*$/, 'alerts-history.json');
const SHOW_1H = lsGet('crypto-screener-alerts-1h') === 'true';
const STRATS = ['20/10', '55/20', 'Ichimoku'];
const SNAME = { '20/10': 'Donchian 20/10', '55/20': 'Donchian 55/20', 'Ichimoku': 'Ichimoku' };
const SCOL = { '20/10': '#35E0C0', '55/20': '#5b8cff', 'Ichimoku': '#a78bfa' };
const TFS = SHOW_1H ? ['1H', '4H', '1D', '1W'] : ['4H', '1D', '1W'];
const TFNAME = { '1H': '1H', '4H': '4H', '1D': 'Daily', '1W': 'Weekly' };
const COL = { long:'#35E0C0', short:'#ff5470', win:'#35E0C0', loss:'#ff5470', blue:'#5b8cff', amber:'#f5a623', violet:'#a78bfa', grey:'#3a4252' };

const saved = (() => { try{ return JSON.parse(lsGet('ts-alerts-summary-v1') || '{}') || {}; }catch(e){ return {}; } })();
const S = { period: ['day', 'week', 'month'].includes(saved.period) ? saved.period : 'week', strat: saved.strat || 'all', tf: saved.tf || 'all', sel: null, coinSort: 'activity', coinAll: false, coinQ: '', scope: 'period' };
// Timeframe filter: 'all', 'ex1h' (everything except 1H, the default when 1H alerts are switched on) or one timeframe.
if(S.tf === 'all' && !saved.tf && SHOW_1H) S.tf = 'ex1h';
if(S.tf !== 'all' && S.tf !== 'ex1h' && !TFS.includes(S.tf)) S.tf = SHOW_1H ? 'ex1h' : 'all';
if(S.tf === 'ex1h' && !SHOW_1H) S.tf = 'all';
const tfSel = () => S.tf === 'all' ? TFS : S.tf === 'ex1h' ? TFS.filter(t => t !== '1H') : [S.tf];
const tfLabel = () => S.tf === 'all' ? 'all timeframes' : S.tf === 'ex1h' ? 'all except 1H' : TFNAME[S.tf];
const persist = () => lsSet('ts-alerts-summary-v1', JSON.stringify({ period: S.period, strat: S.strat, tf: S.tf }));

let LIMITED = false;
let MAIN = null, HIST = null, T = [], loadErr = '', lastLoad = 0;
const fmtPct = (v, d = 2) => Number.isFinite(v) ? (v >= 0 ? '+' : '') + v.toFixed(d) + '%' : '—';
const cls = v => Number.isFinite(v) ? (v >= 0 ? 'pos' : 'neg') : 'mut';
const fmtPx = v => { if(!Number.isFinite(v)) return '—'; const a = Math.abs(v); return a >= 1000 ? v.toLocaleString(undefined, { maximumFractionDigits: 1 }) : a >= 1 ? v.toFixed(2) : a >= 0.01 ? v.toPrecision(4) : v.toPrecision(3); };
const dur = ms => { const d = ms / DAY; return d >= 1 ? d.toFixed(d >= 10 ? 0 : 1) + 'd' : Math.max(1, Math.round(ms / HOUR)) + 'h'; };
const toast = msg => { const t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 2200); };

/* ---------------- data ---------------- */
async function getJSON(url){
  const r = await fetch(url + (url.includes('?') ? '&' : '?') + 't=' + Math.floor(Date.now() / 60000), { cache: 'no-store' });
  if(!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}
async function load(){
  try{
    const [m, h] = await Promise.all([getJSON(DATA_URL), getJSON(HIST_URL).catch(() => null)]);
    MAIN = m; HIST = h; loadErr = h ? '' : 'The trade history file is not available yet. It is created by the next alerts job run.';
  }catch(e){ loadErr = 'Could not load the alerts (' + e.message + ').'; }
  lastLoad = Date.now();
  build(); render();
}
const lastClose = {};
function livePx(sym){
  let v = NaN;
  try{ if(PARENT) v = PARENT.AlertsPanel.livePx(sym); }catch(e){}
  return Number.isFinite(v) ? v : lastClose[sym];
}
function build(){
  T = [];
  Object.keys(lastClose).forEach(k => delete lastClose[k]);
  if(MAIN) TFS.forEach(tf => { const d = (MAIN.timeframes || {})[tf]; if(d) (d.trades || []).forEach(t => { if(Number.isFinite(t.lastClose)) lastClose[t.symbol] = t.lastClose; }); });
  LIMITED = !HIST;
  if(!HIST){
    // The history file is saved by the next alerts job run. Until then use what the alerts file keeps: every open trade and the recent closed ones.
    const PER = { '1H': HOUR, '4H': 4 * HOUR, '1D': DAY, '1W': 7 * DAY };
    TFS.forEach(tf => { const d = (MAIN.timeframes || {})[tf]; if(!d) return; const per = PER[tf];
      (d.trades || []).forEach(t => T.push({ tf, per, sys: t.system || '20/10', sym: t.symbol, side: t.side === 'long' ? 1 : -1, eE: t.entryTime + per, eX: t.exitTime ? t.exitTime + per : 0, pct: t.status === 'closed' ? t.resultPct : null, reason: t.exitReason === 'stop' ? 2 : 1, ep: t.status === 'open' ? t.entryClose : null, open: t.status === 'open' })); });
    refreshLive(); return;
  }
  TFS.forEach(tf => {
    const h = HIST.tfs && HIST.tfs[tf]; if(!h) return;
    h.trades.forEach(a => {
      const per = h.periodMs;
      T.push({ tf, per, sys: a[0], sym: a[1], side: a[2], eE: a[3] + per, eX: a[4] ? a[4] + per : 0, pct: a[5], reason: a[6], ep: a[7], open: !a[4] });
    });
  });
  refreshLive();
}
function refreshLive(){
  T.forEach(t => {
    if(!t.open) return;
    const px = livePx(t.sym); t.px = px;
    t.upl = Number.isFinite(px) && t.ep ? t.side * (px - t.ep) / t.ep * 100 : null;
  });
}

/* ---------------- filters, buckets, stats ---------------- */
const filt = () => T.filter(t => (S.strat === 'all' || t.sys === S.strat) && tfSel().includes(t.tf));
const covStart = () => {
  const KEEP = { '1H': DAY, '4H': 2 * DAY, '1D': 7 * DAY, '1W': 28 * DAY };
  const tfs = tfSel(); let s = 0;
  if(!HIST){ tfs.forEach(tf => { s = Math.max(s, Date.now() - KEEP[tf]); }); return s; }
  tfs.forEach(tf => { const h = HIST.tfs && HIST.tfs[tf]; if(!h) return; s = Math.max(s, Date.now() - h.historyDays * DAY + 80 * h.periodMs); });
  return s;
};
function buckets(){
  const now = new Date(), out = [], n = S.period === 'day' ? 30 : 12;
  const mk = i => {
    let s, e, label;
    if(S.period === 'day'){ s = new Date(now.getFullYear(), now.getMonth(), now.getDate() - i); e = new Date(s.getFullYear(), s.getMonth(), s.getDate() + 1); label = s.toLocaleDateString(undefined, { day: 'numeric', month: 'short' }); }
    else if(S.period === 'week'){ const dow = (now.getDay() + 6) % 7; s = new Date(now.getFullYear(), now.getMonth(), now.getDate() - dow - 7 * i); e = new Date(s.getFullYear(), s.getMonth(), s.getDate() + 7); label = s.toLocaleDateString(undefined, { day: 'numeric', month: 'short' }); }
    else { s = new Date(now.getFullYear(), now.getMonth() - i, 1); e = new Date(s.getFullYear(), s.getMonth() + 1, 1); label = s.toLocaleDateString(undefined, { month: 'short' }) + (s.getMonth() === 0 || i === n - 1 ? " '" + String(s.getFullYear()).slice(2) : ''); }
    return { s: +s, e: +e, label };
  };
  for(let i = n - 1; i >= 0; i--) out.push(mk(i));
  return out;
}
function stats(list){
  const c = list.filter(t => !t.open && Number.isFinite(t.pct));
  const w = c.filter(t => t.pct > 0), l = c.filter(t => t.pct <= 0);
  const sw = w.reduce((a, t) => a + t.pct, 0), sl = l.reduce((a, t) => a + t.pct, 0), net = sw + sl;
  return { n: c.length, w: w.length, l: l.length, wr: c.length ? w.length / c.length * 100 : NaN, avgW: w.length ? sw / w.length : NaN, avgL: l.length ? sl / l.length : NaN,
    exp: c.length ? net / c.length : NaN, pf: sl < 0 ? sw / Math.abs(sl) : (sw > 0 ? Infinity : NaN), net, best: c.length ? Math.max(...c.map(t => t.pct)) : NaN, worst: c.length ? Math.min(...c.map(t => t.pct)) : NaN,
    hold: c.length ? c.reduce((a, t) => a + (t.eX - t.eE), 0) / c.length : NaN };
}
function bucketStats(F, B){
  return B.map(b => {
    const opened = F.filter(t => t.eE >= b.s && t.eE < b.e), closed = F.filter(t => t.eX && t.eX >= b.s && t.eX < b.e);
    const openEnd = F.filter(t => t.eE < b.e && (!t.eX || t.eX >= b.e)), openStart = F.filter(t => t.eE < b.s && (!t.eX || t.eX >= b.s));
    const newOpen = openEnd.filter(t => t.eE >= b.s);
    return { b, opened, closed, openEnd, openStart, newOpen, carried: openEnd.length - newOpen.length, st: stats(closed),
      oL: opened.filter(t => t.side > 0).length, oS: opened.filter(t => t.side < 0).length };
  });
}

/* ---------------- SVG charts ---------------- */
let W = 360;
const PL = 28, PR = 6, PT = 8, PB = 22;
function axisX(BS, selIdx, H){
  const n = BS.length, bw = (W - PL - PR) / n, step = Math.ceil(n / 6);
  let s = '';

/* ---------------- retracement radar ---------------- */
function rzZone(r, px){
  if(!Number.isFinite(px) || px <= 0) return null;

}
function radar(){
  const out = {};
  TFS.forEach(tf => {
    const list = ((((MAIN || {}).timeframes || {})[tf] || {}).retrace) || [], rows = [];
    list.forEach(r => {
      const px = livePx(r.symbol) || r.lastClose, z = rzZone(r, px); if(!z) return;
      const open = tf === '1H' ? [] : T.filter(t => t.open && t.sym === r.symbol);
      const alg = open.filter(t => (t.side > 0 && r.dir === 'bullish') || (t.side < 0 && r.dir === 'bearish')).length;
      rows.push({ r, z, open: open.length, aligned: alg, against: open.length - alg });
    });
    rows.sort((a, b) => (b.aligned - a.aligned) || (a.z.near - b.z.near));

}

    <table class="hm"><thead><tr><th></th>${tfSel().map(tf => `<th>${TFNAME[tf]}</th>`).join('')}</tr></thead><tbody>${heat}</tbody></table></div>`;
  // breadth
  const lean = STRATS.filter(sy => S.strat === 'all' || S.strat === sy).map(sy => tfSel().map(tf => {
    const o = T.filter(t => t.open && t.sys === sy && t.tf === tf), L = o.filter(t => t.side > 0).length, Sh = o.length - L, tot = Math.max(1, L + Sh);
    return `<div class="row"><span class="nm" style="min-width:104px;color:${SCOL[sy]}">${esc(SNAME[sy].replace('Donchian ', 'D '))}<small>${TFNAME[tf]}</small></span><div class="grow"><div class="bar"><i style="width:${L / tot * 100}%;background:${COL.long}"></i><i style="width:${Sh / tot * 100}%;background:${COL.short}"></i></div></div><span class="mono" style="font-size:11px;min-width:64px;text-align:right"><span class="pos">${L}</span> / <span class="neg">${Sh}</span></span></div>`; }).join('')).join('');
  h += `<div class="card"><div class="h"><b>Market lean</b><i>open trades, long / short</i></div><p class="sub">Which way the top 50 coins are leaning on every strategy and timeframe right now.</p>${lean || '<div class="empty">No open trades.</div>'}</div>`;
  // distribution
  const best = F.filter(t => !t.open).sort((a, b) => b.pct - a.pct).slice(0, 3), worst = F.filter(t => !t.open).sort((a, b) => a.pct - b.pct).slice(0, 3);
  let mw = 0, ml = 0, rw = 0, rl = 0; F.filter(t => !t.open).sort((a, b) => a.eX - b.eX).forEach(t => { if(t.pct > 0){ rw++; rl = 0; } else { rl++; rw = 0; } mw = Math.max(mw, rw); ml = Math.max(ml, rl); });
  const tr = t => `<div class="row"><span class="nm">${esc(t.sym)}<small>${esc(SNAME[t.sys].replace('Donchian ', 'D '))} · ${TFNAME[t.tf]}</small></span><span class="grow"></span><span class="pill ${t.side > 0 ? 'l' : 's'}">${t.side > 0 ? 'long' : 'short'}</span><b class="mono ${cls(t.pct)}">${fmtPct(t.pct, 1)}</b></div>`;
  h += `<div class="card"><div class="h"><b>Result distribution</b><i>all closed trades in the filter</i></div><p class="sub">How the closed trades spread. Trend strategies have many small losses and a few big wins.</p>${histogram(F)}
    <div class="stat"><div><span>Closed</span><b>${hAll.n}</b></div><div><span>Win streak</span><b class="pos">${mw}</b></div><div><span>Loss streak</span><b class="neg">${ml}</b></div><div><span>Avg hold</span><b>${Number.isFinite(hAll.hold) ? dur(hAll.hold) : '—'}</b></div></div>
    <div class="grid g2d" style="margin-top:12px"><div><div class="lbl" style="padding-top:0">Best closed</div>${best.map(tr).join('') || '<div class="empty">—</div>'}</div><div><div class="lbl" style="padding-top:0">Worst closed</div>${worst.map(tr).join('') || '<div class="empty">—</div>'}</div></div></div></section>`;

  /* ---- coins ---- */
  const coins = {};
  F.forEach(t => { const c = coins[t.sym] || (coins[t.sym] = { sym: t.sym, open: [], closed: [], opened: 0, closedP: 0 }); if(t.open) c.open.push(t); else c.closed.push(t); });
  cur.opened.forEach(t => { if(coins[t.sym]) coins[t.sym].opened++; });
  cur.closed.forEach(t => { if(coins[t.sym]) coins[t.sym].closedP++; });
  let list = Object.values(coins).map(c => { const s2 = stats(c.closed), u = c.open.filter(t => Number.isFinite(t.upl)); return { ...c, s2, upl: u.length ? u.reduce((a, t) => a + t.upl, 0) / u.length : NaN, L: c.open.filter(t => t.side > 0).length, Sh: c.open.filter(t => t.side < 0).length, act: c.opened + c.closedP }; });
  const q = S.coinQ.trim().toUpperCase(); if(q) list = list.filter(c => c.sym.includes(q));
  const sorters = { activity: (a, b) => b.act - a.act || b.open.length - a.open.length, net: (a, b) => (b.s2.net || -1e9) - (a.s2.net || -1e9), win: (a, b) => (Number.isFinite(b.s2.wr) ? b.s2.wr : -1) - (Number.isFinite(a.s2.wr) ? a.s2.wr : -1), upl: (a, b) => (Number.isFinite(b.upl) ? b.upl : -1e9) - (Number.isFinite(a.upl) ? a.upl : -1e9), open: (a, b) => b.open.length - a.open.length || b.act - a.act, az: (a, b) => a.sym.localeCompare(b.sym) };
  list.sort(sorters[S.coinSort] || sorters.activity);
  const shown = S.coinAll || q ? list : list.slice(0, 12);
  const dotsOf = c => c.open.length ? `<div class="dots">${c.open.slice().sort((a, b) => a.tf.localeCompare(b.tf)).map(t => `<i title="${esc(SNAME[t.sys])} ${t.tf} ${t.side > 0 ? 'long' : 'short'}" style="background:${t.side > 0 ? COL.long : COL.short};opacity:${t.tf === '1W' ? 1 : t.tf === '1D' ? .78 : .55}"></i>`).join('')}</div>` : '';
  h += `<section id="sCoin"><div class="card"><div class="h"><b>Coin analysis</b><i>${list.length} coins</i></div>
    <p class="sub">Each square is an open trade (green long, red short; brighter means a slower timeframe). Right side: win rate and net result of its closed trades (whole history), then the average live P/L of its open trades. Tap a coin to open all its alerts.</p>
    <input class="search" id="coinQ" placeholder="Search a coin…" value="${esc(S.coinQ)}">
    <div class="chips" style="padding:0 0 6px">${[['activity', 'Most active'], ['net', 'Best net'], ['win', 'Win rate'], ['upl', 'Open P/L'], ['open', 'Open trades'], ['az', 'A–Z']].map(a => `<button class="chip${S.coinSort === a[0] ? ' on' : ''}" data-cs="${a[0]}">${a[1]}</button>`).join('')}</div>
    <div id="coinList">${shown.map(c => `<div class="coin" data-sym="${esc(c.sym)}"><div><div class="nm">${esc(c.sym)}<small>${c.L ? `<span class="pos">${c.L}L</span>` : ''}${c.L && c.Sh ? ' ' : ''}${c.Sh ? `<span class="neg">${c.Sh}S</span>` : ''}${!c.open.length ? 'flat' : ''}</small></div>${dotsOf(c)}</div>
      <div class="c2 r">new <b>${c.opened}</b><br>closed <b>${c.closedP}</b></div><div class="c2 r">win<br><b class="mono">${Number.isFinite(c.s2.wr) ? c.s2.wr.toFixed(0) + '%' : '—'}</b></div><div><div class="num ${cls(c.s2.net)}">${c.s2.n ? fmtPct(c.s2.net, 0) : '—'}</div><div class="c2 r">open <span class="${cls(c.upl)}">${Number.isFinite(c.upl) ? fmtPct(c.upl, 1) : '—'}</span></div></div></div>`).join('') || '<div class="empty">No coin matches.</div>'}</div>
    ${!S.coinAll && !q && list.length > 12 ? `<button class="more" id="coinMore">Show all ${list.length} coins</button>` : ''}</div>`;
  // confluence
  const conf = Object.values(coins).map(c => ({ sym: c.sym, L: c.L ?? c.open.filter(t => t.side > 0).length, Sh: c.Sh ?? c.open.filter(t => t.side < 0).length })).map(c => ({ ...c, net: c.L - c.Sh }));
  const topL = conf.filter(c => c.L && !c.Sh).sort((a, b) => b.L - a.L).slice(0, 6), topS = conf.filter(c => c.Sh && !c.L).sort((a, b) => b.Sh - a.Sh).slice(0, 6), mixed = conf.filter(c => c.L && c.Sh).sort((a, b) => (b.L + b.Sh) - (a.L + a.Sh)).slice(0, 8);
  const tg = (c, k) => `<span class="tag ${k === 'l' ? 'good' : k === 's' ? 'bad' : ''}" data-sym="${esc(c.sym)}">${esc(c.sym)}<small>${k === 'l' ? c.L + ' long' : k === 's' ? c.Sh + ' short' : c.L + 'L ' + c.Sh + 'S'}</small></span>`;
  h += `<div class="card"><div class="h"><b>Confluence</b><i>how many open trades agree</i></div><p class="sub">Coins where several strategies and timeframes point the same way are the strongest. Mixed coins have long and short trades open at once (usually a fast timeframe against a slow one).</p>
    <div class="lbl" style="padding-top:0">Strongest longs</div><div class="tags">${topL.map(c => tg(c, 'l')).join('') || '<span class="mut mono" style="font-size:11px">none</span>'}</div>
    <div class="lbl">Strongest shorts</div><div class="tags">${topS.map(c => tg(c, 's')).join('') || '<span class="mut mono" style="font-size:11px">none</span>'}</div>
    <div class="lbl">Mixed signals</div><div class="tags">${mixed.map(c => tg(c, 'm')).join('') || '<span class="mut mono" style="font-size:11px">none</span>'}</div></div></section>`;

  /* ---- retracement ---- */
  const RZ = radar(); VIEW.RZ = RZ;
  h += `<section id="sRz"><div class="card"><div class="h"><b>Retracement radar</b><i>reference, not a strategy</i></div>
    <p class="sub">Coins whose live price is within 1% of the 50% or 61.8% level of their latest swing (leg at least 3 × ATR). Green: an open trade that fits the zone (a long pulling back into support or a short bouncing into resistance), a possible add or entry. Amber: the zone is against an open trade.</p>
    <div class="grid g2 g3d">${TFS.map(tf => {
      const rows = RZ[tf] || [], up = rows.filter(x => x.r.dir === 'bullish').length, dn = rows.length - up, al = rows.filter(x => x.aligned).length;
      return `<div class="rz${tf === '1H' ? ' grey' : ''}"><div class="mut mono" style="font-size:10px;letter-spacing:.1em">${TFNAME[tf].toUpperCase()}${tf === '1H' ? ' · REFERENCE' : ''}</div><div class="big">${rows.length}<span class="mut" style="font-size:12px"> in zone</span></div>
        <div class="mono" style="font-size:10.5px;color:var(--muted)"><span class="pos">▲ ${up} up-leg</span> · <span class="neg">▼ ${dn} down-leg</span>${tf === '1H' ? '' : `<br><span class="${al ? 'pos' : 'mut'}">${al} fit an open trade</span>`}</div>
        <div class="tags">${rows.slice(0, 14).map(x => `<span class="tag ${x.aligned ? 'good' : x.against ? 'bad' : ''}" data-sym="${esc(x.r.symbol)}">${esc(x.r.symbol)}<small>${x.r.dir === 'bullish' ? '▲' : '▼'} ${esc(x.z.tag)}</small></span>`).join('') || '<span class="mut mono" style="font-size:11px">none</span>'}${rows.length > 14 ? `<span class="mut mono" style="font-size:11px;padding:4px">+${rows.length - 14}</span>` : ''}</div></div>`; }).join('')}</div></div></section>`;

  /* ---- insights ---- */
  const ins = insights(VIEW, cs);
  VIEW.ins = ins;
  h += `<section id="sIns"><div class="card"><div class="h"><b>Insights</b><i>written from the numbers above</i></div>${ins.map(i => `<div class="ins"><div class="ic">${i[0]}</div><div><b>${i[1]}</b><span>${i[2]}</span></div></div>`).join('')}</div></section>`;

  $('main').innerHTML = h;
  const depth = !HIST ? 'recent trades only' : tfSel().map(tf => { const x = HIST.tfs[tf]; return x ? `${TFNAME[tf]} ${Math.round(x.historyDays)}d` : ''; }).filter(Boolean).join(' · ');
  $('foot').innerHTML = `<b>How to read this.</b> Every trade is recomputed from candle history by the alerts job (close-to-close, no fees, no funding), so results are indicative, not live trading results. History depth: ${depth}; the first ~80 candles of each are warm-up, so earlier periods are faded. "New" means the trade's entry candle closed inside the period, "already open" means it was entered before the period started. Retracement is a state, not a trade, so it has no history. This report rebuilds itself whenever the alerts file changes.`;
}

function insights(V, cs){
  const { F, cur, prev, openNow, uplAvg, hAll, BS, RZ } = V, out = [], unit = S.period;
  const isLast = V.sel === BS.length - 1, per = isLast ? 'this ' + unit : 'in that ' + unit;
  out.push(['🆕', `${cur.opened.length} new trade${cur.opened.length === 1 ? '' : 's'} ${per}`, `${cur.oL} long and ${cur.oS} short${prev ? `, against ${prev.opened.length} in the previous ${unit}` : ''}. ${cur.carried} trades were already open when the ${unit} began.`]);
  if(cur.closed.length) out.push([cur.st.net >= 0 ? '✅' : '⚠️', `${cur.closed.length} closed, ${cur.st.w} won (${cur.st.wr.toFixed(0)}%)`, `Net ${fmtPct(cur.st.net, 1)}, average ${fmtPct(cur.st.exp)} per trade${Number.isFinite(cur.st.best) ? `, best ${fmtPct(cur.st.best, 1)}, worst ${fmtPct(cur.st.worst, 1)}` : ''}.`]);
  const cnt = {}; cur.opened.forEach(t => { cnt[t.sym] = (cnt[t.sym] || 0) + 1; });
  const busy = Object.entries(cnt).sort((a, b) => b[1] - a[1])[0]; if(busy && busy[1] > 1) out.push(['🔥', `${busy[0]} was the busiest coin`, `${busy[1]} new trades across the strategies and timeframes ${per}.`]);
  if(openNow.length){
    const L = openNow.filter(t => t.side > 0).length, pc = Math.round(L / openNow.length * 100);
    out.push(['🧭', `The open book is ${pc >= 60 ? 'long-heavy' : pc <= 40 ? 'short-heavy' : 'balanced'}`, `${pc}% of ${openNow.length} open trades are long. Average live P/L is ${fmtPct(uplAvg)}.`]);
    const wl = openNow.filter(t => Number.isFinite(t.upl)).sort((a, b) => b.upl - a.upl);
    if(wl.length > 1) out.push(['🏆', `Open winner: ${wl[0].sym} ${fmtPct(wl[0].upl, 1)}`, `${SNAME[wl[0].sys]} ${wl[0].side > 0 ? 'long' : 'short'} on ${TFNAME[wl[0].tf]}. The weakest open trade is ${wl[wl.length - 1].sym} at ${fmtPct(wl[wl.length - 1].upl, 1)} (${SNAME[wl[wl.length - 1].sys]} ${TFNAME[wl[wl.length - 1].tf]}).`]);
    const old = openNow.slice().sort((a, b) => a.eE - b.eE)[0]; if(old && cs && old.eE > cs) out.push(['⏳', `Longest open: ${old.sym}`, `${SNAME[old.sys]} ${old.side > 0 ? 'long' : 'short'} on ${TFNAME[old.tf]}, open for ${dur(Date.now() - old.eE)}.`]);
  }
  const rank = STRATS.map(sy => ({ sy, s: stats(T.filter(t => t.sys === sy && tfSel().includes(t.tf))) })).filter(x => x.s.n >= 8).sort((a, b) => b.s.exp - a.s.exp);
  if(rank.length > 1) out.push(['🥇', `${SNAME[rank[0].sy]} has the best expectancy`, `${fmtPct(rank[0].s.exp)} per trade over ${rank[0].s.n} closed trades (${rank[0].s.wr.toFixed(0)}% win rate). ${SNAME[rank[rank.length - 1].sy]} is lowest at ${fmtPct(rank[rank.length - 1].s.exp)}.`]);
  const byTf = tfSel().map(tf => ({ tf, s: stats(F.filter(t => t.tf === tf)) })).filter(x => x.s.n >= 6).sort((a, b) => b.s.exp - a.s.exp);
  if(byTf.length > 1) out.push(['⏱️', `${TFNAME[byTf[0].tf]} works best here`, `${fmtPct(byTf[0].s.exp)} per trade, versus ${fmtPct(byTf[byTf.length - 1].s.exp)} on ${TFNAME[byTf[byTf.length - 1].tf]} (current filter).`]);
  const al = []; TFS.forEach(tf => { if(tf !== '1H') ((RZ && RZ[tf]) || []).filter(x => x.aligned).forEach(x => al.push(x.r.symbol + ' ' + TFNAME[tf])); });
  out.push(['🎯', al.length ? `${al.length} retracement setup${al.length === 1 ? '' : 's'} fit an open trade` : 'No retracement setups fit an open trade right now', al.length ? al.slice(0, 8).join(', ') + (al.length > 8 ? ' and more' : '') + '. A pullback into support for a long, or a bounce into resistance for a short.' : 'Either nothing is near a 50% / 61.8% level, or the zone is against the open trades.']);
  return out;
}

/* ---------------- share / export ---------------- */
function summaryText(){
  if(!VIEW) return '';
  const { cur, openNow, uplAvg, ins } = VIEW, isLast = VIEW.sel === VIEW.BS.length - 1;
  const lines = [`TradeSphere alerts report: ${pTitle(cur.b, isLast)}`, `${S.strat === 'all' ? 'All strategies' : SNAME[S.strat]}, ${tfLabel()}`, '',
    `New trades: ${cur.opened.length} (${cur.oL} long, ${cur.oS} short)`, `Closed: ${cur.closed.length} (${cur.st.w} won, ${cur.st.l} lost${Number.isFinite(cur.st.wr) ? ', ' + cur.st.wr.toFixed(0) + '% win rate' : ''}), net ${cur.st.n ? fmtPct(cur.st.net, 1) : 'n/a'}`,
    `Open now: ${openNow.length} (${cur.newOpen.length} new this ${S.period}, ${cur.carried} already open), average live P/L ${fmtPct(uplAvg)}`, ''];
  (ins || []).forEach(i => lines.push(`${i[0]} ${i[1]}: ${i[2]}`));
  return lines.join('\n');
}
async function share(){
  const text = summaryText(); if(!text) return;
  try{ if(navigator.share){ await navigator.share({ title: 'TradeSphere alerts report', text }); return; } }catch(e){ if(e && e.name === 'AbortError') return; }
  try{ await navigator.clipboard.writeText(text); toast('Summary copied'); }catch(e){ toast('Sharing is not available here'); }
}
function csv(){
  const F = filt(); if(!F.length){ toast('Nothing to export'); return; }
  const iso = ms => ms ? new Date(ms).toISOString() : '';
  const rows = [['timeframe', 'strategy', 'coin', 'side', 'entry_time', 'exit_time', 'status', 'result_pct', 'exit_reason', 'open_pl_pct'].join(',')];
  F.slice().sort((a, b) => b.eE - a.eE).forEach(t => rows.push([t.tf, SNAME[t.sys], t.sym, t.side > 0 ? 'long' : 'short', iso(t.eE), iso(t.eX), t.open ? 'open' : 'closed', t.pct == null ? '' : t.pct, t.open ? '' : (t.reason === 2 ? 'stop loss' : 'exit rule'), t.open && Number.isFinite(t.upl) ? t.upl.toFixed(2) : ''].join(',')));
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([rows.join('\n')], { type: 'text/csv' })); a.download = 'tradesphere-alerts-' + new Date().toISOString().slice(0, 10) + '.csv';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 3000); toast('CSV saved');
}

/* ---------------- events ---------------- */
document.addEventListener('click', e => {
  const t = e.target;
  let b;
  if((b = t.closest('[data-p]'))){ S.period = b.dataset.p; S.sel = null; persist(); render(); return; }
  if((b = t.closest('[data-s]'))){ S.strat = b.dataset.s; persist(); render(); return; }
  if((b = t.closest('[data-t]'))){ S.tf = b.dataset.t; persist(); render(); return; }
  if((b = t.closest('[data-n]'))){ const el = $(b.dataset.n); if(el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
  if((b = t.closest('[data-sc]'))){ S.scope = b.dataset.sc; render(); return; }
  if((b = t.closest('[data-cs]'))){ S.coinSort = b.dataset.cs; render(); return; }
  if(t.closest('#coinMore')){ S.coinAll = true; render(); return; }
  if((b = t.closest('.hit'))){ S.sel = +b.dataset.i; render(); return; }
  if((b = t.closest('[data-sym]'))){ const sym = b.dataset.sym; try{ if(PARENT && PARENT.AlertsPanel.showCoin){ PARENT.AlertsPanel.showCoin(sym); return; } }catch(err){} toast(sym); return; }
});
document.addEventListener('input', e => { if(e.target.id === 'coinQ'){ S.coinQ = e.target.value; const pos = e.target.selectionStart; render(); const el = $('coinQ'); if(el){ el.focus(); try{ el.setSelectionRange(pos, pos); }catch(err){} } } });
$('bBack').addEventListener('click', () => { try{ if(PARENT) { PARENT.AlertsPanel.closeSummary(); return; } }catch(e){} history.back(); });
$('bShare').addEventListener('click', share);
$('bCsv').addEventListener('click', csv);
$('bRef').addEventListener('click', () => { toast('Refreshing…'); load(); });
document.addEventListener('keydown', e => { if(e.key === 'Escape'){ try{ if(PARENT) PARENT.AlertsPanel.closeSummary(); }catch(err){} } });

load();
setInterval(() => { if(!document.hidden) load(); }, 2 * 60 * 1000);                 // new alerts, open and closed trades
setInterval(() => { if(!document.hidden && VIEW){ refreshLive(); render(); } }, 20 * 1000);   // live prices
})();
</script>
</body>
