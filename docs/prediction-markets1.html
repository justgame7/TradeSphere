<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0C10">
<title>Predictions · TradeSphere</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0A0C10;--s1:#11151c;--s2:#171c25;--border-soft:#212833;--tx:#E8ECF3;--mut:#8791a3;--accent:#8B7CFF;--green:#3DDC97;--red:#FF5D73;--amber:#FFB84D;--r:18px;
--fs:'Space Grotesk',system-ui,sans-serif;--fm:'JetBrains Mono',ui-monospace,monospace}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--tx);font-family:var(--fs)}
body{padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 24px);min-height:100%}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
header{padding:18px 0 6px;display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-size:26px;font-weight:700;letter-spacing:-.02em}
.sub{font-size:12px;color:var(--mut);margin-top:2px}
.sub.warn{color:var(--amber)}
.ib{width:42px;height:42px;border-radius:14px;border:1px solid var(--border-soft);background:var(--s1);color:var(--tx);font-size:18px;cursor:pointer}
.ib.spin{animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.pulse{display:flex;gap:10px;overflow-x:auto;padding:12px 16px;margin:0 -16px;scroll-snap-type:x mandatory;scrollbar-width:none}
.pulse::-webkit-scrollbar{display:none}
.pc{flex:0 0 172px;scroll-snap-align:start;background:linear-gradient(160deg,var(--s2),var(--s1));border:1px solid var(--border-soft);border-radius:var(--r);padding:14px;cursor:pointer}
.pc .k{font-size:12px;color:var(--mut)}
.pc .v{font-family:var(--fm);font-size:30px;font-weight:600;margin:6px 0 2px;letter-spacing:-.03em}
.pc .l{font-size:12px;color:var(--tx);line-height:1.3;min-height:32px}
.ring{height:4px;border-radius:4px;background:var(--border-soft);margin-top:10px;overflow:hidden}
.ring i{display:block;height:100%;border-radius:4px}
.bar{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 82%,transparent);padding:8px 0 10px}
.search{width:100%;height:46px;border-radius:14px;border:1px solid var(--border-soft);background:var(--s1);color:var(--tx);padding:0 16px;font:500 15px var(--fs);outline:none}
.search:focus{border-color:var(--accent)}
.chips{display:flex;gap:8px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 14px;border-radius:17px;border:1px solid var(--border-soft);background:var(--s1);color:var(--mut);font:500 13px var(--fs);cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:#0A0C10;font-weight:600}
.chip.sort{border-style:dashed}
.card{background:var(--s1);border:1px solid var(--border-soft);border-radius:var(--r);padding:16px;margin-bottom:12px;cursor:pointer;position:relative}
.card:active{background:var(--s2)}
.row1{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--mut);margin-bottom:8px}
.tag{padding:3px 9px;border-radius:9px;background:var(--s2);font-weight:600;color:var(--tx)}
.tag.cr{color:var(--amber)}.tag.mc{color:var(--accent)}
.ttl{font-size:16px;font-weight:600;line-height:1.3;margin-bottom:12px;padding-right:30px}
.pin{position:absolute;right:12px;bottom:12px;background:none;border:0;font-size:18px;color:var(--mut);cursor:pointer;padding:6px}
.pin.on{color:var(--amber)}
.o{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;margin-bottom:9px}
.o span{font-size:13px;color:var(--tx)}
.o b{font-family:var(--fm);font-size:14px;font-weight:600}
.o .t{grid-column:1/3;height:6px;border-radius:6px;background:var(--border-soft);overflow:hidden}
.o .t i{display:block;height:100%;border-radius:6px;background:var(--accent)}
.meta{display:flex;gap:14px;font-size:12px;color:var(--mut);font-family:var(--fm);margin-top:4px}
.imp{margin:-2px 0 10px;font-size:13px;color:var(--mut)}.imp b{color:var(--amber);font-family:var(--fm)}
.sk{height:150px;border-radius:var(--r);margin-bottom:12px;background:linear-gradient(90deg,var(--s1),var(--s2),var(--s1));background-size:200% 100%;animation:sh 1.3s infinite}@keyframes sh{to{background-position:-200% 0}}
.empty{text-align:center;color:var(--mut);padding:40px 10px;font-size:14px}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:.25s;z-index:20}
.sheet-bg.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:88%;overflow-y:auto;background:var(--s1);border-radius:26px 26px 0 0;border-top:1px solid var(--border-soft);padding:10px 18px calc(env(safe-area-inset-bottom) + 24px);transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);z-index:21;max-width:720px;margin:0 auto}
.sheet.on{transform:none}
.grab{width:40px;height:4px;border-radius:4px;background:var(--border-soft);margin:0 auto 14px}
.why{background:var(--s2);border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.5;color:var(--mut);margin:10px 0 14px}
.why b{color:var(--tx)}
.lad{display:grid;grid-template-columns:86px 1fr 52px;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--border-soft);font-size:13px}
.lad .n{font-weight:500;line-height:1.2}
.lad .bk{height:10px;border-radius:5px;background:var(--border-soft);position:relative;overflow:hidden}
.lad .bk i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--accent),var(--green));border-radius:5px}
.lad .p{font-family:var(--fm);font-weight:600;text-align:right}
.lad .q{grid-column:2/4;font-family:var(--fm);font-size:11px;color:var(--mut);margin-top:-2px}
.lad.mid .n{color:var(--amber)}
.foot{font-size:11px;color:var(--mut);text-align:center;margin-top:18px;line-height:1.5}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
<header><div><h1>Predictions</h1><div class="sub" id="upd">Loading…</div></div><button class="ib" id="rf" aria-label="Refresh">↻</button></header>
<div class="pulse" id="pulse"></div>
<div class="bar">
<input class="search" id="q" placeholder="Search Fed, CPI, Bitcoin…" autocomplete="off">
<div class="chips" id="chips"></div>
</div>
<div id="list"><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>
<div class="foot">Crowd-priced odds from Kalshi, refreshed every 10 minutes. Probabilities are market prices, not forecasts or advice.</div>
</div>
<div class="sheet-bg" id="bg"></div>
<div class="sheet" id="sh"></div>
<script>
const SER={
KXFED:{n:'Fed rate',g:'mc',why:'Rate cuts add liquidity and usually favour risk assets like crypto; a hawkish surprise tends to hit BTC and alts together.'},
KXCPI:{n:'Inflation',g:'mc',why:'Hot CPI prints lower cut odds and pressure crypto; cooler prints have often triggered relief rallies.'},
KXRECSSNBER:{n:'Recession',g:'mc',why:'Rising recession odds usually mean risk-off flows; crypto has tended to trade with equities in these spells.'},
KXGDP:{n:'GDP',g:'mc',why:'Growth data shifts rate expectations. Weak growth can help cut odds but hurt risk appetite.'},
KXPAYROLLS:{n:'Jobs',g:'mc',why:'Payrolls drive rate expectations. Strong jobs can cut odds for easing; weak jobs raise recession fears.'},
KXU3:{n:'Unemployment',g:'mc',why:'Unemployment trends feed Fed decisions and recession fear, both key crypto macro drivers.'},
KXBTCD:{n:'Bitcoin',g:'cr',sym:'BTC',why:'Daily price-level odds for Bitcoin. The implied level is where the crowd puts a 50% chance.'},
KXETHD:{n:'Ethereum',g:'cr',sym:'ETH',why:'Daily price-level odds for Ethereum.'},
KXSOLD:{n:'Solana',g:'cr',sym:'SOL',why:'Daily price-level odds for Solana.'},
KXXRPD:{n:'XRP',g:'cr',sym:'XRP',why:'Daily price-level odds for XRP.'}};
const BASES=['https://raw.githubusercontent.com/justgame7/TradeSphere/main/data/','data/'];
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let EV=[],UPD=0,tab='all',sort='close',qs='',pins=[],failed=[];
try{pins=JSON.parse(localStorage.getItem('pm_pins')||'[]')}catch(e){}
const savePins=()=>{try{localStorage.setItem('pm_pins',JSON.stringify(pins))}catch(e){}};
const num=x=>{const n=parseFloat(x);return isNaN(n)?0:n};
function mid(m){const b=num(m.b),a=num(m.a);if(b>0&&a>0)return(a+b)/2;const l=num(m.l);return l>0?l:(a>0?a:b)}
const pct=p=>Math.round(p*100)+'%';
function left(c){const d=new Date(c)-Date.now();if(isNaN(d))return'';if(d<=0)return'closing';const h=d/36e5;if(h<1)return Math.max(1,Math.round(d/6e4))+'m left';if(h<48)return Math.round(h)+'h left';return Math.round(h/24)+'d left'}
const fmtV=v=>v>=1e6?(v/1e6).toFixed(1)+'M':v>=1e3?(v/1e3).toFixed(1)+'K':String(Math.round(v));
const usd=k=>k>=1000?'$'+Math.round(k).toLocaleString('en-US'):'$'+k;

async function getSeries(s){
  for(const b of BASES){
    try{const r=await fetch(b+s+'.json?t='+Date.now(),{cache:'no-store'});if(r.ok)return await r.json()}catch(e){}
  }
  return null;
}
async function load(){
  $('rf').classList.add('spin');failed=[];
  const keys=Object.keys(SER);
  const res=await Promise.allSettled(keys.map(getSeries));
  const ev={};UPD=0;
  res.forEach((r,i)=>{
    const s=keys[i],d=r.status==='fulfilled'?r.value:null;
    if(!d||!d.markets){failed.push(SER[s].n);return}
    UPD=Math.max(UPD,new Date(d.updated).getTime()||0);
    d.markets.forEach(m=>{
      const id=m.e||m.t;
      const e=ev[id]||(ev[id]={id,s,title:m.title,close:m.c,ms:[]});
      e.ms.push(Object.assign({},m,{p:mid(m),v:num(m.v)}));
    });
  });
  EV=Object.values(ev).map(e=>{
    e.ms.sort((a,b)=>(a.k??0)-(b.k??0));
    e.vol=e.ms.reduce((t,m)=>t+m.v,0);
    e.top=[...e.ms].sort((a,b)=>b.p-a.p);
    e.strike=e.ms.length>2&&e.ms.every(m=>m.k!=null)&&SER[e.s].g==='cr';
    if(e.strike){e.imp=implied(e.ms)}
    return e;
  });
  $('rf').classList.remove('spin');
  render();
}
// price where the "above" probability crosses 50%
function implied(ms){
  const a=ms.filter(m=>m.p>0).sort((x,y)=>x.k-y.k);
  for(let i=0;i<a.length-1;i++){
    const x=a[i],y=a[i+1];
    if(x.p>=.5&&y.p<.5)return x.k+(x.p-.5)/(x.p-y.p)*(y.k-x.k);
  }
  return null;
}
function status(){
  const el=$('upd');
  if(!UPD){el.textContent='Couldn’t load data. Check your connection and tap refresh.';el.className='sub warn';return}
  const min=Math.round((Date.now()-UPD)/6e4);
  let t='Updated '+(min<1?'just now':min+' min ago');
  const stale=min>30||failed.length;
  if(min>30)t+=' · data is stale';
  if(failed.length)t+=' · missing: '+failed.join(', ');
  el.textContent=t;el.className='sub'+(stale?' warn':'');
}
function visible(){
  let l=EV.filter(e=>{
    const g=SER[e.s].g;
    if(tab==='mc'&&g!=='mc')return false;
    if(tab==='cr'&&g!=='cr')return false;
    if(tab==='pin'&&!pins.includes(e.id))return false;
    if(tab.startsWith('S:')&&e.s!==tab.slice(2))return false;
    if(qs){const h=(e.title+' '+SER[e.s].n+' '+(SER[e.s].sym||'')+' '+e.ms.map(m=>m.s).join(' ')).toLowerCase();if(!h.includes(qs))return false}
    return true;
  });
  const by={close:(a,b)=>new Date(a.close)-new Date(b.close),vol:(a,b)=>b.vol-a.vol,likely:(a,b)=>b.top[0].p-a.top[0].p};
  return l.sort(by[sort]);
}
function pulse(){
  const out=[];
  Object.keys(SER).filter(s=>SER[s].g==='mc').forEach(s=>{
    const es=EV.filter(e=>e.s===s).sort((a,b)=>new Date(a.close)-new Date(b.close));
    if(!es.length)return;
    const e=es[0],t=e.top[0];
    out.push(`<div class="pc" data-id="${esc(e.id)}"><div class="k">${SER[s].n} · ${left(e.close)}</div><div class="v">${pct(t.p)}</div><div class="l">${esc(t.s||e.title)}</div><div class="ring"><i style="width:${pct(t.p)};background:${t.p>.5?'var(--green)':'var(--accent)'}"></i></div></div>`);
  });
  $('pulse').innerHTML=out.join('');
  $('pulse').style.display=out.length?'flex':'none';
}
function card(e){
  const S=SER[e.s],pn=pins.includes(e.id);
  const rows=(e.strike?e.top.slice(0,3):e.top.slice(0,3)).map(m=>`<div class="o"><span>${esc(m.s||m.t)}</span><b>${m.p?pct(m.p):'—'}</b><div class="t"><i style="width:${Math.round(m.p*100)}%"></i></div></div>`).join('');
  const imp=e.strike&&e.imp?`<div class="imp">Crowd’s 50% level: <b>${usd(Math.round(e.imp))}</b></div>`:'';
  return `<div class="card" data-id="${esc(e.id)}"><div class="row1"><span class="tag ${S.g}">${S.n}</span><span>${left(e.close)}</span></div><div class="ttl">${esc(e.title)}</div>${imp}${rows}<div class="meta"><span>Vol ${fmtV(e.vol)}</span><span>${e.ms.length} outcomes</span></div><button class="pin ${pn?'on':''}" data-pin="${esc(e.id)}" aria-label="Pin">${pn?'★':'☆'}</button></div>`;
}
function render(){
  status();
  if(!EV.length){$('list').innerHTML='<div class="empty">No markets loaded yet.</div>';$('pulse').innerHTML='';return}
  pulse();
  const tabs=[['all','All'],['mc','Macro'],['cr','Crypto'],['pin','Pinned ★']].concat(Object.keys(SER).map(s=>['S:'+s,SER[s].n]));
  $('chips').innerHTML=tabs.map(t=>`<button class="chip ${tab===t[0]?'on':''}" data-t="${t[0]}">${t[1]}</button>`).join('')+`<button class="chip sort" data-sort="1">Sort: ${{close:'closing soon',vol:'volume',likely:'most likely'}[sort]}</button>`;
  const l=visible();
  $('list').innerHTML=l.length?l.map(card).join(''):`<div class="empty">${tab==='pin'?'Tap ☆ on any event to pin it here.':'No events match. Clear the search or pick another filter.'}</div>`;
}
function openSheet(id){
  const e=EV.find(x=>x.id===id);if(!e)return;
  const S=SER[e.s];
  const list=e.strike?e.ms:e.top;
  const lad=list.map(m=>{
    const isMid=e.strike&&e.imp&&Math.abs(m.k-e.imp)===Math.min(...e.ms.map(z=>Math.abs(z.k-e.imp)));
    return `<div class="lad ${isMid?'mid':''}"><div class="n">${esc(m.s||m.t)}</div><div class="bk"><i style="width:${Math.round(m.p*100)}%"></i></div><div class="p">${m.p?pct(m.p):'—'}</div><div class="q">bid ${num(m.b).toFixed(2)} · ask ${num(m.a).toFixed(2)} · last ${num(m.l).toFixed(2)} · vol ${fmtV(m.v)}</div></div>`;
  }).join('');
  $('sh').innerHTML=`<div class="grab"></div><div class="row1"><span class="tag ${S.g}">${S.n}</span><span>${left(e.close)}</span></div><div class="ttl" style="padding:0">${esc(e.title)}</div>${e.strike&&e.imp?`<div class="imp">Crowd’s 50% level: <b>${usd(Math.round(e.imp))}</b></div>`:''}<div class="why"><b>Why it matters for crypto.</b> ${S.why}</div>${lad}`;
  $('bg').classList.add('on');$('sh').classList.add('on');$('sh').scrollTop=0;
  if(!history.state||!history.state.pm)history.pushState({pm:1},'');
}
function closeSheet(fromPop){
  if(!$('sh').classList.contains('on'))return;
  $('bg').classList.remove('on');$('sh').classList.remove('on');
  if(!fromPop&&history.state&&history.state.pm)history.back();
}
window.addEventListener('popstate',()=>closeSheet(true));
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
$('bg').onclick=()=>closeSheet();
$('rf').onclick=load;
$('q').oninput=e=>{qs=e.target.value.trim().toLowerCase();render()};
$('chips').onclick=e=>{
  const c=e.target.closest('.chip');if(!c)return;
  if(c.dataset.sort){sort={close:'vol',vol:'likely',likely:'close'}[sort]}else tab=c.dataset.t;
  render();
};
$('pulse').onclick=e=>{const c=e.target.closest('.pc');if(c)openSheet(c.dataset.id)};
$('list').onclick=e=>{
  const p=e.target.closest('[data-pin]');
  if(p){const id=p.dataset.pin;pins=pins.includes(id)?pins.filter(x=>x!==id):pins.concat(id);savePins();render();return}
  const c=e.target.closest('.card');if(c)openSheet(c.dataset.id);
};
load();setInterval(load,6e5);setInterval(status,6e4);
</script>
</body>
</html>
