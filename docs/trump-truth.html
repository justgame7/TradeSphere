<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trump's Truth Social</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0C10;
    --panel:#12151B;
    --panel2:#171B22;
    --border:#232833;
    --border-soft:#1B1F28;
    --text:#E6E9EF;
    --muted:#8B93A3;
    --faint:#565F70;
    --accent:#FF5470;
    --accent-dim:#7A2E3B;
    --accent-light:#FFB3C1;
    --font-display:'Space Grotesk', sans-serif;
    --font-mono:'JetBrains Mono', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--font-display);
    background:var(--bg);
    color:var(--text);
    padding:28px 20px 70px;
    background-image:
      radial-gradient(circle at 12% 0%, rgba(255,84,112,0.07), transparent 40%),
      radial-gradient(circle at 92% 15%, rgba(255,84,112,0.05), transparent 35%);
  }
  .wrap{max-width:1080px;margin:0 auto;}

  .topheader{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px;}
  .eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:.18em;color:var(--accent);text-transform:uppercase;display:flex;align-items:center;gap:8px;}
  .eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);animation:pulse 2s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
  .header-right{display:flex;align-items:center;gap:10px;}
  .updated-label{font-family:var(--font-mono);font-size:10.5px;color:var(--faint);white-space:nowrap;}
  .updated-label.warn{color:var(--accent);}

  h1{font-size:22px;margin:6px 0 6px;font-weight:700;}
  .sub{color:var(--muted);font-size:13.5px;line-height:1.5;margin-bottom:22px;max-width:60ch;}

  .refresh-btn{background:var(--panel2);border:1px solid var(--border);color:var(--text);width:32px;height:32px;padding:0;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .refresh-btn:hover{border-color:var(--accent);color:var(--accent);}
  .refresh-btn svg{width:14px;height:14px;transition:transform .4s;}
  .refresh-btn.spinning svg{transform:rotate(360deg);}

  /* ---- Hero: latest post ---- */
  .hero{
    background:linear-gradient(135deg, rgba(255,84,112,.10), rgba(255,84,112,.03));
    border:1px solid var(--border);
    border-radius:16px;
    padding:22px 24px;
    margin-bottom:22px;
    position:relative;
    overflow:hidden;
    display:block;
    text-decoration:none;
    color:inherit;
  }
  .hero:hover{border-color:var(--border-soft);}
  .hero-label{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-bottom:14px;}
  .hero-author{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
  .avatar{
    width:44px;height:44px;border-radius:50%;
    background:linear-gradient(135deg, var(--accent), #FF8AA2);
    display:flex;align-items:center;justify-content:center;
    font-size:19px;flex-shrink:0;
  }
  .hero .avatar{width:48px;height:48px;font-size:21px;}
  .author-info{display:flex;flex-direction:column;}
  .author-name{font-weight:700;font-size:15px;color:var(--text);}
  .author-handle{font-size:12px;color:var(--muted);font-family:var(--font-mono);}
  .hero-title{font-size:19px;font-weight:600;line-height:1.45;margin-bottom:16px;max-width:75ch;
    display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden;}
  .hero-meta{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .ago{font-family:var(--font-mono);font-size:11px;color:var(--faint);}
  .source-link{font-family:var(--font-mono);font-size:11px;color:var(--accent);}
  @media(max-width:620px){.hero-title{font-size:16.5px;}}

  /* ---- Keyword badges ---- */
  .kwbadge{display:inline-flex;align-items:center;font-family:var(--font-mono);font-size:10.5px;font-weight:700;letter-spacing:.04em;padding:4px 10px;border-radius:20px;background:rgba(255,84,112,.14);border:1px solid rgba(255,84,112,.32);color:var(--accent-light);}

  /* ---- Filters ---- */
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
  .filter-chip{background:var(--panel2);border:1px solid var(--border);color:var(--muted);font-family:var(--font-mono);padding:7px 13px;font-size:11.5px;font-weight:600;border-radius:20px;cursor:pointer;}
  .filter-chip:hover{border-color:var(--accent-dim);}
  .filter-chip.active{background:rgba(255,84,112,.14);border-color:var(--accent);color:var(--accent-light);}
  .tweet-count{color:var(--faint);font-size:11px;font-family:var(--font-mono);margin:-6px 0 14px;}

  /* ---- Post grid ---- */
  .grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(300px, 1fr));gap:14px;}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px;transition:border-color .15s, transform .15s;text-decoration:none;color:inherit;}
  .card:hover{border-color:var(--border-soft);transform:translateY(-2px);}
  .card-header{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .card-author{display:flex;align-items:center;gap:10px;flex:1;min-width:0;}
  .card-title{font-size:14.5px;line-height:1.55;color:var(--text);flex:1;
    display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden;}
  .card-keywords{display:flex;gap:6px;flex-wrap:wrap;}

  /* ---- Skeletons ---- */
  .skel{background:linear-gradient(90deg, var(--panel2) 25%, #1d222b 37%, var(--panel2) 63%);background-size:400% 100%;animation:shimmer 1.4s ease infinite;border-radius:8px;}
  @keyframes shimmer{0%{background-position:100% 0;}100%{background-position:0 0;}}
  .skel-hero{height:150px;border-radius:16px;margin-bottom:22px;}
  .skel-card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px;}
  .skel-line{height:12px;}

  .empty,.error-state{padding:28px;color:var(--faint);font:12px var(--font-mono);text-align:center;border:1px dashed var(--border);border-radius:14px;line-height:1.7;}
  .error-state{color:var(--accent-light);border-color:rgba(255,84,112,.35);}
  .retry-btn{margin-top:14px;background:var(--panel2);border:1px solid var(--border);color:var(--text);cursor:pointer;font:600 12px var(--font-mono);padding:9px 16px;border-radius:8px;}
  .retry-btn:hover{border-color:var(--accent);color:var(--accent);}

  @media(max-width:600px){body{padding:22px 14px 40px;} .hero{padding:18px;}}

  .page-footer{
    color:var(--faint);
    font-size:12px;
    line-height:1.6;
    margin-top:30px;
    padding-top:18px;
    border-top:1px solid var(--border-soft);
    max-width:680px;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topheader">
    <div class="eyebrow"><span class="dot"></span>Social Media &middot; Truth Social</div>
    <div class="header-right">
      <span class="updated-label" id="updatedLabel"></span>
      <button class="refresh-btn" id="refreshBtn" aria-label="Refresh">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
      </button>
    </div>
  </div>
  <h1>Trump's Truth Social Posts</h1>

  <div id="heroWrap"></div>

  <div class="filters" id="filters">
    <button class="filter-chip" data-filter="all">All posts</button>
    <button class="filter-chip active" data-filter="crypto">Crypto</button>
  </div>

  <div class="tweet-count" id="tweetCount"></div>
  <main id="postGrid"></main>

  <div class="page-footer">Recent posts from Donald J. Trump, pulled from the public trumpstruth.org archive. Crypto-related topics are flagged and filterable below.</div>
</div>

<script>
// Live data source: the public RSS archive of Donald J. Trump's TRUTH Social
// posts run by Defending Democracy Together (https://www.trumpstruth.org),
// which explicitly publishes this feed for RSS readers (see their FAQ).
// Each item also carries a <truth:originalUrl> pointing at the real post on
// truthsocial.com, which is what cards link out to.
const FEED_URL = 'https://www.trumpstruth.org/feed';
const CACHE_KEY = 'trump-truth-cache-v1';
const AUTO_REFRESH_MS = 15 * 60 * 1000;
const MAX_POSTS = 150; // how many raw feed items to scan (safety cap, not the display window)
const DAYS_WINDOW = 3; // only keep posts from the last 3 days

// Same Cloudflare Worker already deployed for news.html (see
// cloudflare-worker.js) - a generic `?url=` CORS proxy under your own
// account, so it isn't a shared public proxy other users can exhaust or
// that gets ad/privacy-blocklisted. This is the PRIMARY fetch path.
const WORKER_PROXY_URL = 'https://newsyt.justfagame9.workers.dev';
function buildWorkerProxyUrl(u){
  return `${WORKER_PROXY_URL}/?url=${encodeURIComponent(u)}`;
}
// Public CORS proxies fetch the feed directly from trumpstruth.org - tried
// in parallel, first success wins. Used only if the Worker is unreachable.
const CORS_PROXIES = [
  (u) => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(u)}`,
  (u) => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
  (u) => `https://proxy.corsfix.com/?${u}`,
  (u) => `https://thingproxy.freeboard.io/fetch/${u}`,
];
// Last-resort fallback: rss2json runs its own crawl on its own schedule, so
// it can return an already-stale snapshot with a normal 200 response. Only
// used if the Worker and every CORS proxy fail.
const RSS2JSON_URL = (u) => `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(u)}`;
const PROXY_TIMEOUT_MS = 7000;

// These feed the single "Crypto" bucket below (a post is "crypto" if it
// matches ANY of these), and also drive the per-post keyword badges so you
// can see which specific term(s) matched. Word-boundary regex is used
// instead of plain .includes() for short/generic terms (coin, hype, nft)
// to avoid false positives like "coincidence" or "hyperlink".
const KEYWORD_RULES = [
  { id: 'crypto',       label: 'Crypto',                 test: t => /\bcrypto(currency|currencies)?\b/.test(t) },
  { id: 'bitcoin',      label: 'Bitcoin',                 test: t => /\bbitcoin\b/.test(t) },
  { id: 'ethereum',     label: 'Ethereum',                test: t => /\bethereum\b/.test(t) },
  { id: 'solana',       label: 'Solana',                  test: t => /\bsolana\b/.test(t) },
  { id: 'xrp',          label: 'XRP',                     test: t => /\bxrp\b|\bripple\b/.test(t) },
  { id: 'doge',         label: 'Dogecoin',                test: t => /\bdogecoin\b|\bdoge\b/.test(t) },
  { id: 'coin',         label: 'Coin',                    test: t => /\bcoins?\b/.test(t) },
  { id: 'hype',         label: 'Hype',                    test: t => /\bhype\b/.test(t) },
  { id: 'clarity',      label: 'Clarity Act',             test: t => /\bclarity act\b/.test(t) },
  { id: 'genius',       label: 'Genius Act',              test: t => /\bgenius act\b/.test(t) },
  { id: 'prediction',   label: 'Prediction Market',       test: t => /\bprediction markets?\b/.test(t) },
  { id: 'stablecoin',   label: 'Stablecoin',              test: t => /\bstablecoins?\b/.test(t) },
  { id: 'blockchain',   label: 'Blockchain',              test: t => /\bblockchain\b/.test(t) },
  { id: 'digitalasset', label: 'Digital Asset',           test: t => /\bdigital assets?\b/.test(t) },
  { id: 'wlfi',         label: 'World Liberty Financial', test: t => /\bworld liberty financial\b|\bwlfi\b/.test(t) },
  { id: 'reserve',      label: 'Bitcoin Reserve',         test: t => /\bstrategic bitcoin reserve\b|\bbitcoin reserve\b|\bdigital asset reserve\b/.test(t) },
  { id: 'nft',          label: 'NFT',                     test: t => /\bnfts?\b/.test(t) },
  { id: 'cbdc',         label: 'CBDC',                    test: t => /\bcbdc\b|\bcentral bank digital currency\b/.test(t) },
];
const KEYWORD_LABEL = Object.fromEntries(KEYWORD_RULES.map(k => [k.id, k.label]));

let allPosts = [];
let filterMode = 'crypto'; // 'crypto' (default) or 'all'
let lastUpdated = null;
let lastRefreshFailed = false;
let refreshTimer;

function escapeHtml(value){
  return String(value).replace(/[&<>'"]/g, character => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[character]));
}
function timeAgo(date){
  const diffMs = Date.now() - date.getTime();
  const mins = Math.floor(diffMs / 60000);
  if(mins < 1) return 'just now';
  if(mins < 60) return `${mins}m ago`;
  const hours = Math.floor(mins / 60);
  if(hours < 24) return `${hours}h ago`;
  const days = Math.floor(hours / 24);
  return `${days}d ago`;
}
function getText(el, tag){
  const node = el.getElementsByTagName(tag)[0];
  return node ? node.textContent.trim() : '';
}
function stripHtml(html){
  const doc = new DOMParser().parseFromString(html, 'text/html');
  return (doc.body.textContent || '').replace(/\s+/g, ' ').trim();
}
function getMatchingKeywords(text){
  const lower = text.toLowerCase();
  return KEYWORD_RULES.filter(k => k.test(lower)).map(k => k.id);
}

async function fetchWithTimeout(url, ms){
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), ms);
  try{
    return await fetch(url, {cache:'no-store', signal: controller.signal});
  }finally{
    clearTimeout(timer);
  }
}
function parseFeed(xmlText){
  const doc = new DOMParser().parseFromString(xmlText, 'application/xml');
  if(doc.getElementsByTagName('parsererror').length) throw new Error('feed parse error');
  const items = Array.from(doc.getElementsByTagName('item'));
  return items.map(item => {
    const descriptionHtml = getText(item, 'description');
    const text = stripHtml(descriptionHtml);
    const originalUrl = getText(item, 'truth:originalUrl') || getText(item, 'originalUrl') || getText(item, 'link');
    return {
      id: getText(item, 'guid') || originalUrl,
      text,
      pubDate: getText(item, 'pubDate'),
      link: originalUrl || getText(item, 'link')
    };
  }).filter(post => post.text && post.link);
}
async function fetchViaRss2Json(bustedUrl){
  const response = await fetchWithTimeout(RSS2JSON_URL(bustedUrl), PROXY_TIMEOUT_MS);
  if(!response.ok) throw new Error(`rss2json responded ${response.status}`);
  const data = await response.json();
  if(!Array.isArray(data.items)) throw new Error('rss2json returned no items');
  return data.items
    .map(item => ({
      id: item.guid || item.link,
      text: stripHtml(item.description || ''),
      pubDate: item.pubDate,
      link: item.link
    }))
    .filter(post => post.text && post.link);
}
async function fetchFeed(){
  const bustedUrl = `${FEED_URL}${FEED_URL.includes('?') ? '&' : '?'}_=${Date.now()}`;

  // 1) Your own Cloudflare Worker - the most reliable path.
  if(WORKER_PROXY_URL){
    try{
      const res = await fetchWithTimeout(buildWorkerProxyUrl(bustedUrl), PROXY_TIMEOUT_MS);
      if(!res.ok) throw new Error('worker responded ' + res.status);
      const text = await res.text();
      const items = parseFeed(text);
      if(!items.length) throw new Error('empty feed');
      return {items, method: 'live'};
    }catch(err){
      const msg = err && err.name === 'AbortError' ? 'timed out' : err.message;
      console.warn('[trumpstruth] worker failed:', msg);
    }
  }

  // 2) Race public CORS proxies.
  const proxyAttempts = CORS_PROXIES.map(buildProxyUrl => (async () => {
    const res = await fetchWithTimeout(buildProxyUrl(bustedUrl), PROXY_TIMEOUT_MS);
    if(!res.ok) throw new Error('proxy responded ' + res.status);
    const text = await res.text();
    const items = parseFeed(text);
    if(!items.length) throw new Error('empty feed');
    return items;
  })());

  try{
    const items = await Promise.any(proxyAttempts);
    return {items, method: 'live'};
  }catch(err){
    const reasons = (err && err.errors) ? err.errors.map(e => e.message).join('; ') : (err && err.message);
    console.warn('[trumpstruth] all proxies failed', reasons, '- falling back to rss2json');
  }

  // 3) Last resort: rss2json's cached copy.
  try{
    const items = await fetchViaRss2Json(bustedUrl);
    return {items, method: 'cached-fallback'};
  }catch(err){
    const msg = err && err.name === 'AbortError' ? 'timed out' : err.message;
    console.warn('[trumpstruth] rss2json fallback also failed:', msg);
  }

  throw new Error('trumpstruth.org feed unavailable');
}

document.querySelectorAll('.filter-chip').forEach(chip => {
  chip.addEventListener('click', () => {
    filterMode = chip.dataset.filter;
    document.querySelectorAll('.filter-chip').forEach(c => c.classList.toggle('active', c.dataset.filter === filterMode));
    render();
  });
});

function renderHero(list){
  const heroEl = document.getElementById('heroWrap');
  if(!list.length){ heroEl.innerHTML = ''; return; }
  const lead = list[0];
  heroEl.innerHTML = `
    <a class="hero" href="${escapeHtml(lead.link)}" target="_blank" rel="noopener noreferrer">
      <div class="hero-label">Latest matching post</div>
      <div class="hero-author">
        <div class="avatar">\u{1F1FA}\u{1F1F8}</div>
        <div class="author-info">
          <div class="author-name">Donald J. Trump</div>
          <div class="author-handle">@realDonaldTrump</div>
        </div>
      </div>
      <div class="hero-title">${escapeHtml(lead.text)}</div>
      <div class="hero-meta">
        ${lead.keywords.map(k => `<span class="kwbadge">${escapeHtml(KEYWORD_LABEL[k].toUpperCase())}</span>`).join('')}
        <span class="ago">${timeAgo(lead.publishedDate)}</span>
        <span class="source-link">View on Truth Social &#8599;</span>
      </div>
    </a>`;
}

function renderGrid(list){
  const el = document.getElementById('postGrid');
  const rest = list.slice(1);
  if(!list.length){
    el.innerHTML = '<div class="empty">No posts match this view in the last 3 days.</div>';
    return;
  }
  if(!rest.length){ el.innerHTML = ''; return; }
  el.innerHTML = `<div class="grid">${rest.map(post => `
    <a class="card" href="${escapeHtml(post.link)}" target="_blank" rel="noopener noreferrer">
      <div class="card-header">
        <div class="card-author">
          <div class="avatar">\u{1F1FA}\u{1F1F8}</div>
          <div class="author-info">
            <div class="author-name">Donald J. Trump</div>
            <div class="author-handle">@realDonaldTrump</div>
          </div>
        </div>
        <span class="ago">${timeAgo(post.publishedDate)}</span>
      </div>
      <div class="card-title">${escapeHtml(post.text)}</div>
      <div class="card-keywords">${post.keywords.map(k => `<span class="kwbadge">${escapeHtml(KEYWORD_LABEL[k].toUpperCase())}</span>`).join('')}</div>
    </a>`).join('')}</div>`;
}

function applyDefaultFilterMode(){
  // If nothing in the current 3-day window matches any crypto keyword, default
  // to "All posts" instead of showing an empty "Crypto" view. Otherwise default
  // to "Crypto" as usual. Runs each time fresh data arrives (cache load or
  // refresh) - if you've manually switched tabs, the next refresh re-evaluates
  // this rather than permanently remembering your choice.
  // Skip while there's no data yet (e.g. first-ever visit, nothing cached) -
  // an empty array would otherwise look indistinguishable from "no crypto
  // posts found" and incorrectly default to All posts before anything loaded.
  if(!allPosts.length) return;
  const hasCrypto = allPosts.some(post => post.keywords.length > 0);
  filterMode = hasCrypto ? 'crypto' : 'all';
  document.querySelectorAll('.filter-chip').forEach(c => c.classList.toggle('active', c.dataset.filter === filterMode));
}

function render(){
  const filtered = allPosts
    .filter(post => filterMode === 'all' || post.keywords.length > 0)
    .sort((a,b) => b.publishedDate - a.publishedDate);

  document.getElementById('tweetCount').textContent = allPosts.length
    ? (filterMode === 'all'
        ? `Showing ${filtered.length} recent posts`
        : `${filtered.length} of ${allPosts.length} posts are crypto-related`)
    : '';

  renderHero(filtered);
  renderGrid(filtered);
}

function updateLastUpdatedLabel(){
  const el = document.getElementById('updatedLabel');
  if(!lastUpdated){ el.textContent = ''; el.classList.remove('warn'); return; }
  if(lastRefreshFailed){
    el.textContent = `Refresh failed \u00b7 showing data from ${timeAgo(lastUpdated)}`;
    el.classList.add('warn');
  }else{
    el.textContent = 'Updated ' + timeAgo(lastUpdated);
    el.classList.remove('warn');
  }
}

function renderSkeleton(){
  document.getElementById('heroWrap').innerHTML = '<div class="skel skel-hero"></div>';
  let html = '<div class="grid">';
  for(let i=0;i<4;i++){
    html += `<div class="skel-card">
      <div class="skel skel-line" style="width:60%"></div>
      <div class="skel skel-line" style="width:95%"></div>
      <div class="skel skel-line" style="width:80%"></div>
      <div class="skel skel-line" style="width:40%"></div>
    </div>`;
  }
  html += '</div>';
  document.getElementById('postGrid').innerHTML = html;
}

function renderErrorState(err){
  document.getElementById('heroWrap').innerHTML = '';
  document.getElementById('postGrid').innerHTML = `
    <div class="error-state">
      Couldn't load posts right now (${escapeHtml(err && err.message ? err.message : 'network error')}).<br>
      This page relies on public feed-reading services that are sometimes temporarily down -
      or blocked by an ad blocker/privacy extension, since several look like generic "proxy" domains.
      If you have one enabled, try allow-listing this page (or a private/incognito window) and retry.
      Open the browser console for the specific error.
      <br><button class="retry-btn" id="retryBtn" type="button">Try again</button>
    </div>`;
  document.getElementById('retryBtn').addEventListener('click', loadPosts);
}

function saveCache(){
  try{
    localStorage.setItem(CACHE_KEY, JSON.stringify({
      lastUpdated: lastUpdated ? lastUpdated.toISOString() : null,
      posts: allPosts.map(p => ({ ...p, publishedDate: p.publishedDate.toISOString() }))
    }));
  }catch(err){ /* storage full/unavailable - not critical */ }
}
function loadCache(){
  try{
    const raw = localStorage.getItem(CACHE_KEY);
    if(!raw) return false;
    const cached = JSON.parse(raw);
    if(!cached.posts) return false;
    const cutoff = Date.now() - DAYS_WINDOW * 24 * 60 * 60 * 1000;
    allPosts = cached.posts
      .map(p => ({ ...p, publishedDate: new Date(p.publishedDate) }))
      .filter(post => post.publishedDate.getTime() >= cutoff);
    lastUpdated = cached.lastUpdated ? new Date(cached.lastUpdated) : null;
    return true;
  }catch(err){ return false; }
}

async function loadPosts(){
  const btn = document.getElementById('refreshBtn');
  btn.classList.add('spinning');
  if(allPosts.length){
    render();
    updateLastUpdatedLabel();
  }else{
    renderSkeleton();
  }

  try{
    const { items } = await fetchFeed();
    const cutoff = Date.now() - DAYS_WINDOW * 24 * 60 * 60 * 1000;
    allPosts = items
      .slice(0, MAX_POSTS)
      .map(item => ({
        ...item,
        publishedDate: new Date(item.pubDate),
        keywords: getMatchingKeywords(item.text)
      }))
      .filter(post => post.publishedDate.getTime() >= cutoff);
    lastUpdated = new Date();
    lastRefreshFailed = false;
    saveCache();
    applyDefaultFilterMode();
    render();
    updateLastUpdatedLabel();
  }catch(error){
    lastRefreshFailed = true;
    if(!allPosts.length){
      renderErrorState(error);
    }else{
      updateLastUpdatedLabel();
    }
  }finally{
    setTimeout(() => btn.classList.remove('spinning'), 400);
    scheduleRefresh();
  }
}

function scheduleRefresh(){
  clearTimeout(refreshTimer);
  refreshTimer = setTimeout(loadPosts, AUTO_REFRESH_MS);
}

document.getElementById('refreshBtn').addEventListener('click', loadPosts);

loadCache();
applyDefaultFilterMode();
loadPosts();
setInterval(updateLastUpdatedLabel, 60000);
</script>

</html>
