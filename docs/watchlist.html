<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watchlist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0C10;
    --panel:#12151B;
    --panel2:#171B22;
    --border:#232833;
    --border-soft:#1B1F28;
    --text:#E6E9EF;
    --muted:#8B93A3;
    --faint:#565F70;
    --accent:#35E0C0;
    --accent-dim:#1E7F6F;
    --red:#FF5470;
    --red-dim:#7A2E3B;
    --amber:#F5A623;
    --blue:#5B8CFF;
    --violet:#A78BFA;
    --orange:#FF8A4C;
    --gold:#F0C24B;
    --font-display:'Space Grotesk', sans-serif;
    --font-mono:'JetBrains Mono', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--font-display);
    background:var(--bg);
    color:var(--text);
    padding:28px 20px 70px;
    background-image:
      radial-gradient(circle at 12% 0%, rgba(240,194,75,0.07), transparent 40%),
      radial-gradient(circle at 92% 15%, rgba(91,140,255,0.05), transparent 35%);
  }
  .wrap{max-width:820px;margin:0 auto;}

  /* ---- Top header ---- */
  .topheader{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;flex-wrap:wrap;gap:10px;}
  .eyebrow{display:flex;align-items:center;gap:8px;font:700 12px var(--font-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--text);}
  .eyebrow .dot{width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold);animation:pulse 2s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
  .header-right{display:flex;align-items:center;gap:10px;}
  .updated-label{font-family:var(--font-mono);font-size:10.5px;color:var(--faint);white-space:nowrap;}
  .updated-label.label-error{color:var(--red);}
  .refresh-btn{
    background:var(--panel);border:1px solid var(--border);color:var(--text);
    width:32px;height:32px;padding:0;border-radius:8px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .refresh-btn:hover{border-color:var(--gold);color:var(--gold);}
  .refresh-btn svg{width:14px;height:14px;transition:transform .4s;}
  .refresh-btn.spinning svg{transform:rotate(360deg);}
  .refresh-btn.flipped svg{transform:rotate(180deg);}
  .sub{color:var(--muted);font-size:13px;line-height:1.55;margin:10px 0 16px;max-width:640px;}

  .degraded-banner{
    background:rgba(255,84,112,.08);border:1px solid rgba(255,84,112,.25);color:#ffb3c1;
    border-radius:10px;padding:10px 14px;font:12px var(--font-mono);margin-bottom:16px;
    display:none;
  }
  .degraded-banner.show{display:block;}

  /* ---- Market pulse strip ---- */
  .pulse-strip{
    display:flex;flex-direction:column;gap:10px;
    background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:12px 16px;margin-bottom:16px;
  }
  .pulse-row{display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
  .pulse-row-top{justify-content:space-between;}
  .pulse-row-top .pulse-row-left{display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
  .pulse-item{display:flex;align-items:center;gap:7px;font:600 12.5px var(--font-mono);color:var(--muted);}
  .pulse-item b{color:var(--text);font-size:13.5px;}
  .pulse-up{color:var(--accent);}
  .pulse-down{color:var(--red);}
  .pulse-divider{width:1px;height:16px;background:var(--border);}

  /* ---- Pulse strip inline coin search / quick-add ---- */
  .pulse-search-wrap{
    display:flex;align-items:center;gap:6px;background:var(--panel2);
    border:1px solid var(--border);border-radius:8px;padding:4px 6px 4px 10px;
    margin-left:auto;
  }
  .pulse-search-wrap:focus-within{border-color:var(--violet);}
  .pulse-search-input{
    background:none;border:none;color:var(--text);font:12px var(--font-mono);
    width:104px;min-width:0;
  }
  .pulse-search-input:focus{outline:none;}
  .pulse-search-input::placeholder{color:var(--faint);}
  .pulse-search-error{
    color:var(--red);font:700 13px var(--font-mono);flex-shrink:0;line-height:1;
  }
  .pulse-search-add{
    flex-shrink:0;background:var(--violet);border:none;color:#141221;
    width:22px;height:22px;border-radius:6px;cursor:pointer;font:700 13px var(--font-mono);
    line-height:1;display:flex;align-items:center;justify-content:center;
  }
  .pulse-search-add:hover{filter:brightness(1.1);}
  .pulse-search-add:disabled{opacity:.5;cursor:default;}

  /* ---- Watchlist rows ---- */
  .watch-list{display:flex;flex-direction:column;gap:10px;margin-bottom:14px;}

  .watch-item{position:relative;border-radius:14px;overflow:hidden;}

  .watch-delete-bg{
    position:absolute;inset:0;border-radius:14px;background:var(--red);
    display:flex;align-items:center;justify-content:flex-start;
  }
  .watch-delete-btn{
    height:100%;padding:0 20px;background:transparent;border:none;color:#fff;
    font:700 12px var(--font-mono);letter-spacing:.02em;cursor:pointer;
    display:flex;align-items:center;gap:6px;white-space:nowrap;
  }

  .watch-card{
    position:relative;z-index:1;
    background:var(--panel);border:1px solid var(--border);border-radius:14px;
    padding:14px 16px;display:flex;flex-direction:column;
    transition:border-color .15s, transform .2s ease;
    touch-action:pan-y;user-select:none;
  }
  .watch-card:hover{border-color:var(--border-soft);}
  .watch-card.error{cursor:default;gap:8px;}
  .watch-item.open .watch-card{border-color:rgba(255,84,112,.4);}

  .watch-top{display:flex;align-items:center;gap:11px;}
  .watch-rank{
    flex-shrink:0;width:30px;height:22px;border-radius:7px;
    display:flex;align-items:center;justify-content:center;
    font:700 11px var(--font-mono);color:var(--faint);border:1px solid var(--border);
  }
  .watch-rank.top{color:var(--gold);border-color:rgba(240,194,75,.4);background:rgba(240,194,75,.08);}
  .coin-icon{width:32px;height:32px;border-radius:50%;flex-shrink:0;object-fit:cover;box-shadow:0 4px 12px rgba(0,0,0,.3);}
  .coin-icon-fallback{
    width:32px;height:32px;border-radius:50%;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    font:700 13px var(--font-display);color:#fff;box-shadow:0 4px 12px rgba(0,0,0,.3);
  }
  .watch-id{min-width:0;flex:1;}
  .watch-symbol{font-size:15px;font-weight:700;line-height:1.25;}
  .watch-name{font-size:11px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  .watch-price-block{text-align:right;flex-shrink:0;}
  .watch-price{
    font:700 16.5px var(--font-mono);letter-spacing:-.01em;
    border-radius:5px;padding:1px 4px;margin:-1px -4px;
  }
  .watch-price.flash-up{animation:flashUp .9s ease-out;}
  .watch-price.flash-down{animation:flashDown .9s ease-out;}
  @keyframes flashUp{0%{background:rgba(53,224,192,.35);}100%{background:transparent;}}
  @keyframes flashDown{0%{background:rgba(255,84,112,.35);}100%{background:transparent;}}
  .watch-change{font:600 12px var(--font-mono);margin-top:1px;}
  .watch-change.up{color:var(--accent);}
  .watch-change.down{color:var(--red);}

  .watch-chevron{
    flex-shrink:0;width:26px;height:26px;margin:-5px -6px -5px 2px;color:var(--faint);
    display:flex;align-items:center;justify-content:center;
    border-radius:7px;cursor:pointer;
    transition:transform .2s ease,color .15s,background .15s;
  }
  .watch-chevron:hover{color:var(--gold);background:var(--panel2);}
  .watch-chevron svg{width:12px;height:12px;}
  .watch-card.expanded .watch-chevron{transform:rotate(180deg);color:var(--muted);}

  .watch-details{
    max-height:0;opacity:0;overflow:hidden;
    display:flex;flex-direction:column;gap:10px;
    transition:max-height .22s ease,opacity .18s ease,margin-top .22s ease;
  }
  .watch-card.expanded .watch-details{max-height:160px;opacity:1;margin-top:12px;}

  .range-block{display:flex;flex-direction:column;gap:5px;}
  .range-title{font:10px var(--font-mono);color:var(--faint);text-transform:uppercase;letter-spacing:.06em;}
  .range-track{position:relative;height:5px;border-radius:4px;background:var(--border-soft);}
  .range-marker{
    position:absolute;top:50%;width:9px;height:9px;border-radius:50%;
    background:var(--gold);border:2px solid var(--bg);transform:translate(-50%,-50%);
    box-shadow:0 0 0 1px var(--gold);
  }
  .range-labels{display:flex;justify-content:space-between;font:11px var(--font-mono);color:var(--muted);}

  .watch-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:10px;border-top:1px solid var(--border-soft);}
  .watch-asof{font:10.5px var(--font-mono);color:var(--faint);}
  .watch-link{font:600 11px var(--font-mono);color:var(--gold);text-decoration:none;display:inline-flex;align-items:center;gap:4px;}
  .watch-link:hover{text-decoration:underline;}
  .watch-foot-links{display:flex;align-items:center;gap:14px;}
  .analysis-btn{
    font:600 11px var(--font-mono);color:var(--blue);background:none;border:none;padding:0;
    text-decoration:none;display:inline-flex;align-items:center;gap:4px;cursor:pointer;
  }
  .analysis-btn:hover{text-decoration:underline;}

  /* ---- Coin -> group assignment icon + picker ---- */
  .group-picker-wrap{position:relative;display:inline-flex;}
  .group-icon-btn{
    background:none;border:none;padding:0;margin:0;color:var(--faint);cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;
  }
  .group-icon-btn svg{width:14px;height:14px;}
  .group-icon-btn:hover{color:var(--violet);}
  .group-icon-btn.assigned{color:var(--violet);}
  /* Appended directly to <body> (not nested inside the swipe-card, which
     clips overflow) and positioned with fixed coordinates computed in JS,
     so it always renders on top and is never cut off. */
  .group-picker{
    position:fixed;z-index:9999;min-width:180px;max-width:240px;max-height:280px;overflow-y:auto;
    background:var(--panel2);border:1px solid var(--border);border-radius:10px;
    padding:8px;display:flex;flex-direction:column;gap:2px;
    box-shadow:0 12px 32px rgba(0,0,0,.5);
  }
  .group-picker-title{font:700 10px var(--font-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--faint);padding:2px 6px 6px;}
  .group-picker-list{display:flex;flex-direction:column;gap:1px;}
  .group-picker-item{
    display:flex;align-items:center;gap:9px;color:var(--text);
    font:600 12px var(--font-mono);padding:8px;border-radius:6px;cursor:pointer;
  }
  .group-picker-item:hover{background:var(--panel);}
  .group-picker-item input[type="checkbox"]{
    width:14px;height:14px;flex-shrink:0;accent-color:var(--violet);cursor:pointer;
  }
  .group-picker-empty{font:11px var(--font-mono);color:var(--faint);padding:6px;max-width:200px;white-space:normal;line-height:1.5;}

  /* ---- Collapsible coin groups ---- */
  .coin-group{
    background:var(--panel);border:1px solid var(--border);border-radius:14px;
    padding:12px 14px;margin-bottom:10px;
  }
  .coin-group-header{
    width:100%;background:none;border:none;padding:0;margin:0;cursor:pointer;
    display:flex;align-items:center;gap:9px;color:var(--text);
  }
  .coin-group-chevron{
    flex-shrink:0;width:18px;height:18px;color:var(--muted);transition:transform .2s ease;
    display:flex;align-items:center;justify-content:center;
  }
  .coin-group-chevron svg{width:12px;height:12px;}
  .coin-group.collapsed .coin-group-chevron{transform:rotate(-90deg);}
  .coin-group-name{font:700 13px var(--font-display);flex:1;text-align:left;}
  .coin-group-count{font:600 11px var(--font-mono);color:var(--faint);background:var(--panel2);border-radius:20px;padding:2px 8px;}
  .coin-group-body{max-height:4000px;overflow:hidden;transition:max-height .25s ease,margin-top .2s ease;margin-top:12px;}
  .coin-group.collapsed .coin-group-body{max-height:0;margin-top:0;}
  .coin-group .watch-list{margin-bottom:0;}
  .coin-group-empty{font:12px var(--font-mono);color:var(--faint);padding:10px 2px;}

  /* ---- Top Movers section (mirrors defi.html's Market Movers panel,
     rendered as its own collapsible group above the user's coin groups) ---- */
  .movers-note{font:11px var(--font-mono);color:var(--faint);padding:0 2px 10px;}
  .movers-grid{display:grid;grid-template-columns:1fr;gap:14px;}
  @media(min-width:560px){ .movers-grid{grid-template-columns:1fr 1fr;} }
  .movers-col-title{font:700 11px var(--font-mono);text-transform:uppercase;letter-spacing:.06em;padding:2px 2px 4px;}
  .movers-col-title.gain{color:var(--accent);}
  .movers-col-title.lose{color:var(--red);}
  .mover-row{display:flex;align-items:center;gap:10px;padding:7px 2px;}
  .mover-row img{width:24px;height:24px;border-radius:50%;flex-shrink:0;background:var(--panel2);}
  .mover-info{flex:1;min-width:0;}
  .mover-name{font-size:12.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .mover-price{font:10.5px var(--font-mono);color:var(--faint);}
  .chg-pill{font:600 10px var(--font-mono);padding:1px 5px;border-radius:6px;white-space:nowrap;flex-shrink:0;}
  .chg-pill.up{color:var(--accent);background:rgba(53,224,192,.1);}
  .chg-pill.down{color:var(--red);background:rgba(255,84,112,.1);}
  .chg-pill.flat{color:var(--muted);background:rgba(139,147,163,.1);}

  /* ---- Group manager (add / remove / reorder groups) ---- */
  .group-manager{
    background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:14px 16px;margin-top:14px;
  }
  .group-manager-header{
    width:100%;background:none;border:none;padding:0;margin:0;cursor:pointer;
    display:flex;align-items:center;gap:9px;color:var(--text);margin-bottom:10px;
  }
  .group-manager-chevron{
    flex-shrink:0;width:18px;height:18px;color:var(--muted);transition:transform .2s ease;
    display:flex;align-items:center;justify-content:center;
  }
  .group-manager-chevron svg{width:12px;height:12px;}
  .group-manager.collapsed .group-manager-chevron{transform:rotate(-90deg);}
  .group-manager-title{font:700 12px var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);flex:1;text-align:left;margin-bottom:0;}
  .group-manager-count{font:600 11px var(--font-mono);color:var(--faint);background:var(--panel2);border-radius:20px;padding:2px 8px;}
  .group-manager-body{max-height:2000px;overflow:hidden;transition:max-height .25s ease,opacity .18s ease;opacity:1;}
  .group-manager.collapsed .group-manager-body{max-height:0;opacity:0;}
  .group-manager-list{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;}
  .group-manage-row{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:var(--panel2);border:1px solid var(--border-soft);border-radius:9px;padding:8px 10px;
  }
  .group-manage-name{font:600 12.5px var(--font-display);}
  .group-manage-actions{display:flex;align-items:center;gap:6px;}
  .group-move-btn{
    background:var(--panel);border:1px solid var(--border);color:var(--text);
    width:24px;height:24px;border-radius:6px;cursor:pointer;font:700 11px var(--font-mono);
  }
  .group-move-btn:hover:not(:disabled){border-color:var(--gold);color:var(--gold);}
  .group-move-btn:disabled{opacity:.35;cursor:default;}
  .group-remove-btn{
    background:none;border:1px solid var(--border);color:var(--red);
    padding:5px 9px;border-radius:6px;cursor:pointer;font:700 10.5px var(--font-mono);
  }
  .group-remove-btn:hover{border-color:var(--red);background:rgba(255,84,112,.08);}
  .group-manage-empty{font:12px var(--font-mono);color:var(--faint);padding:2px 0;}
  .group-add-form{display:flex;gap:8px;}
  .group-add-input{
    flex:1;min-width:0;background:var(--panel2);border:1px solid var(--border);color:var(--text);
    border-radius:8px;padding:8px 10px;font:12px var(--font-mono);
  }
  .group-add-input:focus{outline:none;border-color:var(--violet);}
  .group-add-btn{
    flex-shrink:0;background:var(--violet);border:none;color:#141221;
    padding:8px 14px;border-radius:8px;cursor:pointer;font:700 11.5px var(--font-mono);
  }
  .group-add-btn:hover{filter:brightness(1.1);}
  .group-manage-row.is-ungrouped-section{border-style:dashed;border-color:var(--border);}
  .group-ungrouped-toggle{
    display:flex;align-items:flex-start;gap:9px;margin-top:12px;padding-top:12px;
    border-top:1px solid var(--border-soft);cursor:pointer;
  }
  .group-ungrouped-toggle input[type="checkbox"]{
    width:15px;height:15px;flex-shrink:0;margin-top:1px;accent-color:var(--violet);cursor:pointer;
  }
  .group-ungrouped-toggle span{font:600 11.5px var(--font-mono);color:var(--muted);line-height:1.5;}

  /* ---- Analysis overlay (embeds screener.html's own analysis modal, over this page) ---- */
  .analysis-overlay{
    position:fixed;inset:0;background:rgba(5,6,9,.82);z-index:999;
    display:none;align-items:stretch;justify-content:center;
  }
  .analysis-overlay.open{display:flex;}
  .analysis-overlay-inner{position:relative;width:100%;height:100%;background:var(--bg);}
  .analysis-overlay-close{
    position:absolute;top:12px;right:12px;z-index:2;
    width:34px;height:34px;border-radius:9px;
    background:var(--panel);border:1px solid var(--border);color:var(--text);
    font:700 16px var(--font-mono);line-height:1;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .analysis-overlay-close:hover{border-color:var(--red);color:var(--red);}
  .analysis-overlay-frame{width:100%;height:100%;border:0;display:block;}
  .watch-error-msg{color:var(--faint);font:12px var(--font-mono);}

  /* ---- Disclaimer / about panel ---- */
  .notice{
    background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:14px 16px;margin:22px 0 22px;font-size:12px;line-height:1.6;color:var(--muted);
  }
  .notice b{color:var(--text);}
  .notice-summary{display:flex;align-items:center;gap:8px;}
  .notice-toggle{
    flex-shrink:0;width:20px;height:20px;padding:0;border-radius:6px;
    background:var(--panel2);border:1px solid var(--border);color:var(--muted);
    font:700 13px var(--font-mono);line-height:1;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:transform .15s, color .15s, border-color .15s;
  }
  .notice-toggle:hover{border-color:var(--gold);color:var(--gold);}
  .notice-toggle.open{transform:rotate(45deg);}
  .notice-details{margin-top:10px;}
  .notice-details[hidden]{display:none;}
  .notice .src-tags{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
  .src-tag{
    display:inline-flex;align-items:center;gap:6px;font:600 10.5px var(--font-mono);
    padding:4px 9px;border-radius:20px;border:1px solid var(--border);color:var(--muted);
  }
  .src-tag .dot{width:6px;height:6px;border-radius:50%;background:var(--gold);}

  .page-skeleton{display:flex;flex-direction:column;gap:10px;}
  .skel-card{height:150px;border-radius:14px;background:linear-gradient(90deg,var(--panel) 25%,var(--panel2) 37%,var(--panel) 63%);background-size:400% 100%;animation:shimmer 1.4s ease infinite;}
  @keyframes shimmer{0%{background-position:100% 0;}100%{background-position:0 0;}}

  .error-state{
    padding:34px 20px;text-align:center;color:#ffb3c1;font:12.5px var(--font-mono);
    border:1px dashed rgba(255,84,112,.3);border-radius:12px;line-height:1.7;
  }
  .retry-btn{
    margin-top:12px;background:transparent;border:1px solid var(--border);color:var(--text);
    padding:8px 16px;border-radius:8px;font:600 12px var(--font-mono);cursor:pointer;
  }
  .retry-btn:hover{border-color:var(--gold);color:var(--gold);}

</style>
</head>
<body>

<div class="analysis-overlay" id="analysisOverlay">
  <div class="analysis-overlay-inner">
    <button class="analysis-overlay-close" id="analysisOverlayClose" type="button" aria-label="Close analysis">×</button>
    <iframe class="analysis-overlay-frame" id="analysisOverlayFrame" title="Coin analysis" src="about:blank"></iframe>
  </div>
</div>

<div class="wrap">

  <div class="topheader">
    <div class="eyebrow"><span class="dot"></span>Watchlist</div>
    <div class="header-right">
      <span class="updated-label" id="updatedLabel"></span>
      <button class="refresh-btn" id="toggleAllGroupsBtn" type="button" aria-label="Collapse all groups" title="Collapse all groups" style="display:none;">
