name: hyperliquid-liq-snapshot
on:
  # Trigger from cron-job.org via the workflow_dispatch API like the other
  # data workflows (GitHub's native schedule is unreliable); the cron below is
  # only a backstop.
  workflow_dispatch: {}
  schedule:
    - cron: '*/30 * * * *'
permissions:
  contents: write
concurrency:
  group: hl-liq
  cancel-in-progress: true
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build Hyperliquid liquidation snapshot
        run: node scripts/hl-liq.js

      - name: Commit
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/hl-liq.json
          git diff --cached --quiet && exit 0
          git commit -m "update hl-liq data"
          for i in 1 2 3 4 5; do
            if git pull --rebase -X theirs origin main && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((RANDOM % 10 + 3))
          done
          echo "push failed after retries"; exit 1
