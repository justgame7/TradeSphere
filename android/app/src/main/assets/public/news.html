<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Crypto News</title>
<style>
:root{--bg:#0b0e17;--panel:#131826;--border:#242c42;--text:#e6e9f2;--muted:#8b93a8;--faint:#59637b;--accent:#8b5cf6}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}body{padding:24px 18px 40px}.wrap{max-width:1180px;margin:auto}.eyebrow{color:var(--accent);font:11px monospace;letter-spacing:.15em;margin-bottom:10px}h1{font-size:26px;margin:0 0 6px}.sub{color:var(--muted);font-size:13px;line-height:1.5;margin-bottom:22px}.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.status{color:var(--muted);font:11px monospace}button{padding:8px 12px;border:1px solid var(--border);border-radius:7px;background:transparent;color:var(--text);cursor:pointer}button:hover{border-color:var(--accent);color:var(--accent)}.news-list{display:grid;gap:9px}.article{display:grid;grid-template-columns:46px 1fr auto;gap:14px;padding:14px;background:var(--panel);border:1px solid var(--border);border-radius:8px}.rank{color:var(--accent);font:bold 14px monospace}.source{color:var(--faint);font:10px monospace;text-transform:uppercase;margin-bottom:6px}.title{color:var(--text);font-size:14px;font-weight:bold;line-height:1.4;text-decoration:none}.title:hover{color:var(--accent)}.date{color:var(--faint);font:10px monospace;white-space:nowrap}.empty{padding:26px;color:var(--faint);font:12px monospace;text-align:center;border:1px dashed var(--border);border-radius:8px}.error{color:#ffb3c1}@media(max-width:600px){.article{grid-template-columns:32px 1fr;gap:9px}.date{grid-column:2}}
</style></head><body><div class="wrap"><div class="eyebrow">MARKET BRIEF · CRYPTO NEWS</div><h1>Top Crypto News</h1><div class="toolbar"><span class="status" id="status">Loading latest articles...</span></div><main class="news-list" id="newsList"><div class="empty">Fetching the latest articles...</div></main></div>
<script>
const sources=[{name:'CoinDesk',feed:'https://www.coindesk.com/arc/outboundfeeds/rss/'},{name:'Cointelegraph',feed:'https://cointelegraph.com/rss'},{name:'Decrypt',feed:'https://decrypt.co/feed'},{name:'Bitcoin.com',feed:'https://news.bitcoin.com/feed/'},{name:'Blockworks',feed:'https://blockworks.co/feed'},{name:'The Block',feed:'https://www.theblock.co/rss.xml'}],fomcDates=['2026-09-16','2026-10-28','2026-12-09'],list=document.getElementById('newsList'),status=document.getElementById('status');let timer;
function esc(value){return String(value).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function date(value){return new Intl.DateTimeFormat(undefined,{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date(value))}function normalize(value){return String(value).toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim()}function similar(first,second){const firstWords=new Set(normalize(first).split(' ').filter(word=>word.length>2)),secondWords=new Set(normalize(second).split(' ').filter(word=>word.length>2));if(!firstWords.size||!secondWords.size)return false;let overlap=0;firstWords.forEach(word=>{if(secondWords.has(word))overlap++});return overlap/Math.min(firstWords.size,secondWords.size)>=.65}function distinct(items){return items.sort((first,second)=>new Date(second.pubDate)-new Date(first.pubDate)).filter((item,index,all)=>!all.slice(0,index).some(previous=>similar(item.title,previous.title)))}function fomc(){const next=fomcDates.find(value=>new Date(value+'T00:00:00')>=new Date());if(!next)return'TBD';const date=new Date(next+'T00:00:00');return String(date.getUTCDate()).padStart(2,'0')+'-'+['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'][date.getUTCMonth()]+'-'+date.getUTCFullYear()}function render(items){list.innerHTML=items.slice(0,15).map((item,index)=>`<article class="article"><div class="rank">${String(index+1).padStart(2,'0')}</div><div><div class="source">${esc(item.source)}</div><a class="title" href="${esc(item.link)}" target="_blank" rel="noopener noreferrer">${esc(item.title)}</a></div><time class="date">${date(item.pubDate)}</time></article>`).join('')}
async function load(){status.textContent='Refreshing latest articles...';try{const results=await Promise.allSettled(sources.map(async source=>{const response=await fetch('https://api.rss2json.com/v1/api.json?rss_url='+encodeURIComponent(source.feed),{cache:'no-store'});if(!response.ok)throw Error();const data=await response.json();return Array.isArray(data.items)?data.items.filter(item=>item.title&&item.link).map(item=>({...item,source:source.name})):[]})),items=distinct(results.filter(result=>result.status==='fulfilled').flatMap(result=>result.value));if(!items.length)throw Error();render(items);status.textContent='Updated '+new Intl.DateTimeFormat(undefined,{hour:'2-digit',minute:'2-digit'}).format(new Date())+' · FOMC: '+fomc()}catch(error){list.innerHTML='<div class="empty error">News could not be loaded. Try again later.</div>';status.textContent='Unable to load news'}finally{schedule()}}
function schedule(){clearTimeout(timer);timer=setTimeout(load,60*60*1000)}load();
</script></body></html>
